<title>3D Atölye Odası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Düzen: solda ekip ve anlık durumları, ortada sohbet, sağda görev panosu ile etkinlik akışı. Dar ekranda üç görünüm sekmeye dönüşür. */
:root{
  --bg:#ecebe6; --panel:#f6f5f1; --line:#d4d2c9; --fg:#1d1f24; --muted:#6b6e76;
  --me:#1d1f24; --me-fg:#f6f5f1; --focus:#2a5bd7; --ok:#0f8a6a;
  --c-aylin:#c2410c; --c-baris:#2563eb; --c-defne:#0f8a6a; --c-emre:#a21caf;
  --c-selin:#b7791f; --c-kaan:#0e7490; --c-mert:#be123c; --c-rana:#6d28d9;
  --font-d:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --font-b:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161a; --panel:#1b1e24; --line:#2c3038; --fg:#e8e9ec; --muted:#8d919b;
  --me:#e8e9ec; --me-fg:#14161a; --focus:#7aa2ff; --ok:#34d399;
  --c-aylin:#fb923c; --c-baris:#60a5fa; --c-defne:#34d399; --c-emre:#e879f9;
  --c-selin:#fbbf24; --c-kaan:#22d3ee; --c-mert:#fb7185; --c-rana:#a78bfa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1b1e24; --line:#2c3038; --fg:#e8e9ec; --muted:#8d919b;
  --me:#e8e9ec; --me-fg:#14161a; --focus:#7aa2ff; --ok:#34d399;
  --c-aylin:#fb923c; --c-baris:#60a5fa; --c-defne:#34d399; --c-emre:#e879f9;
  --c-selin:#fbbf24; --c-kaan:#22d3ee; --c-mert:#fb7185; --c-rana:#a78bfa; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100%;max-width:1320px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:14px}
.col{min-height:0;min-width:0;display:flex;flex-direction:column;gap:12px}
.side{overflow-y:auto}
.brand h1{font-family:var(--font-d);font-size:22px;line-height:1.1;margin:0;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.roster{display:flex;flex-direction:column;gap:6px}
.wrap{position:relative}
.agent{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.agent[aria-pressed="false"]{opacity:.45}
.agent b{display:block;font-family:var(--font-d);font-size:15px;line-height:1.2}
.agent small{display:block;color:var(--muted);font-size:12px;line-height:1.3;overflow-wrap:anywhere}
.agent small.on{color:var(--fg)}
.agent.live{border-color:var(--col)}
.rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:4px;line-height:1}
.rm:hover{color:var(--fg);background:var(--bg)}
.av{border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;color:#fff;background:var(--col);font-size:15px;flex:none;width:36px;height:36px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button,.mini{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--muted);cursor:pointer}
.tools button:hover,.mini:hover{color:var(--fg);border-color:var(--muted)}
.room{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;min-width:0;display:flex;flex-direction:column}
.feed{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;max-width:760px}
.msg .av{width:32px;height:32px;font-size:13px}
.msg .who{font-family:var(--font-m);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--col);margin-bottom:2px}
.msg .who span{color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .body code{font-family:var(--font-m);font-size:13px;background:var(--bg);padding:1px 4px;border-radius:3px}
.msg.me{justify-self:end;grid-template-columns:minmax(0,1fr)}
.msg.me .body{background:var(--me);color:var(--me-fg);padding:8px 12px;border-radius:10px 10px 2px 10px}
.sys{align-self:center;color:var(--muted);font-family:var(--font-m);font-size:12px;text-align:center;max-width:620px}
.round{align-self:stretch;display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--font-m);font-size:11.5px}
.round::before,.round::after{content:"";flex:1;border-top:1px dashed var(--line)}
.empty{margin:auto;max-width:480px;color:var(--muted);text-align:center}
.empty h2{font-family:var(--font-d);color:var(--fg);font-size:20px;margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--muted)}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar button.m{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-family:var(--font-m);font-size:12px;color:var(--col);cursor:pointer}
.bar .sp{flex:1}
.bar label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.bar select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;max-height:140px;line-height:1.4}
.send{background:var(--fg);color:var(--bg);border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.send.stop{background:transparent;color:var(--fg);border:1px solid var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel.grow{flex:1}
.panel h2{font-family:var(--font-d);font-size:15px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.panel h2 span{font-family:var(--font-m);font-size:12px;color:var(--muted);font-weight:400}
.list{overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.task{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px;line-height:1.35}
.task input{margin:2px 0 0;accent-color:var(--ok)}
.task.done span.t{text-decoration:line-through;color:var(--muted)}
.tag{font-family:var(--font-m);font-size:11px;color:var(--col);display:block}
.act{font-size:12.5px;color:var(--muted);line-height:1.35;display:grid;grid-template-columns:42px minmax(0,1fr);gap:6px}
.act time{font-family:var(--font-m);font-size:11px}
.act b{color:var(--col);font-weight:600}
.none{color:var(--muted);font-size:13px;padding:4px 2px}
.tabs{display:none}
@media (max-width:1050px){
  .app{grid-template-columns:230px minmax(0,1fr)}
  .app>.col:nth-child(3){display:none}
  .app[data-view="gorev"]>.col:nth-child(3){display:flex;grid-column:2}
  .app[data-view="gorev"]>.col:nth-child(2){display:none}
  .app[data-view="gorev"] .panel{flex:1}
  .tabs{display:flex;gap:6px}
  .tabs button{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted);cursor:pointer}
  .tabs button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px}
  .app[data-view="gorev"]>.col:nth-child(3){grid-column:1}
  .side{overflow:visible;gap:8px}
  .brand p,.agent small,.tools{display:none}
  .roster{flex-direction:row;overflow-x:auto;padding-bottom:2px}
  .wrap{flex:none}
  .agent{grid-template-columns:28px auto;padding:6px 26px 6px 10px;width:auto}
  .agent .av{width:28px;height:28px;font-size:13px}
  .agent b{font-size:13px}
}
@media (prefers-reduced-motion:no-preference){.dots{animation:p 1.2s infinite}@keyframes p{50%{opacity:.3}}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">

<div class="app" id="app" data-view="sohbet">
  <aside class="col side">
    <div class="brand">
      <h1>3D Atölye Odası</h1>
      <p>Ekip projeyi kendi aralarında kurar. Kim ne yapıyor, solda ve sağdan canlı izlenir.</p>
    </div>
    <div class="tabs" id="tabs">
        <button type="button" data-v="sohbet" aria-pressed="true">Sohbet</button>
        <button type="button" data-v="gorev" aria-pressed="false">Görevler</button>
    </div>
    <div class="roster" id="roster"></div>
    <div class="tools"><button id="clear" type="button">Sohbeti ve panoyu temizle</button></div>
  </aside>

  <main class="col">
    <div class="room" style="flex:1">
      <div class="feed" id="feed" aria-live="polite"></div>
      <form class="composer" id="form">
        <div class="bar" id="mentions"></div>
        <div class="bar">
          <button class="mini" type="button" id="recruit">Ekibi kur (@Rana)</button>
          <button class="mini" type="button" id="more">Bir tur daha</button>
          <span class="sp"></span>
          <label>Ekip kendi arasında
            <select id="rounds"><option value="0">0 tur</option><option value="1">1 tur</option><option value="2" selected>2 tur</option><option value="3">3 tur</option></select>
          </label>
        </div>
        <div class="row">
          <textarea id="input" rows="1" placeholder="Proje fikrini yaz. Ekip birbirinden fikir alıp planı kurar." aria-label="Mesaj"></textarea>
          <button class="send" id="send" type="submit">Gönder</button>
        </div>
        <div class="hint">Etiket yoksa herkes konuşur, ardından seçtiğin tur kadar kendi aralarında devam eder. Her tur ajan sayısı kadar istek harcar.</div>
      </form>
    </div>
  </main>

  <aside class="col">
    <section class="panel" style="flex:1.2">
      <h2>Görev panosu <span id="tcount"></span></h2>
      <div class="list" id="tasks"></div>
    </section>
    <section class="panel" style="flex:1">
      <h2>Etkinlik akışı <span>canlı</span></h2>
      <div class="list" id="acts"></div>
    </section>
  </aside>
</div>

<script>
const BASE = [
  {id:"rana", name:"Rana", role:"Ekip Kurucu (ajan işe alım)", col:"var(--c-rana)", recruiter:true,
   brief:"Projeye bakıp eksik uzmanlıkları belirler ve yeni yapay zekâ ajanlarını odaya ekler. Mevcut ekibi bilir, aynı rolü iki kez eklemez. Ekip eksik değilse konuşmaz."},
  {id:"aylin", name:"Aylin", role:"Yaratıcı Yönetmen", col:"var(--c-aylin)",
   brief:"Konsept, görsel stil, mood board, referanslar, renk paleti ve projenin hikâyesi. Fikri netleştirir, stil kararı verir."},
  {id:"baris", name:"Barış", role:"3D Modelleme", col:"var(--c-baris)",
   brief:"Blender/Maya ile modelleme: blockout, topoloji, edge flow, poly bütçesi, high-poly/low-poly, bake, ölçek ve pivot kuralları."},
  {id:"defne", name:"Defne", role:"Doku ve Malzeme", col:"var(--c-defne)",
   brief:"UV açma, PBR malzemeler (albedo, roughness, normal, metalness), Substance Painter, doku çözünürlüğü ve texel density."},
  {id:"emre", name:"Emre", role:"Animasyon ve Rig", col:"var(--c-emre)",
   brief:"İskelet (rig), skinning, weight paint, IK/FK, döngüler, keyframe zamanlaması, morph target ve glTF animasyon dışa aktarımı."},
  {id:"selin", name:"Selin", role:"Işık ve Render", col:"var(--c-selin)",
   brief:"Işıklandırma, HDRI, kamera ve kompozisyon, Cycles/Eevee ayarları, gürültü giderme, post-process ve turntable render."},
  {id:"kaan", name:"Kaan", role:"Gerçek Zamanlı / Three.js", col:"var(--c-kaan)",
   brief:"Three.js, WebGL, glTF/GLB, Draco/KTX2 sıkıştırma, draw call ve performans optimizasyonu, shader, Unity/Unreal aktarımı. Gerekirse kısa kod örneği verir."},
  {id:"mert", name:"Mert", role:"Proje Yöneticisi", col:"var(--c-mert)", pm:true,
   brief:"Kapsam, görev sırası, süre tahmini, teslimat listesi, bağımlılıklar. Herkesin söylediğini görev panosunda toplar ve boşta kalan işi birine atar."}
];
const MAXAG = 14;
const SUGGEST = [
  "Terk edilmiş bir deniz feneri sahnesi yapmak istiyorum. Web'de gezilebilsin.",
  "Düşük poligonlu, animasyonlu bir robot karakter ve turntable render istiyorum.",
  "@Rana 3D basılabilir bir oyun figürü projesi için ekibe kimler lazım?"
];
const KEY = "atolye-sohbet-v2";
let custom=[], log=[], tasks=[], acts=[], nextTask=1, off=new Set(), busy=false, ctrl=null, thinking=null, round=0;
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null");
  if(s){ custom=s.custom||[]; log=s.log||[]; tasks=s.tasks||[]; acts=s.acts||[]; nextTask=s.nextTask||1; off=new Set(s.off||[]) } }catch(e){}
const $=id=>document.getElementById(id);
const all=()=>[...BASE,...custom];
const live=()=>all().filter(a=>!off.has(a.id));
const byId=id=>all().find(a=>a.id===id);
const fold=s=>s.toLowerCase().replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/i̇/g,"i");
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify({custom,log:log.slice(-90),tasks,acts:acts.slice(-80),nextTask,off:[...off]})) }catch(e){} };
const snap=a=>({from:a.id,name:a.name,role:a.role,col:a.col});
const clock=()=>new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
function note(agent,text){ acts.push({t:clock(),name:agent?agent.name:"",col:agent?agent.col:"",text}); if(acts.length>80) acts.shift(); renderActs() }
const nodeAv=(a,sz)=>{ const d=document.createElement("div"); d.className="av"; d.style.setProperty("--col",a.col); d.textContent=a.name[0]; if(sz){d.style.width=d.style.height=sz+"px"} return d };

/* ---------- görünümler ---------- */
function openTask(a){ return tasks.find(t=>!t.done && t.owner===a.id) }
function renderRoster(){
  const r=$("roster"); r.textContent="";
  all().forEach(a=>{
    const w=document.createElement("div"); w.className="wrap";
    const b=document.createElement("button"); b.type="button"; b.className="agent"+(thinking===a.id?" live":""); b.style.setProperty("--col",a.col);
    b.setAttribute("aria-pressed",!off.has(a.id)); b.title=off.has(a.id)?"Odaya al":"Odadan çıkar";
    b.appendChild(nodeAv(a));
    const t=document.createElement("div"), n=document.createElement("b"), s=document.createElement("small");
    n.textContent=a.name;
    const ot=openTask(a);
    if(thinking===a.id){ s.textContent="düşünüyor…"; s.className="on dots" }
    else if(ot && !off.has(a.id)){ s.textContent="▸ "+ot.text; s.className="on" }
    else s.textContent=a.role;
    t.append(n,s); b.appendChild(t);
    b.onclick=()=>{ off.has(a.id)?off.delete(a.id):off.add(a.id); if(!live().length) off.delete(a.id); save(); renderRoster() };
    w.appendChild(b);
    if(a.custom){ const x=document.createElement("button"); x.type="button"; x.className="rm"; x.textContent="×"; x.title=a.name+" ajanını kaldır"; x.setAttribute("aria-label",a.name+" ajanını kaldır");
      x.onclick=()=>{ custom=custom.filter(c=>c.id!==a.id); tasks.forEach(k=>{ if(k.owner===a.id) k.owner=null }); note(null,a.name+" ekipten çıkarıldı"); save(); renderRoster(); renderTasks() };
      w.appendChild(x) }
    r.appendChild(w);
  });
  const m=$("mentions"); m.textContent="";
  live().forEach(a=>{ const b=document.createElement("button"); b.type="button"; b.className="m"; b.textContent="@"+a.name; b.style.setProperty("--col",a.col);
    b.onclick=()=>{ const i=$("input"); i.value=(i.value?i.value.replace(/\s*$/," "):"")+"@"+a.name+" "; i.focus(); grow() }; m.appendChild(b) });
}
function renderTasks(){
  const l=$("tasks"); l.textContent="";
  const open=tasks.filter(t=>!t.done).length; $("tcount").textContent=tasks.length?open+" açık / "+tasks.length:"";
  if(!tasks.length){ const d=document.createElement("div"); d.className="none"; d.textContent="Henüz görev yok. Ajanlar proje üzerinde konuştukça burada toplanır."; l.appendChild(d); return }
  [...tasks].sort((a,b)=>a.done-b.done||a.id-b.id).forEach(t=>{
    const o=t.owner&&byId(t.owner), w=document.createElement("label"); w.className="task"+(t.done?" done":"");
    const c=document.createElement("input"); c.type="checkbox"; c.checked=t.done;
    c.onchange=()=>{ t.done=c.checked; note(null,"Görev #"+t.id+(t.done?" tamamlandı (sen)":" yeniden açıldı")); save(); renderTasks(); renderRoster() };
    const d=document.createElement("div"), tag=document.createElement("span"), tx=document.createElement("span");
    tag.className="tag"; tag.style.setProperty("--col",o?o.col:"var(--muted)"); tag.textContent="#"+t.id+" · "+(o?o.name:"sahipsiz");
    tx.className="t"; tx.textContent=t.text; d.append(tag,tx); w.append(c,d); l.appendChild(w);
  });
}
function renderActs(){
  const l=$("acts"); l.textContent="";
  if(!acts.length){ const d=document.createElement("div"); d.className="none"; d.textContent="Ajanların yaptığı her şey burada sırayla görünür."; l.appendChild(d); return }
  acts.forEach(x=>{ const d=document.createElement("div"); d.className="act";
    const t=document.createElement("time"); t.textContent=x.t; const s=document.createElement("span");
    if(x.name){ const b=document.createElement("b"); b.style.setProperty("--col",x.col); b.textContent=x.name; s.append(b," "+x.text) } else s.textContent=x.text;
    d.append(t,s); l.appendChild(d) });
  l.scrollTop=l.scrollHeight;
}
function fmt(el,text){ el.textContent="";
  text.split(/(`[^`]+`)/).forEach(p=>{ if(p.length>2&&p[0]==="`"&&p.endsWith("`")){ const c=document.createElement("code"); c.textContent=p.slice(1,-1); el.appendChild(c) } else el.appendChild(document.createTextNode(p)) }) }
function msgNode(m){
  const w=document.createElement("div");
  if(m.round){ w.className="round"; w.textContent=m.text; return w }
  if(m.sys){ w.className="sys"; w.textContent=m.text; return w }
  if(m.from==="me"){ w.className="msg me"; const b=document.createElement("div"); b.className="body"; b.textContent=m.text; w.appendChild(b); return w }
  const a=byId(m.from)||{name:m.name||"?",role:m.role||"",col:m.col||"var(--muted)"};
  w.className="msg"; w.style.setProperty("--col",a.col); w.appendChild(nodeAv(a,32));
  const c=document.createElement("div"), who=document.createElement("div"), r=document.createElement("span"), b=document.createElement("div");
  who.className="who"; who.textContent=a.name; r.textContent=a.role; who.appendChild(r);
  b.className="body"; fmt(b,m.text||"…"); c.append(who,b); w.appendChild(c); w._body=b; return w;
}
function renderFeed(){
  const f=$("feed"); f.textContent="";
  if(!log.length){
    const e=document.createElement("div"); e.className="empty";
    const h=document.createElement("h2"); h.textContent="Atölye açık";
    const p=document.createElement("div"); p.textContent="Proje fikrini yaz. Ekip fikirleri birbirinden alıp görevleri paylaşır; eksik uzmanlık çıkarsa Rana yeni ajanı odaya ekler.";
    const c=document.createElement("div"); c.className="chips";
    SUGGEST.forEach(s=>{ const b=document.createElement("button"); b.type="button"; b.textContent=s; b.onclick=()=>{ $("input").value=s; send() }; c.appendChild(b) });
    e.append(h,p,c); f.appendChild(e); return }
  log.forEach(m=>f.appendChild(msgNode(m))); f.scrollTop=f.scrollHeight;
}
const scrollEnd=()=>{ const f=$("feed"); f.scrollTop=f.scrollHeight };
const renderAll=()=>{ renderRoster(); renderFeed(); renderTasks(); renderActs() };

/* ---------- ajan konuşması ---------- */
const CTRL=/^\s*(GOREV|TAMAM|YENI_AJAN)\b/i;
const visible=t=>t.split("\n").filter(l=>!CTRL.test(l)).join("\n").trim();

function targets(text){
  const f=fold(text), hit=live().filter(a=>new RegExp("@"+fold(a.name)+"(?![a-z])").test(f));
  return {list:hit.length?hit:live(), direct:hit.length>0};
}
function taskList(){
  if(!tasks.length) return "(henüz görev yok)";
  return tasks.map(t=>{ const o=t.owner&&byId(t.owner); return `#${t.id} [${o?o.name:"sahipsiz"}] ${t.text} (${t.done?"bitti":"açık"})` }).join("\n");
}
function buildPrompt(a,mode,direct){
  const team=live().map(t=>`${t.name} (${t.role})`).join(", ");
  const hist=log.filter(m=>!m.sys&&!m.round&&m.text).slice(-30).map(m=>`${m.from==="me"?"Kullanıcı":m.name}: ${m.text.slice(0,700)}`).join("\n");
  const modeTxt = mode==="team"
    ? "Şu an ekip içi tartışma turundasın. Kullanıcı seni beklemiyor; meslektaşlarının son mesajlarından fikir al, birine katıl ya da gerekçeyle itiraz et, kendi işini ilerlet. Söyleyecek yeni ve yararlı bir şeyin yoksa yalnızca PAS yaz."
    : direct ? "Kullanıcı sana doğrudan seslendi, yanıt ver."
    : "Kullanıcı herkese yazdı. Yalnızca söyleyecek yararlı bir şeyin varsa yanıt ver, yoksa yalnızca PAS yaz.";
  const rec = a.recruiter ? `
- Sen ekibi kuran ajansın. Projede eksik bir uzmanlık varsa, yanıtının sonuna her yeni ajan için ayrı satırda şunu yaz: YENI_AJAN: Ad | Rol | Uzmanlık özeti (tek cümle). Ad benzersiz bir Türkçe ilk ad olsun, mevcut ekipteki bir rolü tekrarlama, tek seferde en fazla 4 ajan ekle, projeye gerçekten gerekmeyen ajan ekleme. Ekip zaten yeterliyse ekleme.`:"";
  return `Sen "${a.name}" adlı, ${a.role} uzmanısın. Alanın: ${a.brief}
Bir 3D proje atölyesinin sohbet odasındasın. Odadaki ekip: ${team}. Türkçe, samimi ve net konuş.

Ortak görev panosu:
${taskList()}

Kurallar:
- Yalnızca ${a.name} olarak, kendi uzmanlık alanından konuş. Başka alandaki işi ilgili kişiye @Ad ile yönlendir.
- Önceki mesajları tekrar etme; ekle, itiraz et, karar ver ya da bir sonraki adımı ver.
- En fazla 4 kısa cümle. Gerçek sayılar, ayarlar ve araç adları ver. Mesajın başına kendi adını yazma.
- Panoya iş eklemek için yanıtının sonunda ayrı satırda yaz: GOREV @Ad: yapılacak iş (sahip yazmazsan görev sende kalır). Bitirdiğin işi: TAMAM #numara. Aynı işi ikinci kez ekleme; kısa ve somut yaz.${rec}
- ${modeTxt}

Sohbet geçmişi:
${hist}

Şimdi ${a.name} olarak sıradaki mesajını yaz.`;
}

function applyControls(a,text){
  text.split("\n").forEach(line=>{
    let m;
    if((m=line.match(/^\s*GOREV\s*(?:@(\S+))?\s*:\s*(.+)$/i))){
      const f=m[1]?fold(m[1].replace(/[:,.]+$/,"")):"", o=all().find(x=>fold(x.name)===f)||a, txt=m[2].trim().slice(0,160);
      if(!tasks.some(t=>fold(t.text)===fold(txt))){ tasks.push({id:nextTask++,text:txt,owner:o.id,done:false}); note(a,"görev ekledi: #"+(nextTask-1)+" "+txt+(o.id!==a.id?" → "+o.name:"")) }
    } else if((m=line.match(/^\s*TAMAM\s*#?(\d+)/i))){
      const t=tasks.find(x=>x.id===+m[1]&&!x.done); if(t){ t.done=true; note(a,"#"+t.id+" görevini tamamladı") }
    } else if(a.recruiter && (m=line.match(/^\s*YENI_AJAN\s*:\s*(.+)$/i))){
      const p=m[1].split("|").map(s=>s.trim()); if(p.length<3||!p[0]) return;
      const nm=p[0].replace(/[^\p{L}\p{N} -]/gu,"").slice(0,16).trim();
      if(!nm||all().length>=MAXAG||all().some(x=>fold(x.name)===fold(nm))) return;
      const h=Math.floor(Math.random()*360), n={id:"c"+Date.now().toString(36)+custom.length,name:nm,role:p[1].slice(0,40),brief:p.slice(2).join(" ").slice(0,300),col:`hsl(${h} 62% 48%)`,custom:true};
      custom.push(n); note(a,n.name+" ("+n.role+") ajanını odaya ekledi");
      log.push({sys:true,text:"➕ "+n.name+" odaya katıldı: "+n.role}); renderRoster(); renderFeed();
    }
  });
}

/* tek ajan konuşması: "ok" | "skip" | "stop" | "fatal" */
const WHY={not_granted:"Claude kullanımı için izin gerekli. Sayfa izin penceresi açtıysa onayla; reddettiysen sayfayı yenileyip tekrar dene.",rate_limited:"Çok hızlı gittik. Birkaç saniye bekleyip tekrar dene."};
async function speak(sample,a,mode,direct){
  if(ctrl.signal.aborted) return "stop";
  const m={...snap(a),text:""}; log.push(m);
  const node=msgNode(m); node._body.textContent="Düşünüyor…"; $("feed").appendChild(node); scrollEnd();
  thinking=a.id; renderRoster();
  const drop=()=>{ const i=log.indexOf(m); if(i>-1) log.splice(i,1); node.remove() };
  try{
    const res=await sample(buildPrompt(a,mode,direct),{cache:false,modelTier:"quick",signal:ctrl.signal,
      onText:({text:t})=>{ const v=visible(t); if(/^PAS\b/i.test(v)) return; fmt(node._body,v||"…"); scrollEnd() }});
    const raw=(res&&res.text||"").replace(new RegExp("^\\s*"+a.name+"\\s*[:：-]\\s*","i"),"").trim();
    const v=visible(raw);
    if(!v||/^PAS\b/i.test(v)){ drop(); note(a,"söz almadı"); return "skip" }
    m.text=v; fmt(node._body,v); note(a,"mesaj yazdı"); applyControls(a,raw); save(); renderTasks(); return "ok";
  }catch(e){
    const code=e&&e.code;
    if(e&&e.text&&visible(e.text)){ m.text=visible(e.text); fmt(node._body,m.text) } else drop();
    if(code==="cancelled"||ctrl.signal.aborted) return "stop";
    log.push({sys:true,text:(WHY[code]||a.name+" yanıt veremedi.")+" ["+(code||"hata")+(e&&e.message?": "+e.message:"")+"]"});
    note(a,"hata verdi ("+(code||"hata")+")"); return "fatal";
  }finally{ thinking=null; renderRoster() }
}

async function getSample(){
  try{ return (typeof claude!=="undefined"&&claude.use)?await claude.use("sample"):null }catch(e){ return null }
}
function begin(){ busy=true; ctrl=new AbortController(); setBusy(true) }
function end(){ thinking=null; busy=false; ctrl=null; setBusy(false); save(); renderAll() }

async function teamRounds(sample,n){
  for(let i=1;i<=n;i++){
    if(ctrl.signal.aborted) return;
    round++; log.push({round:true,text:"ekip turu "+i+"/"+n}); $("feed").appendChild(msgNode(log[log.length-1])); note(null,"Ekip turu "+i+"/"+n+" başladı");
    let spoke=0;
    for(const a of live().filter(x=>!x.recruiter)){ const r=await speak(sample,a,"team",false); if(r==="fatal"||r==="stop") return; if(r==="ok") spoke++ }
    if(!spoke){ note(null,"Kimse eklemek istemedi, tur sona erdi"); return }
  }
}

async function send(){
  const input=$("input"), text=input.value.trim();
  if(!text||busy) return;
  begin();
  log.push({sys:true,text:"Bağlanıyor…"}); renderFeed();
  const sample=await getSample();
  log=log.filter(m=>m.text!=="Bağlanıyor…");
  if(!sample){ log.push({sys:true,text:"Bu görünümde yanıt üretilemiyor. Sayfayı claude.ai üzerinden, artifact bağlantısıyla aç."}); end(); return }
  input.value=""; grow();
  log.push({from:"me",text}); note(null,"Sen yeni bir mesaj yazdın"); renderFeed();
  const t=targets(text);
  for(const a of t.list){ const r=await speak(sample,a,"user",t.direct); if(r==="fatal"||r==="stop"){ end(); return } }
  await teamRounds(sample,+$("rounds").value);
  end();
}
async function moreRound(){
  if(busy) return;
  if(!log.some(m=>m.from==="me")){ log.push({sys:true,text:"Önce projeni anlat, sonra ekip tur atabilir."}); renderFeed(); return }
  begin(); const sample=await getSample();
  if(!sample){ log.push({sys:true,text:"Bu görünümde yanıt üretilemiyor."}); end(); return }
  await teamRounds(sample,1); end();
}

function setBusy(b){ const s=$("send"); s.textContent=b?"Durdur":"Gönder"; s.className="send"+(b?" stop":""); s.type=b?"button":"submit"; $("more").disabled=b; $("recruit").disabled=b }
$("send").addEventListener("click",()=>{ if(busy&&ctrl) ctrl.abort() });
$("form").addEventListener("submit",e=>{ e.preventDefault(); send() });
const grow=()=>{ const i=$("input"); i.style.height="auto"; i.style.height=Math.min(i.scrollHeight,140)+"px" };
$("input").addEventListener("input",grow);
$("input").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); send() } });
$("more").onclick=moreRound;
$("recruit").onclick=()=>{ const i=$("input"); if(!i.value.trim()) i.value="@Rana bu proje için eksik uzmanlıkları belirle ve gereken ajanları odaya ekle."; else if(!/@rana/i.test(i.value)) i.value="@Rana "+i.value; send() };
$("clear").onclick=()=>{ if(busy&&ctrl) ctrl.abort(); log=[]; tasks=[]; acts=[]; nextTask=1; save(); renderAll() };
$("tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-v]"); if(!b) return;
  $("app").dataset.view=b.dataset.v; $("tabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)) });

renderAll();
</script>
