<title>3D Atölye Odası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Düzen: solda ekip listesi, ortada sohbet akışı, altta mesaj kutusu. Telefonda liste üstte yatay şeride döner. */
:root{
  --bg:#ecebe6; --panel:#f6f5f1; --line:#d4d2c9; --fg:#1d1f24; --muted:#6b6e76;
  --me:#1d1f24; --me-fg:#f6f5f1; --focus:#2a5bd7;
  --c-aylin:#c2410c; --c-baris:#2563eb; --c-defne:#0f8a6a; --c-emre:#a21caf;
  --c-selin:#b7791f; --c-kaan:#0e7490; --c-mert:#be123c;
  --font-d:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --font-b:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161a; --panel:#1b1e24; --line:#2c3038; --fg:#e8e9ec; --muted:#8d919b;
  --me:#e8e9ec; --me-fg:#14161a; --focus:#7aa2ff;
  --c-aylin:#fb923c; --c-baris:#60a5fa; --c-defne:#34d399; --c-emre:#e879f9;
  --c-selin:#fbbf24; --c-kaan:#22d3ee; --c-mert:#fb7185; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1b1e24; --line:#2c3038; --fg:#e8e9ec; --muted:#8d919b;
  --me:#e8e9ec; --me-fg:#14161a; --focus:#7aa2ff;
  --c-aylin:#fb923c; --c-baris:#60a5fa; --c-defne:#34d399; --c-emre:#e879f9;
  --c-selin:#fbbf24; --c-kaan:#22d3ee; --c-mert:#fb7185; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100%;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
.brand h1{font-family:var(--font-d);font-size:22px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.roster{display:flex;flex-direction:column;gap:6px}
.agent{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.agent[aria-pressed="false"]{opacity:.45}
.agent .av{width:36px;height:36px}
.agent b{display:block;font-family:var(--font-d);font-size:15px;line-height:1.2}
.agent small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.agent .typing{color:var(--fg)}
.av{border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;color:#fff;background:var(--col);font-size:15px;flex:none}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--muted);cursor:pointer}
.tools button:hover{color:var(--fg);border-color:var(--muted)}
.room{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.feed{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;max-width:760px}
.msg .av{width:32px;height:32px;font-size:13px}
.msg .who{font-family:var(--font-m);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--col);margin-bottom:2px}
.msg .who span{color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .body code{font-family:var(--font-m);font-size:13px;background:var(--bg);padding:1px 4px;border-radius:3px}
.msg.me{justify-self:end;grid-template-columns:minmax(0,1fr)}
.msg.me .body{background:var(--me);color:var(--me-fg);padding:8px 12px;border-radius:10px 10px 2px 10px}
.msg.err .body{color:var(--muted);font-style:italic}
.sys{align-self:center;color:var(--muted);font-family:var(--font-m);font-size:12px;text-align:center}
.empty{margin:auto;max-width:460px;color:var(--muted);text-align:center}
.empty h2{font-family:var(--font-d);color:var(--fg);font-size:20px;margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--muted)}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mentions{display:flex;gap:6px;flex-wrap:wrap}
.mentions button{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-family:var(--font-m);font-size:12px;color:var(--col);cursor:pointer}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;max-height:140px;line-height:1.4}
.send{background:var(--fg);color:var(--bg);border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.send.stop{background:transparent;color:var(--fg);border:1px solid var(--muted)}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px}
  .side{overflow:visible;gap:8px}
  .brand p,.agent small,.tools{display:none}
  .roster{flex-direction:row;overflow-x:auto;padding-bottom:2px}
  .agent{grid-template-columns:28px auto;flex:none;padding:6px 10px}
  .agent .av{width:28px;height:28px;font-size:13px}
  .agent b{font-size:13px}
}
@media (prefers-reduced-motion:no-preference){.dots{animation:p 1.2s infinite}@keyframes p{50%{opacity:.3}}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">

<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>3D Atölye Odası</h1>
      <p>Bir 3D projeyi baştan sona birlikte kuran yedi uzman. Yazdığın her şeyi odadaki herkes duyar.</p>
    </div>
    <div class="roster" id="roster"></div>
    <div class="tools"><button id="clear" type="button">Sohbeti temizle</button></div>
  </aside>

  <main class="room">
    <div class="feed" id="feed" aria-live="polite"></div>
    <form class="composer" id="form">
      <div class="mentions" id="mentions"></div>
      <div class="row">
        <textarea id="input" rows="1" placeholder="Projeni anlat veya birine @ ile seslen…" aria-label="Mesaj"></textarea>
        <button class="send" id="send" type="submit">Gönder</button>
      </div>
      <div class="hint">Etiket yoksa odadaki herkes sırayla yanıt verir. Enter gönderir, Shift+Enter yeni satır.</div>
    </form>
  </main>
</div>

<script>
const AGENTS = [
  {id:"aylin", name:"Aylin", role:"Yaratıcı Yönetmen", col:"var(--c-aylin)",
   brief:"Konsept, görsel stil, mood board, referanslar, renk paleti ve projenin hikâyesi. Fikri netleştirir, stil kararı verir."},
  {id:"baris", name:"Barış", role:"3D Modelleme", col:"var(--c-baris)",
   brief:"Blender/Maya ile modelleme: blockout, topoloji, edge flow, poly bütçesi, high-poly/low-poly, bake, ölçek ve pivot kuralları."},
  {id:"defne", name:"Defne", role:"Doku ve Malzeme", col:"var(--c-defne)",
   brief:"UV açma, PBR malzemeler (albedo, roughness, normal, metalness), Substance Painter, doku çözünürlüğü ve texel density."},
  {id:"emre", name:"Emre", role:"Animasyon ve Rig", col:"var(--c-emre)",
   brief:"İskelet (rig), skinning, weight paint, IK/FK, döngüler, keyframe zamanlaması, morph target ve glTF animasyon dışa aktarımı."},
  {id:"selin", name:"Selin", role:"Işık ve Render", col:"var(--c-selin)",
   brief:"Işıklandırma, HDRI, kamera ve kompozisyon, Cycles/Eevee ayarları, gürültü giderme, post-process ve turntable render."},
  {id:"kaan", name:"Kaan", role:"Gerçek Zamanlı / Three.js", col:"var(--c-kaan)",
   brief:"Three.js, WebGL, glTF/GLB, Draco/KTX2 sıkıştırma, draw call ve performans optimizasyonu, shader, Unity/Unreal aktarımı. Gerekirse kısa kod örneği verir."},
  {id:"mert", name:"Mert", role:"Proje Yöneticisi", col:"var(--c-mert)",
   brief:"Kapsam, görev sırası, süre tahmini, teslimat listesi, ekip içi bağımlılıklar. Herkesin söylediğini kısa bir eylem planında toplar."}
];
const SUGGEST = [
  "Terk edilmiş bir deniz feneri sahnesi yapmak istiyorum. Nereden başlayalım?",
  "@Barış düşük poligonlu bir karakter için poly bütçesi ne olmalı?",
  "Modeli web'de akıcı göstermek için ne yapmalıyız?"
];
const KEY = "atolye-sohbet-v1";
let log = [], active = new Set(AGENTS.map(a=>a.id)), busy = false, ctrl = null, typing = null;
try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s){log=s.log||[]; active=new Set(s.active||[...active])} }catch(e){}
const $ = id => document.getElementById(id);
const byId = id => AGENTS.find(a=>a.id===id);
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify({log:log.slice(-80), active:[...active]})) }catch(e){} };
const fold = s => s.toLowerCase().replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");

function avatar(a, cls=""){ const d=document.createElement("div"); d.className="av "+cls; d.style.setProperty("--col",a.col); d.textContent=a.name[0]; return d }

function renderRoster(){
  const r=$("roster"); r.textContent="";
  AGENTS.forEach(a=>{
    const b=document.createElement("button"); b.type="button"; b.className="agent";
    b.setAttribute("aria-pressed", active.has(a.id)); b.title = active.has(a.id)?"Odadan çıkar":"Odaya al";
    b.appendChild(avatar(a));
    const t=document.createElement("div");
    const n=document.createElement("b"); n.textContent=a.name;
    const s=document.createElement("small"); s.textContent = typing===a.id ? "yazıyor…" : a.role; if(typing===a.id) s.className="typing dots";
    t.append(n,s); b.appendChild(t);
    b.onclick=()=>{ active.has(a.id)?active.delete(a.id):active.add(a.id); if(!active.size) active.add(a.id); save(); renderRoster(); };
    r.appendChild(b);
  });
  const m=$("mentions"); m.textContent="";
  AGENTS.filter(a=>active.has(a.id)).forEach(a=>{
    const b=document.createElement("button"); b.type="button"; b.textContent="@"+a.name; b.style.setProperty("--col",a.col);
    b.onclick=()=>{ const i=$("input"); i.value = (i.value? i.value.replace(/\s*$/," "):"")+"@"+a.name+" "; i.focus(); grow() };
    m.appendChild(b);
  });
}

function fmt(el, text){
  el.textContent="";
  text.split(/(`[^`]+`)/).forEach(p=>{
    if(p.length>2 && p[0]==="`" && p.endsWith("`")){ const c=document.createElement("code"); c.textContent=p.slice(1,-1); el.appendChild(c) }
    else el.appendChild(document.createTextNode(p));
  });
}

function msgNode(m){
  const w=document.createElement("div");
  if(m.sys){ w.className="sys"; w.textContent=m.text; return w }
  if(m.from==="me"){ w.className="msg me"; const b=document.createElement("div"); b.className="body"; b.textContent=m.text; w.appendChild(b); return w }
  const a=byId(m.from); w.className="msg"+(m.err?" err":""); w.style.setProperty("--col",a.col);
  w.appendChild(avatar(a));
  const c=document.createElement("div");
  const who=document.createElement("div"); who.className="who"; who.textContent=a.name; const r=document.createElement("span"); r.textContent=a.role; who.appendChild(r);
  const b=document.createElement("div"); b.className="body"; fmt(b,m.text||"…");
  c.append(who,b); w.appendChild(c); w._body=b; return w;
}

function renderFeed(){
  const f=$("feed"); f.textContent="";
  if(!log.length){
    const e=document.createElement("div"); e.className="empty";
    e.innerHTML="<h2>Atölye açık</h2><div>Ne yapmak istediğini yaz. Aylin fikri şekillendirir, Barış modeller, Defne kaplar, Emre canlandırır, Selin ışıklandırır, Kaan web'e taşır, Mert planı toplar.</div>";
    const c=document.createElement("div"); c.className="chips";
    SUGGEST.forEach(s=>{ const b=document.createElement("button"); b.type="button"; b.textContent=s; b.onclick=()=>{ $("input").value=s; send() }; c.appendChild(b) });
    e.appendChild(c); f.appendChild(e); return;
  }
  log.forEach(m=>f.appendChild(msgNode(m)));
  f.scrollTop=f.scrollHeight;
}

function targets(text){
  const f=fold(text), hit=AGENTS.filter(a=>active.has(a.id) && new RegExp("@"+fold(a.name)+"(?![a-z])").test(f));
  return hit.length?hit:AGENTS.filter(a=>active.has(a.id));
}

function prompt(a, team){
  const room = team.map(t=>`${t.name} (${t.role})`).join(", ");
  const hist = log.filter(m=>!m.sys && !m.err && m.text).slice(-24)
    .map(m=>`${m.from==="me"?"Kullanıcı":byId(m.from).name}: ${m.text}`).join("\n");
  return `Sen "${a.name}" adlı, ${a.role} uzmanısın. Alanın: ${a.brief}
Bir 3D proje atölyesinin sohbet odasındasın. Odadaki ekip: ${room}. Kullanıcıyla ve meslektaşlarınla Türkçe, samimi ve net konuş.
Kurallar:
- Yalnızca ${a.name} olarak, kendi uzmanlık alanından yanıt ver. Başka birinin alanındaysa ona yönlendir (@Ad).
- Önceki mesajlarda söylenenleri tekrar etme; ekle, itiraz et ya da bir sonraki adımı ver.
- En fazla 4 kısa cümle. Gerçek sayılar, ayarlar ve araç adları ver. Liste gerekmedikçe kullanma.
- Mesajın başına kendi adını yazma.

Sohbet geçmişi:
${hist}

Şimdi ${a.name} olarak sıradaki mesajını yaz.`;
}

async function send(){
  const input=$("input"), text=input.value.trim();
  if(!text || busy) return;
  const sample = await claude.use("sample");
  if(!sample){ log.push({sys:true,text:"Bu görünümde yapay zekâ yanıtı kullanılamıyor."}); renderFeed(); return }
  input.value=""; grow(); busy=true; ctrl=new AbortController(); setBusy(true);
  log.push({from:"me",text}); const team=targets(text), room=AGENTS.filter(a=>active.has(a.id));
  renderFeed();
  for(const a of team){
    if(ctrl.signal.aborted) break;
    const m={from:a.id,text:""}; log.push(m);
    const node=msgNode(m); $("feed").appendChild(node); typing=a.id; renderRoster();
    try{
      const res = await sample(prompt(a,room),{cache:false,modelTier:"quick",signal:ctrl.signal,
        onText:({text:t})=>{ m.text=t; fmt(node._body,t); $("feed").scrollTop=$("feed").scrollHeight }});
      m.text=(res.text||"").replace(new RegExp("^\\s*"+a.name+"\\s*[:：-]\\s*","i"),"").trim();
      fmt(node._body,m.text);
    }catch(e){
      if(ctrl.signal.aborted){ if(!m.text) log.pop(); break }
      log.pop();
      const code=e&&e.code;
      log.push({sys:true,text: code==="not_granted" ? "Yanıt vermek için izin gerekiyor. Sayfa iznini onaylayıp tekrar dene." : code==="rate_limited" ? "Çok hızlı gittik, birkaç saniye sonra tekrar dene." : a.name+" şu an yanıt veremedi."});
      break;
    }
    save();
  }
  typing=null; busy=false; ctrl=null; setBusy(false); save(); renderRoster(); renderFeed();
}

function setBusy(b){
  const s=$("send"); s.textContent=b?"Durdur":"Gönder"; s.className="send"+(b?" stop":""); s.type=b?"button":"submit";
}
$("send").addEventListener("click",()=>{ if(busy && ctrl) ctrl.abort() });
$("form").addEventListener("submit",e=>{ e.preventDefault(); send() });
const grow=()=>{ const i=$("input"); i.style.height="auto"; i.style.height=Math.min(i.scrollHeight,140)+"px" };
$("input").addEventListener("input",grow);
$("input").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); send() } });
$("clear").onclick=()=>{ if(busy&&ctrl) ctrl.abort(); log=[]; save(); renderFeed() };

renderRoster(); renderFeed();
</script>
