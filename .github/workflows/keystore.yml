name: Keystore üret (tek seferlik)

on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-m0dtk5]
    paths: ['.github/workflows/keystore.yml']

permissions:
  contents: read
  actions: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SECRETS_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Zaten var mı?
        id: chk
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::SECRETS_PAT gizli anahtarı eksik"; exit 1; }
          if gh secret list --repo "$REPO" | grep -q '^KEYSTORE_B64'; then echo "have=1" >> "$GITHUB_OUTPUT"; echo "Anahtar zaten kayıtlı; üzerine yazılmıyor."; else echo "have=0" >> "$GITHUB_OUTPUT"; fi
      - name: Anahtar üret ve gizli anahtarlara yaz (değerler günlüğe yazılmaz)
        if: steps.chk.outputs.have == '0'
        run: |
          PASS="$(openssl rand -hex 16)"; echo "::add-mask::$PASS"
          keytool -genkeypair -keystore "$RUNNER_TEMP/k.jks" -alias akvaryum -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Akvaryum Ureticisi, O=Sametto, C=TR" > /dev/null 2>&1
          base64 -w0 "$RUNNER_TEMP/k.jks" | gh secret set KEYSTORE_B64 --repo "$REPO"
          printf '%s' "$PASS" | gh secret set KEYSTORE_PASSWORD --repo "$REPO"
          printf '%s' "$PASS" | gh secret set KEY_PASSWORD --repo "$REPO"
          printf '%s' "akvaryum" | gh secret set KEY_ALIAS --repo "$REPO"
          rm -f "$RUNNER_TEMP/k.jks"; echo "4 gizli anahtar yazıldı."
      - name: Release derlemesini başlat
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml --repo "$REPO" --ref "${GITHUB_REF_NAME}"
