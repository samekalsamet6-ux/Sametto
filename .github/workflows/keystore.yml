name: Keystore üret (tek seferlik)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Anahtar üret
        run: |
          PASS="$(openssl rand -hex 12)"
          keytool -genkeypair -v -keystore akvaryum.jks -alias akvaryum -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Akvaryum Ureticisi, O=Sametto, C=TR"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=akvaryum"
            echo "KEY_PASSWORD=$PASS"
            echo "KEYSTORE_B64 aşağıdaki dosyadadır (akvaryum.jks.b64)."
          } > anahtar-bilgileri.txt
          base64 -w0 akvaryum.jks > akvaryum.jks.b64
      - uses: actions/upload-artifact@v4
        with:
          name: akvaryum-anahtar-GIZLI
          path: |
            akvaryum.jks
            akvaryum.jks.b64
            anahtar-bilgileri.txt
          retention-days: 1
