<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04161f">
<title>Akvaryum Üreticisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* ====== Tasarım dili: "Sualtı cam" ====== */
:root{
  --bg:#04161f; --bg2:#08303f; --panel:rgba(14,56,74,.62); --panel-solid:#0d3a4d; --panel-b:rgba(130,230,235,.2);
  --text:#e8f7f8; --muted:#9fc6cd; --accent:#2fd4c6; --accent-ink:#032a2a; --coral:#ff7f6e; --ok:#4cd694; --warn:#ffc65c; --bad:#ff6b6b;
  --r0:#9aa8b1; --r1:#4aa8ff; --r2:#b06cff; --r3:#ffc247; --r4:#ff7ad9;
  --radius:16px; --tab-h:66px; --top-h:56px; --ease:cubic-bezier(.22,1,.36,1);
  --fs:1; --shadow:0 10px 30px rgba(0,0,0,.35);
  --font-h:'Baloo 2','Nunito','Segoe UI Rounded','Trebuchet MS',system-ui,sans-serif; --font-b:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}
:root[data-theme=light]{ --bg:#e9f7f8; --bg2:#cdeef0; --panel:rgba(255,255,255,.72); --panel-solid:#ffffff; --panel-b:rgba(14,100,120,.18); --text:#0c3340; --muted:#4a7380; --accent:#0aa89b; --accent-ink:#fff; --shadow:0 10px 26px rgba(10,70,90,.18); }
:root[data-theme=oled]{ --bg:#000; --bg2:#000; --panel:rgba(18,32,38,.78); --panel-solid:#0a1418; --panel-b:rgba(120,220,225,.16); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:calc(16px * var(--fs));overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg));}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-h);margin:0;font-weight:700;letter-spacing:.2px}
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ====== Açılış ====== */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;background:radial-gradient(900px 600px at 50% 30%,#0d5d74,#031219);cursor:pointer;transition:opacity .6s var(--ease),filter .6s var(--ease)}
#splash.out{opacity:0;filter:blur(10px);pointer-events:none}
#splash h1{font-size:clamp(34px,8vw,64px);color:#eafffd;text-shadow:0 4px 30px rgba(47,212,198,.5)}
#splash p{margin:0;color:#a8d8dc;max-width:34ch}
#splash .tap{margin-top:12px;padding:14px 30px;border-radius:30px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);backdrop-filter:blur(8px);font-family:var(--font-h);font-size:20px;animation:breathe 2.4s ease-in-out infinite}
#splash canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@keyframes breathe{50%{transform:scale(1.05);box-shadow:0 0 30px rgba(47,212,198,.45)}}

/* ====== Uygulama kabuğu ====== */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#topbar{height:calc(var(--top-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:8px;z-index:20;background:linear-gradient(var(--bg),transparent);flex:none}
#topbar .brand{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 8px;border:0;background:none;cursor:pointer;font-family:var(--font-h);font-size:18px;color:var(--text);border-radius:14px}
#topbar .brand .ic{width:28px;height:28px;color:var(--accent)}
#topbar .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:20px;background:var(--panel);border:1px solid var(--panel-b);backdrop-filter:blur(12px);font-weight:700;font-variant-numeric:tabular-nums}
.chip .ic{width:18px;height:18px}
.chip.coin .ic{color:#ffd36b}.chip.rep .ic{color:var(--coral)}
.icon-btn{position:relative;width:44px;height:44px;min-width:44px;display:inline-grid;place-items:center;border-radius:14px;border:1px solid var(--panel-b);background:var(--panel);backdrop-filter:blur(12px);cursor:pointer;overflow:hidden;transition:transform .18s var(--ease),background .2s}
.icon-btn:active{transform:scale(.92)}
.badge-dot{position:absolute;top:5px;right:5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
#screens{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:8px 14px calc(var(--tab-h) + 22px + env(safe-area-inset-bottom));display:none;-webkit-overflow-scrolling:touch}
.screen.active{display:block}
.screen.enter{animation:rise .5s var(--ease) both}
.screen.leave{display:block;animation:sink .32s var(--ease) both;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(26px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes sink{to{opacity:0;transform:scale(.985);filter:blur(7px)}}
.wrap{max-width:760px;margin:0 auto}
#tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);display:flex;gap:2px;z-index:20;background:linear-gradient(transparent,var(--bg) 40%);}
#tabbar .tab{flex:1;min-height:44px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;cursor:pointer;border-radius:14px;position:relative;transition:color .25s,transform .18s var(--ease)}
#tabbar .tab:active{transform:scale(.94)}
#tabbar .tab.active{color:var(--accent)}
#tabbar .tab.active::after{content:'';position:absolute;top:-2px;width:28px;height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.fx-bub{position:fixed;bottom:-20px;border-radius:50%;border:1.5px solid rgba(220,255,255,.7);background:rgba(255,255,255,.12);pointer-events:none;z-index:60;animation:bubUp 1s ease-in forwards}
@keyframes bubUp{from{transform:translateY(0) translateX(0);opacity:.9}to{transform:translateY(-105vh) translateX(var(--dx,20px));opacity:0}}

/* ====== Kart / düğme ====== */
.card{background:var(--panel);border:1px solid var(--panel-b);border-radius:var(--radius);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px;box-shadow:var(--shadow)}
.card + .card,.stack > * + *{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}.row.wrap-r{flex-wrap:wrap}.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11.5px}
.btn{position:relative;overflow:hidden;min-height:44px;padding:0 18px;border-radius:14px;border:1px solid var(--panel-b);background:var(--panel);color:var(--text);font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--ease),background .2s,box-shadow .2s;backdrop-filter:blur(10px)}
.btn:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#17a7c4);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 18px rgba(47,212,198,.28)}
.btn.coral{background:linear-gradient(135deg,#ff8a78,#ff5f7a);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.section-t{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:18px}
.section-t .ic{color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pbar{height:9px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.pbar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),#7be7ff);transition:width .6s var(--ease)}
.pbar.warn > i{background:linear-gradient(90deg,var(--warn),#ff9d5c)}.pbar.bad > i{background:linear-gradient(90deg,var(--bad),#ff9d5c)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.1);border:1px solid var(--panel-b)}
.rar{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.rar-4{background:linear-gradient(90deg,#ff7ad9,#ffd36b,#7be7ff,#b06cff);-webkit-background-clip:text;background-clip:text;color:transparent!important;border-color:#ff7ad9}
.cb .rar::before{content:attr(data-ico);margin-right:2px}
input[type=text],textarea{width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--panel-b);background:rgba(0,0,0,.2);outline:none}
textarea{padding:10px 12px;min-height:90px}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.set-row{display:flex;align-items:center;gap:12px;min-height:48px;justify-content:space-between}
.set-row > label{flex:1}
.seg{display:inline-flex;border:1px solid var(--panel-b);border-radius:12px;overflow:hidden}
.seg button{min-height:40px;padding:0 12px;white-space:nowrap;border:0;background:transparent;cursor:pointer;font-weight:700}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.switch{width:50px;height:30px;border-radius:15px;border:0;background:rgba(255,255,255,.2);position:relative;cursor:pointer;transition:background .25s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(20px)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .ill{font-size:54px;opacity:.9;margin-bottom:6px}
.empty b{display:block;color:var(--text);font-family:var(--font-h);font-size:20px;margin-bottom:4px}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.16),rgba(255,255,255,.06));background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}

/* ====== Akvaryum ekranı ====== */
#s-aq{padding:0;overflow:hidden}
#tank{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#tank.drag{cursor:grabbing}
.aq-info{position:absolute;top:6px;left:12px;right:12px;display:flex;gap:8px;pointer-events:none;flex-wrap:wrap;z-index:5}
.aq-info .chip{pointer-events:auto;font-size:14px}
.qa{position:absolute;left:0;right:0;bottom:calc(var(--tab-h) + 10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:6;padding:0 10px}
.qa .qbtn{width:60px;min-height:58px;border-radius:18px;border:1px solid var(--panel-b);background:var(--panel);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;cursor:pointer;transition:transform .18s var(--ease)}
.qa .qbtn:active{transform:scale(.9)}
.qa .qbtn.on{background:var(--accent);color:var(--accent-ink)}
.tip{position:absolute;z-index:7;padding:6px 12px;border-radius:12px;background:var(--panel-solid);border:1px solid var(--panel-b);font-weight:800;pointer-events:none;transform:translate(-50%,-130%);white-space:nowrap;animation:rise .25s var(--ease) both}

/* ====== Sheet / modal ====== */
#sheets{position:fixed;inset:0;z-index:50;pointer-events:none}
.sheet-wrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:auto}
.sheet-back{position:absolute;inset:0;background:rgba(2,12,18,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadeIn .3s var(--ease) both}
.sheet{position:relative;width:100%;max-width:640px;max-height:94%;overflow-y:auto;background:var(--panel-solid);border:1px solid var(--panel-b);border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:sheetUp .4s var(--ease) both}
.sheet.full{height:96%}
.sheet.flip{animation:fadeIn .3s both}
.sheet-wrap.closing .sheet{animation:sheetDown .3s var(--ease) both}.sheet-wrap.closing .sheet-back{animation:fadeOut .3s both}
@media(min-width:760px){.sheet-wrap{align-items:center}.sheet{border-radius:24px}}
@keyframes sheetUp{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sheetDown{to{opacity:0;transform:translateY(30px) scale(.98)}}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.sheet-h h3{flex:1;font-size:22px}
#toasts{position:fixed;top:calc(8px + env(safe-area-inset-top));left:0;right:0;z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:92vw;padding:10px 16px;border-radius:16px;background:var(--panel-solid);border:1px solid var(--panel-b);box-shadow:var(--shadow);font-weight:700;animation:toastIn .45s var(--ease) both}
.toast.out{animation:toastOut .35s var(--ease) both}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(.95)}}@keyframes toastOut{to{opacity:0;transform:translateY(-14px)}}

/* ====== Canlı kartı ====== */
.cc-portrait{position:relative;height:min(40vh,340px);border-radius:20px;overflow:hidden;margin:-4px -4px 12px;border:2px solid var(--c,var(--r0));box-shadow:0 0 28px color-mix(in srgb,var(--c,var(--r0)) 40%,transparent)}
.cc-portrait canvas{position:absolute;inset:0;width:100%;height:100%}
.cc-portrait.r4{border-image:linear-gradient(120deg,#ff7ad9,#ffd36b,#7be7ff,#b06cff) 1;border-radius:0}
.cc-tools{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.cc-tools .icon-btn{width:40px;height:40px;min-width:40px;background:rgba(3,22,32,.55)}
.cc-rar{position:absolute;left:10px;bottom:10px}.cc-rar .pill{background:rgba(3,22,32,.72);backdrop-filter:blur(6px)}
.cc-name{font-family:var(--font-h);font-size:24px;background:transparent;border:0;border-bottom:1px dashed var(--panel-b);border-radius:0;min-height:40px;padding:0 2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){text-align:right;font-weight:700}
.meters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}.meters label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.locked{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px dashed var(--panel-b);color:var(--muted)}
.fish-row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;cursor:pointer;border:1px solid transparent;min-height:56px}
.fish-row:hover{background:rgba(255,255,255,.06);border-color:var(--panel-b)}
.fish-row canvas{width:84px;height:40px;flex:none}
.dex-tile{position:relative;border-radius:16px;padding:10px;text-align:center;cursor:pointer;background:var(--panel);border:1px solid var(--panel-b);transition:transform .2s var(--ease)}
.dex-tile:active{transform:scale(.96)}.dex-tile canvas{width:100%;height:auto;display:block}
.dex-tile.undisc canvas{filter:brightness(0) opacity(.35)}
.dex-tile .nm{font-weight:800;font-size:14px;margin-top:2px}.dex-tile .rarbar{height:3px;border-radius:3px;margin-top:6px;background:var(--c)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.sp-chip{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--panel-b);background:var(--panel);font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sp-chip.on{background:var(--accent);color:var(--accent-ink)}.sp-chip.lock{opacity:.55}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;flex:none}
.ring > span{width:58px;height:58px;border-radius:50%;background:var(--panel-solid);display:grid;place-items:center;font-weight:800}
.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#2fd4c6,#1779c4);border:3px solid rgba(255,255,255,.4);flex:none}
.stat{padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--panel-b)}.stat b{display:block;font-family:var(--font-h);font-size:24px}
.task{display:flex;align-items:center;gap:12px;padding:10px 0}.task + .task{border-top:1px solid var(--panel-b)}
.task .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel-b);display:grid;place-items:center;flex:none}.task.done .ck{background:var(--ok);border-color:var(--ok);color:#03281a}
.tank-card{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;border:1px solid var(--panel-b);box-shadow:var(--shadow);transition:transform .25s var(--ease)}
.tank-card:active{transform:scale(.985)}.tank-card canvas{display:block;width:100%;aspect-ratio:16/9;background:#062c43}
.tank-card .meta{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(2,14,22,.85));display:flex;align-items:flex-end;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.launch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.launch-grid button{min-height:76px;border-radius:16px;border:1px solid var(--panel-b);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:13px;cursor:pointer;transition:transform .18s var(--ease)}
.launch-grid button:active{transform:scale(.94)}.launch-grid .ic{width:28px;height:28px;color:var(--accent)}

/* ====== Kutlama ====== */
#celebrate{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;background:rgba(1,8,14,.9);backdrop-filter:blur(10px)}
#celebrate.show{display:flex;animation:fadeIn .8s ease both}
#celebrate .glow{position:absolute;inset:0;background:radial-gradient(closest-side at 50% 42%,color-mix(in srgb,var(--c) 40%,transparent),transparent 75%);animation:breathe2 4s ease-in-out infinite}
#celebrate.r4 .glow{background:conic-gradient(from 0deg at 50% 42%,#ff7ad9,#ffd36b,#7be7ff,#b06cff,#ff7ad9);mask-image:radial-gradient(closest-side at 50% 42%,#000,transparent 75%);-webkit-mask-image:radial-gradient(closest-side at 50% 42%,#000,transparent 75%);opacity:.5;animation:spin 14s linear infinite}
@keyframes breathe2{50%{opacity:.6;transform:scale(1.06)}}@keyframes spin{to{transform:rotate(360deg)}}
#celebrate .cp{position:relative;width:min(86vw,420px);height:min(40vh,260px)}
#celebrate canvas{position:absolute;inset:0;width:100%;height:100%}
#celebrate h2{position:relative;font-size:clamp(26px,6vw,40px);color:#fff}
#celebrate .nm{position:relative;font-family:var(--font-h);font-size:clamp(30px,8vw,52px);color:var(--c);min-height:1.2em}
#celebrate > *{position:relative}

/* ====== Erişilebilirlik ====== */
.reduce *,.reduce *::before,.reduce *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-fish" viewBox="0 0 24 24"><path d="M2 12c3-5 8-7 13-5l4-3v16l-4-3c-5 2-10 0-13-5z"/><circle cx="7.5" cy="11" r=".9"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>

class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 1; }

  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  gauss(mu = 0, sigma = 1) { const u = Math.max(1e-9, this.next()), v = this.next(); return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }
  shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
}
/** Oyunun genel RNG'si. Testler `R.s = seed` ile tohumlayabilir. */

const hash1 = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return s - Math.floor(s); };

/** Küçük hyperscript: h('div.card', {onclick}, 'metin', child) */
function h(tag, attrs, ...kids) {
  const m = /^([a-z0-9]+)((?:[.#][\w-]+)*)$/i.exec(tag);
  const el = document.createElement(m ? m[1] : tag);
  if (m && m[2]) m[2].replace(/([.#])([\w-]+)/g, (_, k, v) => { if (k === '.') el.classList.add(v); else el.id = v; });
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') { for (const p in v) (p.startsWith('--') ? el.style.setProperty(p, v[p]) : (el.style[p] = v[p])); }
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'class') v.split(' ').forEach((c) => c && el.classList.add(c));
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(3)) { if (k == null || k === false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return el;
}

/* ───── 02-genetics.js ───── */
'use strict';
/* =====================================================================
   02 · GENETİK MOTORU — Lepistes
   · XX/XY cinsiyet, X–Y arası düşük çaprazlama (%3)
   · Otozomal: body (çekinik), purple (baskın), metal (baskın, çift kopya = ceza), tail
   · Cinsiyete bağlı: tc, tux, sb, st, grass, mosaic, moscow
   · Nicel: size, tailLen, vigor, intensity (ebeveyn ortalaması + Gauss sapma)
   · Mutasyon, akrabalık katsayısı (soyağacından), ırk tanıma
   ===================================================================== */

const AUTO_LOCI = ['body', 'purple', 'metal', 'tail'];
const SC_LOCI = ['tc', 'tux', 'sb', 'st', 'grass', 'mosaic', 'moscow'];
const XY_CROSS = 0.03;      // erkekte X–Y arası çaprazlama (lokus başına)
const XX_CROSS = 0.25;      // dişide X–X arası
const MUT_RATE = 0.0025;    // lokus başına gamet mutasyonu → yavruda gen başına ~%0.5

/* ---------------- Soyağacı kaydı (balık öldükten/satıldıktan sonra da kalır) ---------------- */
const Pedigree = {
  rec: {}, _memo: new Map(),
  add(id, sire, dam, extra) { this.rec[id] = Object.assign({ s: sire || 0, d: dam || 0 }, extra); this._memo.clear(); },
  /** İki bireyin akrabalık (kinship) katsayısı. */
  kin(a, b) {
    if (!a || !b) return 0;
    if (a === b) return 0.5 * (1 + this.F(a));
    if (a < b) { const t = a; a = b; b = t; }          // id arttıkça gençleşir
    const key = a + ',' + b; if (this._memo.has(key)) return this._memo.get(key);
    const r = this.rec[a]; let v = 0;
    if (r && (r.s || r.d)) v = 0.5 * (this.kin(r.s, b) + this.kin(r.d, b));
    this._memo.set(key, v); return v;
  },
  /** Akrabalı yetiştirme katsayısı F = ebeveynlerin akrabalığı. */
  F(id) { const r = this.rec[id]; return r && r.s && r.d ? this.kin(r.s, r.d) : 0; },
};

/* ---------------- Genom yardımcıları ---------------- */
const Genetics = {
  blankHap(isY) { return { tc: 'none', tux: 0, sb: 0, st: 0, grass: 0, mosaic: 0, moscow: 0, Y: !!isY }; },

  /** Tanımdan (spec) genom üretir. Cinsiyete bağlı genler erkekte Y'ye, dişide X'e konur. */
  make(spec = {}, sex = 'M', rng = R) {
    const two = (v, d) => (Array.isArray(v) ? v.slice() : [v ?? d, v ?? d]);
    const g = { sex, auto: {}, sc: [], quant: {} };
    g.auto.body = two(spec.body, 'W');
    g.auto.tail = two(spec.tail, 'delta');
    g.auto.purple = spec.purple ? (spec.purple === 2 ? ['Pb', 'Pb'] : ['Pb', 'pb']) : ['pb', 'pb'];
    g.auto.metal = spec.metal ? (spec.metal === 2 ? ['Mg', 'Mg'] : ['Mg', 'mg']) : ['mg', 'mg'];
    const flat = {}; for (const k of SC_LOCI) if (spec[k] !== undefined) flat[k] = spec[k];
    const x0 = Object.assign(this.blankHap(false), spec.X || {});
    const x1 = Object.assign(this.blankHap(sex === 'M'), sex === 'M' ? (spec.Y || {}) : (spec.X2 || {}));
    if (sex === 'M') Object.assign(x1, flat); else Object.assign(x0, flat);
    g.sc = [x0, x1];
    for (const q in QUANT) {
      const [a, b] = QUANT[q].range;
      g.quant[q] = spec[q] ?? clamp(1 + rng.gauss(0, 0.07), a, b);
    }
    return g;
  },

  /** Rastgele başlangıç genomu — yaygın genler. */
  randomFounder(sex, rng = R) {
    const spec = {
      body: rng.chance(0.12) ? rng.pick(['bld', 'gld', 'alb', 'blu']) : 'W',
      tail: rng.pick(TAIL_COMMON),
      X: { tc: rng.chance(0.18) ? rng.pick(['red', 'blue']) : 'none' },
    };
    return this.make(spec, sex, rng);
  },

  /* ------------ İfade (fenotip) ------------ */
  expressMin(alleles, rank) { return rank[Math.min(rank.indexOf(alleles[0]), rank.indexOf(alleles[1]))]; },

  phenotype(g) {
    const p = {
      sex: g.sex,
      body: this.expressMin(g.auto.body, BODY_RANK),
      purple: g.auto.purple.includes('Pb'),
      metal: g.auto.metal.includes('Mg'),
      metalDouble: g.auto.metal[0] === 'Mg' && g.auto.metal[1] === 'Mg',
      tail: this.expressMin(g.auto.tail, TAIL_RANK),
      tailColor: 'none', tailColor2: null,
      tux: 0, sb: 0, st: 0, grass: 0, mosaic: 0, moscow: 0,
      size: g.quant.size, tailLen: g.quant.tailLen, vigor: g.quant.vigor, intensity: g.quant.intensity,
    };
    if (g.sex === 'M') {
      const [x, y] = g.sc;
      // Y'deki kuyruk rengi öncelikli; X'tekiyle farklıysa iki renkli (alt/üst) görünür.
      const a = y.tc !== 'none' ? y.tc : x.tc, b = y.tc !== 'none' && x.tc !== 'none' && x.tc !== y.tc ? x.tc : null;
      p.tailColor = a; p.tailColor2 = b;
      for (const k of ['tux', 'sb', 'st', 'grass', 'mosaic', 'moscow']) p[k] = (x[k] || y[k]) ? 1 : 0;
    }
    p.sig = [p.sex, p.body, p.purple | 0, p.metal | 0, p.tail, p.tailColor, p.tailColor2, p.tux, p.sb, p.st, p.grass, p.mosaic, p.moscow].join('|');
    return p;
  },

  breedOf(p) { return BREEDS.find((b) => b.test(p)); },

  /** Taşıyıcılık: dişide/erkekte gizli ama aktarılabilen genler (genetik defter için). */
  carried(g) {
    const out = [];
    if (g.sex === 'F') for (const h of g.sc) {
      if (h.tc !== 'none') out.push('Kuyruk: ' + TAILCOL[h.tc].name);
      if (h.tux) out.push('Tuxedo'); if (h.sb) out.push('Snakeskin gövde'); if (h.st) out.push('Snakeskin kuyruk');
      if (h.grass) out.push('Grass'); if (h.mosaic) out.push('Mozaik'); if (h.moscow) out.push('Moscow');
    }
    return [...new Set(out)];
  },

  /* ------------ Kalıtım ------------ */
  mutateAllele(locus, al, rng) {
    if (locus === 'body') {
      const pool = BODY_RANK.filter((a) => a !== al);
      // efsanevi/mitik mutasyonlar çok nadir
      if (rng.chance(0.12)) return rng.pick(['obs', 'aur']);
      return rng.pick(pool.filter((a) => a !== 'obs' && a !== 'aur'));
    }
    if (locus === 'tail') return rng.pick(TAIL_RANK.filter((a) => a !== al));
    if (locus === 'purple') return al === 'Pb' ? 'pb' : 'Pb';
    if (locus === 'metal') return al === 'Mg' ? 'mg' : 'Mg';
    return al;
  },
  mutateSc(locus, v, rng) {
    if (locus === 'tc') return rng.pick(Object.keys(TAILCOL).filter((c) => c !== v));
    return v ? 0 : 1;
  },

  gamete(g, rng = R, opts = {}) {
    const mut = opts.noMut ? 0 : MUT_RATE * (opts.mutMul || 1);
    const auto = {};
    for (const l of AUTO_LOCI) {
      let al = g.auto[l][rng.next() < 0.5 ? 0 : 1];
      if (rng.next() < mut) al = this.mutateAllele(l, al, rng);
      auto[l] = al;
    }
    const h0 = Object.assign({}, g.sc[0]), h1 = Object.assign({}, g.sc[1]);
    const rec = opts.noCross ? 0 : (g.sex === 'M' ? (opts.xyCross ?? XY_CROSS) : XX_CROSS);
    for (const l of SC_LOCI) if (rng.next() < rec) { const t = h0[l]; h0[l] = h1[l]; h1[l] = t; }
    const sc = rng.next() < 0.5 ? h0 : h1;
    for (const l of SC_LOCI) if (rng.next() < mut) sc[l] = this.mutateSc(l, sc[l], rng);
    return { auto, sc };
  },

  /** Bir yavru genomu üretir. Ebeveyn genomları değişmez. */
  breed(sire, dam, rng = R, opts = {}) {
    const pg = this.gamete(sire, rng, opts), mg = this.gamete(dam, rng, opts);
    const g = { sex: pg.sc.Y ? 'M' : 'F', auto: {}, sc: [mg.sc, pg.sc], quant: {} };
    for (const l of AUTO_LOCI) g.auto[l] = [mg.auto[l], pg.auto[l]];
    for (const q in QUANT) {
      const [lo, hi] = QUANT[q].range;
      let v = (sire.quant[q] + dam.quant[q]) / 2 + rng.gauss(0, 0.045);
      if (!opts.noMut && rng.chance(0.01)) v += rng.gauss(0, 0.2);     // nadir sıçrama
      g.quant[q] = clamp(v, lo, hi);
    }
    return g;
  },

  /** Sağlık çarpanı: dayanıklılık, akrabalı üreme ve çift Metal geni. */
  health(g, F = 0) {
    const p = this.phenotype(g);
    let v = p.vigor * (1 - 1.6 * F) * (p.metalDouble ? 0.65 : 1);
    return clamp(v, 0.1, 1.4);
  },

  /** Genotip metni (test sonrası görünen). */
  describe(g) {
    const rows = [];
    rows.push(['Gövde rengi (otozomal)', g.auto.body.map((a) => BODY[a].name).join(' / ')]);
    rows.push(['Mor gövde (Pb)', g.auto.purple.join(' / ')]);
    rows.push(['Metal (Mg)', g.auto.metal.join(' / ')]);
    rows.push(['Kuyruk tipi', g.auto.tail.map((a) => TAILS[a].name).join(' / ')]);
    const hn = (h) => { const l = [h.tc !== 'none' ? 'kuyruk ' + TAILCOL[h.tc].name : null, h.tux ? 'Tuxedo' : null, h.sb ? 'Snake-gövde' : null, h.st ? 'Snake-kuyruk' : null, h.grass ? 'Grass' : null, h.mosaic ? 'Mozaik' : null, h.moscow ? 'Moscow' : null].filter(Boolean); return l.length ? l.join(', ') : '–'; };
    rows.push(['X kromozomu', hn(g.sc[0])]);
    rows.push([g.sex === 'M' ? 'Y kromozomu' : '2. X kromozomu', hn(g.sc[1])]);
    return rows;
  },
};

/* ───── 03-fish-art.js ───── */
'use strict';
/* =====================================================================
   03 · BALIK ÇİZİCİ — genlerden prosedürel doku + omurga tabanlı deformasyon
   ---------------------------------------------------------------------
   1) build(): fenotipten, düz poz (burun solda, kuyruk sağda) bir doku üretir
      (vücut, pul, desen, yüzgeçler, kuyruk, göz). Yalnızca gen / olgunluk
      değişince yeniden çizilir (offscreen önbellek).
   2) draw(): dokuyu dilimler halinde, yüzme dalgasıyla bükülen omurga
      çizgisine (midline) yerleştirir. Gövde ve kuyruk aynı dalgayla hareket
      eder; kuyruk uçları sönümlü yaylarla gecikmeli takip eder.
   ===================================================================== */
const FishArt = {
  TW: 440, TH: 210, J: 11, SUB: 3,
  SC: 0.28, // vücut ağırlık merkezinin doku boyunca konumu (0..1)

  /* ---------- renk hesapları ---------- */
  bodyColor(p, mat) {
    const b = BODY[p.body]; let h = b.h, s = b.s, l = b.l;
    if (p.purple) { h = hueLerp(h, 285, 0.55); s = Math.max(s, 40) + 12; l *= 0.86; }
    if (p.moscow) { const tc = TAILCOL[p.tailColor]; h = hueLerp(h, p.tailColor === 'none' ? 225 : tc.h, 0.55); s = clamp(s + 8, 0, 70); l *= 0.36; }
    if (p.sex === 'M') s *= lerp(0.4, 1, mat) * clamp(p.intensity, 0.65, 1.2);
    else { s *= 0.62; l = Math.min(90, l + 6); }
    return { h, s, l };
  },

  /* ---------- desen yardımcıları ---------- */
  rings(ctx, x0, y0, x1, y1, r, rng, col, lw) {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    for (let y = y0, row = 0; y < y1; y += r * 1.55, row++) for (let x = x0 + (row % 2 ? r : 0); x < x1; x += r * 2) { ctx.beginPath(); ctx.arc(x + rng.float(-1, 1), y + rng.float(-1, 1), r * 0.88, 0, TAU); ctx.stroke(); }
  },
  dots(ctx, n, x0, y0, x1, y1, rmin, rmax, col, rng) {
    ctx.fillStyle = col;
    for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.arc(rng.float(x0, x1), rng.float(y0, y1), rng.float(rmin, rmax), 0, TAU); ctx.fill(); }
  },
  blotches(ctx, n, x0, y0, x1, y1, rmin, rmax, cols, rng) {
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = rng.pick(cols); const cx = rng.float(x0, x1), cy = rng.float(y0, y1), r = rng.float(rmin, rmax);
      ctx.beginPath(); for (let k = 0; k <= 10; k++) { const a = (k / 10) * TAU, rr = r * (0.65 + 0.5 * rng.next()); const px = cx + Math.cos(a) * rr * 1.4, py = cy + Math.sin(a) * rr; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.closePath(); ctx.fill();
    }
  },
  smoothPoly(ctx, pts) {
    const n = pts.length; ctx.beginPath(); ctx.moveTo((pts[0][0] + pts[n - 1][0]) / 2, (pts[0][1] + pts[n - 1][1]) / 2);
    for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
    ctx.closePath();
  },

  /* ---------- kuyruk geometrisi: kök (0,0) → uç (+x) ---------- */
  tailPoly(type, L, Hh) {
    const prof = (f, Lm, hh = Hh, N = 22) => {
      const top = [], bot = [];
      for (let i = 0; i <= N; i++) { const u = i / N, v = f(u) * hh; top.push([Lm * u, -v]); bot.push([Lm * u, v]); }
      return top.concat(bot.reverse());
    };
    const fanF = (e) => (u) => (u <= e ? 0.10 + 0.90 * Math.pow(Math.sin((u / e) * Math.PI / 2), 0.9) : Math.sqrt(Math.max(0, 1 - Math.pow((u - e) / (1 - e), 2))));
    const out = { poly: null, extra: null, edge: 'smooth' };
    switch (type) {
      case 'delta': out.poly = prof((u) => 0.10 + 0.90 * u, L, Hh, 12); out.edge = 'sharp'; break;
      case 'fan': out.poly = prof(fanF(0.86), L); break;
      case 'veil': out.poly = prof((u) => fanF(0.9)(u) + 0.03 * Math.sin(u * 38) * smoothstep(0.55, 1, u), L, Hh * 1.02, 34); break;
      case 'lace': out.poly = prof((u) => fanF(0.92)(u) + 0.045 * Math.sin(u * 52) * smoothstep(0.5, 1, u), L, Hh * 1.05, 40); break;
      case 'round': out.poly = prof((u) => 0.12 + 0.88 * Math.sqrt(Math.max(0, 1 - Math.pow((u - 0.55) / 0.55, 2))), L, Hh * 0.95); break;
      case 'spade': out.poly = prof((u) => (u < 0.6 ? 0.10 + 0.90 * Math.sin((u / 0.6) * Math.PI / 2) : Math.max(0.03, Math.pow(1 - (u - 0.6) / 0.4, 1.15))), L, Hh * 0.9); break;
      case 'lyre': {
        const P = [[0, -0.1], [0.35, -0.38], [0.7, -0.78], [0.98, -1], [0.93, -0.72], [0.86, -0.4], [0.78, -0.12], [0.76, 0], [0.78, 0.12], [0.86, 0.4], [0.93, 0.72], [0.98, 1], [0.7, 0.78], [0.35, 0.38], [0, 0.1]];
        out.poly = P.map(([u, v]) => [u * L, v * Hh]); break;
      }
      case 'halfmoon': {
        const R = Math.min(L, Hh * 1.05), pts = [[0, -R * 0.12]];
        for (let i = 0; i <= 20; i++) { const a = -Math.PI / 2 + (i / 20) * Math.PI; pts.push([R * Math.cos(a) * (L / R > 1 ? 1 : 1), R * Math.sin(a)]); }
        pts.push([0, R * 0.12]); out.poly = pts; out.edge = 'sharp'; break;
      }
      case 'crown': {
        const pts = [[0, -Hh * 0.1]]; const n = 11;
        for (let i = 0; i <= 3; i++) pts.push([L * 0.9 * (i / 3), -Hh * (0.1 + 0.9 * (i / 3))]);
        for (let k = 0; k <= n; k++) { const v = -1 + (2 * k) / n; pts.push([L * (k % 2 ? 0.86 : 1.0), v * Hh]); }
        for (let i = 3; i >= 0; i--) pts.push([L * 0.9 * (i / 3), Hh * (0.1 + 0.9 * (i / 3))]);
        out.poly = pts; out.edge = 'sharp'; break;
      }
      case 'topsword': case 'bottomsword': case 'doublesword': {
        const Lm = L * 0.78;
        out.poly = prof((u) => 0.10 + 0.78 * Math.sin((u * Math.PI) / 1.45), Lm, Hh * 0.62, 18);
        out.swords = [];
        const sw = (sign) => { const y0 = sign * Hh * 0.62 * 0.6; return [[Lm * 0.45, y0 - sign * 3], [L, sign * Hh * 0.34], [L, sign * Hh * 0.34 + sign * 1.2], [Lm * 0.45, y0 + sign * 4]]; };
        if (type !== 'bottomsword') out.swords.push(sw(-1));
        if (type !== 'topsword') out.swords.push(sw(1));
        break;
      }
      default: out.poly = prof((u) => 0.1 + 0.9 * u, L);
    }
    return out;
  },

  /* ---------- doku üretimi ---------- */
  build(p, mat, seed) {
    const TW = this.TW, TH = this.TH, MID = TH / 2, rng = new RNG(seed || 1);
    const male = p.sex === 'M';
    const tt = TAILS[p.tail];
    const tailFrac = (1 - tt.bf) * clamp(0.78 + 0.22 * p.tailLen, 0.7, 1.15) * (male ? lerp(0.78, 1, mat) : 0.72);
    const bf = 1 - tailFrac;
    const x0 = 8, bodyLen = bf * TW - x0, xb = x0 + bodyLen;
    const H = bodyLen * (male ? 0.150 : 0.190);
    const col = this.bodyColor(p, mat);
    const tcol = TAILCOL[p.tailColor] || TAILCOL.none;
    const solid = p.moscow && p.tailColor !== 'none';
    const tex = document.createElement('canvas'); tex.width = TW; tex.height = TH;
    const glow = document.createElement('canvas'); glow.width = TW; glow.height = TH;
    const c = tex.getContext('2d'), gl = glow.getContext('2d');

    const prof = (s) => Math.pow(Math.sin(Math.PI * Math.pow(Math.max(s, 0), 0.62)), 0.85) * (1 - 0.32 * s) + 0.21 * smoothstep(0.4, 1, s);
    const topY = (s) => MID - prof(s) * H * 0.93;
    const botY = (s) => MID + prof(s) * H * (male ? 1.0 : 1.0 + 0.28 * Math.sin(Math.PI * Math.min(1, s * 1.1)));
    const bodyPath = (cx) => {
      cx.beginPath(); const N = 44;
      for (let i = 0; i <= N; i++) { const s = i / N; const x = x0 + s * bodyLen, y = topY(s); i ? cx.lineTo(x, y) : cx.moveTo(x, y); }
      for (let i = N; i >= 0; i--) { const s = i / N; cx.lineTo(x0 + s * bodyLen, botY(s)); }

    };

    /* --- kuyruk --- */
    const tailLen = TW - 3 - (xb - 6), tailH = Math.min(TH / 2 - 6, male ? tailLen * lerp(0.62, 0.95, mat) : tailLen * 0.55);
    const T = this.tailPoly(p.tail, tailLen, tailH);

    c.save(); c.translate(xb - 6, MID);
    const tailPath = () => { if (T.edge === 'smooth') this.smoothPoly(c, T.poly); else { c.beginPath(); T.poly.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); } };

    if (male && p.grass) this.dots(c, 120, 0, -tailH, tailLen, tailH, 0.8, 1.7, hsl(tc.h, tS, 14, 0.55 * mat + 0.1), rng);

'use strict';
/* =====================================================================
   04 · CANLI + YÜZME SİMÜLASYONU
   Creature : kalıcı veri (genom, isim, yaş…) + türetilmiş fenotip
   Swimmer  : omurga dalgası, durum makinesi (süzülme / duruş / yeme / kur /
              ürkme / dinlenme), sürü davranışı, ikincil (yaylı) kuyruk hareketi
   ===================================================================== */

let _nextId = 1;
const newId = () => _nextId++;

class Creature {
  constructor(d) {
    this.id = d.id || newId(); if (this.id >= _nextId) _nextId = this.id + 1;
    this.species = 'guppy';
    this.genome = d.genome;
    this.name = d.name || (d.genome.sex === 'F' ? R.pick(NAMES_F) : R.pick(NAMES_M));
    this.bornT = d.bornT ?? 0;                    // oyun dakikası
    this.seed = d.seed || ((R.next() * 2 ** 31) >>> 0);
    this.fav = !!d.fav; this.tested = !!d.tested;
    this.sire = d.sire || 0; this.dam = d.dam || 0;
    this.pers = d.pers || { activity: R.float(0.25, 1), bold: R.float(0.1, 1), curious: R.float(0.1, 1), social: R.float(0.2, 1) };
    this.x = d.x; this.y = d.y;
    this.stress = 0;
    this.pheno = Genetics.phenotype(this.genome);
    this.sprite = null; this.sw = new Swimmer(this);
    this.now = 0;                                 // son bilinen oyun dakikası (yaş için)
  }
  get sex() { return this.genome.sex; }
  ageDays(now = this.now) { return Math.max(0, (now - this.bornT) / 1440); }
  /** Yavru→yetişkin büyüme (0.34 → 1). */
  growth(now = this.now) { return 0.34 + 0.66 * smoothstep(0, 42, this.ageDays(now)); }
  /** Erkekte renk olgunluğu: günler içinde yavaşça "açılır". */
  maturity(now = this.now) { return this.sex === 'M' ? smoothstep(14, 70, this.ageDays(now)) : 1; }
  stage(now = this.now) { const a = this.ageDays(now); return a < 10 ? 'Yavru' : a < 42 ? 'Genç' : 'Yetişkin'; }
  /** Dünya birimi cinsinden gövde uzunluğu. */
  bodyLen() { return 58 * this.pheno.size * this.growth() * (this.sex === 'F' ? 1.2 : 0.86); }
  breed() { return Genetics.breedOf(this.pheno); }
  rarity() { return this.breed().rarity; }
  inbreeding() { return Pedigree.F(this.id); }
  health() { return Genetics.health(this.genome, this.inbreeding()); }
  value() {
    const r = RARITY[this.rarity()].value, size = 0.6 + 0.4 * this.growth();
    const stageMul = this.ageDays() < 10 ? 0.4 : 1;
    return Math.max(5, Math.round(r * size * stageMul * clamp(this.health(), 0.5, 1.15) * (this.fav ? 1 : 1)));
  }
  toJSON() {
    return { id: this.id, name: this.name, genome: this.genome, bornT: this.bornT, seed: this.seed, fav: this.fav, tested: this.tested, sire: this.sire, dam: this.dam, pers: this.pers, x: Math.round(this.sw.x), y: Math.round(this.sw.y) };
  }
}

const J = FishArt.J;

class Swimmer {
  constructor(c) {
    this.c = c; const p = c.pers;
    this.x = c.x ?? 300; this.y = c.y ?? 300; this.heading = R.float(-0.5, 0.5) + (R.chance(0.5) ? 0 : Math.PI);
    this.speed = 0; this.turn = 0; this.z = R.next(); this.zT = R.float(0, 1000);
    this.flip = 1; this.state = 'glide'; this.stateT = 0; this.t = R.float(0, 100); this.phase = R.float(0, TAU);
    this.freq = 1; this.amp = 0.5; this.bend = 0; this.mouthT = 0; this.pf = R.float(0, TAU); this.pfRate = 3;
    this.tx = this.x; this.ty = this.y; this.targetT = 0; this.seed = R.float(0, 500);
    this.joints = new Array(J).fill(0); this.jv = new Array(J).fill(0);
    this.court = 0; this.courtWith = null; this.startleT = 0; this.eaten = 0; this.foodSeen = -1;
    this.targetAmp = 0.5; this.courtAmp = 0;
    this.speedMul = lerp(0.8, 1.2, p.activity);
  }

  /** Portre/kart modu: yerinde, sakin yüzüş (yüzgeçler çalışır, gövde hafifçe dalgalanır, dönüş yok). */
  updateCalm(dt) {
    this.t += dt; const g = 0.5 + 0.5 * noise1(this.t * 0.4 + this.seed);
    this.heading = damp(this.heading, 0.06 * noise1(this.t * 0.35 + this.seed), 2, dt); this.flipTarget = 1; this.flip = damp(this.flip, 1, 6, dt);
    this.freq = damp(this.freq, 0.9 + 0.5 * g, 2, dt); this.amp = damp(this.amp, 0.38 + 0.3 * g, 2, dt); this.phase += TAU * this.freq * dt;
    this.bend = damp(this.bend, 0.12 * noise1(this.t * 0.3 + this.seed), 2, dt);
    this.pfRate = damp(this.pfRate, 4 + 2 * g, 3, dt); this.pf += this.pfRate * dt; this.courtAmp = 0; this.mouthT = Math.max(0, this.mouthT - dt);
    this.updateJoints(dt);
  }

  /** Dünya sınırı ve komşular: env = {W,H,top,bottom,food,others,night,time,calm,onEat} */
  update(dt, env) {
    if (env.calm) return this.updateCalm(Math.min(dt, 0.05));
    const c = this.c, p = c.pers, L = c.bodyLen(); dt = Math.min(dt, 0.05);
    this.t += dt; this.stateT += dt; this.mouthT = Math.max(0, this.mouthT - dt); this.startleT = Math.max(0, this.startleT - dt);
    const margin = env.margin ?? (L * 1.1 + 18), top = env.top ?? 40, bottom = env.bottom ?? env.H - 70;
    c.stress = Math.max(0, c.stress - dt * 0.05);

    /* ---------- 1) Durum seçimi ---------- */
    let st = this.state;
    const wantRest = env.night > 0.62 && !env.calm;
    const food = env.food && env.food.length ? env.food : null;
    if (this.startleT > 0) st = 'startle';
    else if (food && !env.calm && (env.foodAge > (1 - p.bold) * 2.2) && this.eaten < 3) st = 'feed';
    else if (wantRest) st = 'rest';
    else if (st === 'startle' || st === 'feed' || st === 'rest') st = 'glide';
    if (st === 'glide' && this.court > 0) { this.court -= dt; st = this.court > 0 ? 'court' : 'glide'; }
    else if (st === 'court') st = 'glide';
    // kur yapma: olgun erkek, yakında dişi
    if (st === 'glide' && c.sex === 'M' && c.growth() > 0.9 && !env.calm && this.stateT > 2 && R.next() < dt * 0.02 * p.activity) {
      const f = env.others.find((o) => o !== c && o.sex === 'F' && o.growth() > 0.9 && Math.hypot(o.sw.x - this.x, o.sw.y - this.y) < 260);
      if (f) { this.court = R.float(4, 7); this.courtWith = f; st = 'court'; }
    }
    // dinlenmekten uyanınca / glide içinde ara ara duruş
    if (st === 'glide' && !env.calm && this.stateT > 3 && R.next() < dt * 0.05 * (1.15 - p.activity)) st = 'hover';
    if (this.state === 'hover' && st === 'hover' && this.stateT > R.float(2.5, 6) ) st = 'glide';
    if (st !== this.state) { this.state = st; this.stateT = 0; this.targetT = 0; }

    /* ---------- 2) Hedef ve yönlendirme ---------- */
    let spdMul = 0.55, ampT = 0.7, wantTx = this.tx, wantTy = this.ty, steer = 1;
    if (this.targetT <= 0 || Math.hypot(this.tx - this.x, this.ty - this.y) < (env.calm ? L * 0.25 : L * 0.7)) {
      this.targetT = R.float(3, 7);
      const dir = env.calm ? (this.x < env.W / 2 ? 1 : -1) : R.chance(0.7) && Math.abs(Math.cos(this.heading)) > 0.3 ? Math.sign(Math.cos(this.heading)) : (R.chance(0.5) ? -1 : 1);
      const cx = env.calm ? env.W / 2 : this.x;
      this.tx = env.calm ? env.W / 2 + dir * env.W * 0.07 : clamp(cx + dir * R.float(160, 420), margin, env.W - margin);
      this.ty = env.calm ? env.H * 0.46 : clamp(this.y + R.float(-130, 130), top + margin * 0.5, bottom - 10);
    }
    this.targetT -= dt;
    let pecFlap = 3.2;
    switch (st) {
      case 'glide': {
        const gate = smoothstep(-0.25, 0.45, noise1(this.t * 0.5 + this.seed));
        this.gate = gate; spdMul = (0.32 + 0.7 * gate) * 0.62 * this.speedMul; ampT = 0.45 + 0.55 * gate; break;
      }
      case 'hover': spdMul = 0.03; ampT = 0.2; pecFlap = 8; steer = 0.15; this.gate = 0.2; break;
      case 'feed': {
        const f = this.nearestFood(env.food);
        if (f) {
          this.tx = f.x; this.ty = f.y; spdMul = 1.35; ampT = 0.9; pecFlap = 7;
          const d = Math.hypot(f.x - this.x, f.y - this.y);
          if (d < L * 0.42) { f.eaten = true; this.eaten++; this.mouthT = 0.35; this.speed *= 0.1; c.stress = Math.max(0, c.stress - 0.1); env.onEat && env.onEat(c, f); }
          else if (d < L * 1.6) spdMul = Math.max(0.35, d / (L * 1.6) * 1.2);
        } else { spdMul = 0.2; ampT = 0.3; }
        break;
      }
      case 'startle': spdMul = 3.2 * (this.startleT / 0.7 + 0.15); ampT = 1.15; pecFlap = 10; break;
      case 'rest':
        spdMul = 0.04; ampT = 0.12; pecFlap = 1.2; steer = 0.2;
        if (this.stateT < 0.1 || this.targetT <= 0) { this.ty = bottom - R.float(8, 40); this.tx = clamp(this.x + R.float(-60, 60), margin, env.W - margin); this.targetT = R.float(8, 15); }
        break;
      case 'court': {
        const f = this.courtWith;
        if (f && f.sw) { this.tx = f.sw.x - Math.cos(f.sw.heading) * L * 0.2; this.ty = f.sw.y - L * 0.45; }
        const d = f ? Math.hypot(this.tx - this.x, this.ty - this.y) : 99;
        spdMul = d < L ? 0.35 : 0.9; ampT = 0.8; pecFlap = 6; break;
      }
    }

    if (env.calm) spdMul *= 0.4;

    /* ---------- 3) Sürü kuralları (ayrılma / yapışma / hizalanma) ---------- */
    let sx = 0, sy = 0, cx = 0, cy = 0, ax = 0, ay = 0, nCoh = 0;
    for (const o of env.others) {
      if (o === c) continue; const s = o.sw, dx = s.x - this.x, dy = s.y - this.y, d2 = dx * dx + dy * dy, d = Math.sqrt(d2) || 1;
      const sep = L * 0.9 + o.bodyLen() * 0.4;
      if (d < sep) { const w = (sep - d) / sep; sx -= (dx / d) * w; sy -= (dy / d) * w; }
      if (d < 260 && st === 'glide') { cx += s.x; cy += s.y; ax += Math.cos(s.heading); ay += Math.sin(s.heading); nCoh++; }
    }
    const dd = wantDir(this.tx - this.x, this.ty - this.y);
    let dvx = dd.x, dvy = dd.y;
    dvx += sx * 1.6; dvy += sy * 1.6;
    if (nCoh && st === 'glide') {
      const k = 0.22 * p.social; const m = Math.hypot(cx / nCoh - this.x, cy / nCoh - this.y) || 1;
      dvx += ((cx / nCoh - this.x) / m) * k + (ax / nCoh) * 0.18 * p.social; dvy += ((cy / nCoh - this.y) / m) * k + (ay / nCoh) * 0.18 * p.social;
    }
    // duvarlardan kavisle uzaklaş (ileri bakışlı)
    const lx = this.x + Math.cos(this.heading) * L * 2.2, ly = this.y + Math.sin(this.heading) * L * 2.2;
    if (!env.calm) {
      if (lx < margin) dvx += (margin - lx) / margin * 2.2; if (lx > env.W - margin) dvx -= (lx - (env.W - margin)) / margin * 2.2;
      if (ly < top + margin * 0.4) dvy += 1.6; if (ly > bottom) dvy -= 1.6;
    }
    if (st === 'glide' || st === 'hover') dvy *= env.calm ? 0.2 : 0.7;   // dikey eğimi sınırla: yatay yüzüş doğal
    let hd = Math.atan2(dvy, dvx);
    if (st !== 'startle') { // balıklar çoğunlukla yatay yüzer: eğimi sınırla (yüz değiştirirken histerezis)
      const cf = Math.cos(this.heading) >= 0 ? 0 : Math.PI, face = Math.abs(Math.cos(hd)) > 0.3 ? (Math.cos(hd) >= 0 ? 0 : Math.PI) : cf;
      hd = face + clamp(angDiff(face, hd), st === 'feed' ? -1.15 : -0.62, st === 'feed' ? 1.15 : 0.62);
    }
    const err = angDiff(this.heading, hd);
    const maxTurn = st === 'startle' ? 7 : st === 'feed' ? 3.2 : 1.7;
    const wantTurn = clamp(err * 2.4 * steer, -maxTurn, maxTurn);
    this.turn = damp(this.turn, wantTurn, st === 'startle' ? 12 : 3.5, dt);
    this.heading += this.turn * dt;
    if (this.heading > Math.PI) this.heading -= TAU; else if (this.heading < -Math.PI) this.heading += TAU;

    /* ---------- 4) Hız ---------- */
    let vTarget = spdMul * L * (1 - 0.65 * smoothstep(0.6, 2.4, Math.abs(err)));   // keskin dönüşte yavaşla
    if (st === 'startle' && this.startleT > 0.68) this.speed = Math.max(this.speed, spdMul * L * 0.9);
    this.speed = damp(this.speed, vTarget, st === 'startle' ? 9 : 1.6, dt);
    const vx = Math.cos(this.heading) * this.speed, vy = Math.sin(this.heading) * this.speed;
    this.x += vx * dt; this.y += vy * dt;
    // sert sınır (yumuşak itme)
    const pad = env.pad ?? L * 0.6, hx0 = pad, hx1 = env.W - pad;
    if (this.x < hx0) this.x += (hx0 - this.x) * Math.min(1, dt * 4); if (this.x > hx1) this.x += (hx1 - this.x) * Math.min(1, dt * 4);
    if (this.y < top) this.y += (top - this.y) * Math.min(1, dt * 4); if (this.y > bottom) this.y += (bottom - this.y) * Math.min(1, dt * 4);

    /* ---------- 5) Yüzme dalgası ---------- */
    const vn = clamp(this.speed / (1.5 * L), 0, 2);
    // hız = esas olarak kuyruk vuruş frekansı
    const fTarget = clamp(0.55 + 1.9 * vn, 0.4, 6.5) * (st === 'glide' ? 0.55 + 0.45 * (this.gate ?? 1) : 1);
    this.freq = damp(this.freq, fTarget, 2.8, dt);
    this.targetAmp = ampT * lerp(1, 0.68, clamp(vn, 0, 1));
    this.amp = damp(this.amp, this.targetAmp, 2.2, dt);
    this.phase += TAU * this.freq * dt;
    this.bend = damp(this.bend, clamp(this.turn / 2.2, -1, 1), 5, dt);
    this.courtAmp = damp(this.courtAmp, st === 'court' ? 1 : 0, 2.5, dt);
    this.pfRate = damp(this.pfRate, pecFlap, 3, dt); this.pf += this.pfRate * dt;
    // yeme sonrası küçük geri tepme sönümü
    // yüzey / derinlik
    this.zT += dt * 0.02; this.z = 0.5 + 0.5 * noise1(this.zT + this.seed);
    this.flipUpdate(dt);
    this.updateJoints(dt);
  }

  flipUpdate(dt) {
    const cs = Math.cos(this.heading);
    // sola bakarken balığı ters çevir (karın aşağıda kalsın) — kenar-üstü geçişi yumuşak
    if (this.flipTarget === undefined) this.flipTarget = cs >= 0 ? 1 : -1;
    if (cs > 0.18) this.flipTarget = 1; else if (cs < -0.18) this.flipTarget = -1;
    this.flip = damp(this.flip, this.flipTarget, 7, dt);
    if (Math.abs(this.flip) < 0.04) this.flip = this.flipTarget * 0.04;
  }

  updateJoints(dt) {
    const sp = this.c.sprite || FishArt.sprite(this.c), TW = FishArt.TW;
    const n = Math.max(1, Math.ceil(dt / 0.008)), h = dt / n;
    const soft = sp.tailSoft;
    for (let j = 0; j < J; j++) {
      const s = j / (J - 1);
      // ilerleyen dalga: y = A(s) sin(k s − ωt); A(s) = a0 + a1 s + a2 s²  (carangiform)
      const A = 0.02 + 0.02 * s + 0.11 * s * s;
      let y = this.amp * A * TW * Math.sin(TAU * 1.0 * s - this.phase);
      y += this.bend * (s * s) * TW * 0.16;                                 // C-dönüş
      y += this.courtAmp * 0.028 * TW * Math.sin(TAU * 2.4 * s - this.phase * 2.6) * smoothstep(0.05, 0.5, s);  // S-titreşim
      if (s < 0.5) { this.joints[j] = y; this.jv[j] = 0; continue; }
      // kuyruk: gecikmeli sönümlü yay (kumaş gibi)
      const w0 = TAU * lerp(5.5, 2.7, (s - 0.5) / 0.5) * soft, z = 0.5;
      let pos = this.joints[j], vel = this.jv[j];
      for (let i = 0; i < n; i++) { const acc = w0 * w0 * (y - pos) - 2 * z * w0 * vel; vel += acc * h; pos += vel * h; }
      this.joints[j] = pos; this.jv[j] = vel;
    }
  }

  nearestFood(list) {
    let best = null, bd = 1e9;
    for (const f of list) { if (f.eaten) continue; const d = Math.hypot(f.x - this.x, f.y - this.y); if (d < bd) { bd = d; best = f; } }
    return best;
  }

  /** Cama dokunması / ürkme. */
  startle(fromX, fromY, strength = 1) {
    if (this.state === 'rest' && R.chance(0.6)) { this.startleT = 0.5; } else this.startleT = 0.7;
    this.heading = Math.atan2(this.y - fromY, this.x - fromX) + R.float(-0.5, 0.5);
    this.speed = this.c.bodyLen() * 2.5 * strength; this.c.stress = Math.min(1, this.c.stress + 0.3 * strength);
    this.flipTarget = Math.cos(this.heading) >= 0 ? 1 : -1;
  }
}

/** (yardımcı) hedef yönünü normalize eder. */
function wantDir(dx, dy) { const m = Math.hypot(dx, dy) || 1; return { x: dx / m, y: dy / m }; }

'use strict';
/* =====================================================================
   05 · SAHNE — tank, ışık/gün döngüsü, bitkiler, kabarcıklar, yem, çizim
   Dünya birimi: yükseklik 700. Genişlik, ekranın en-boy oranına uyar.
   ===================================================================== */

class Tank {
  constructor() {
    this.creatures = []; this.food = []; this.bubbles = []; this.ripples = []; this.motes = []; this.sparks = [];
    this.t = 0; this.W = 1000; this.H = 700; this.light = 1; this.lightTarget = 1; this.foodAge = 99; this.bgKey = '';
    this.lampMode = 'auto'; this.bubbleT = 0; this.minute = 12 * 60; this.plants = []; this.rocks = [];
    this.onEat = null; this.caus = null;
    for (let i = 0; i < 46; i++) this.motes.push({ x: R.next(), y: R.next(), r: R.float(0.6, 1.8), v: R.float(2, 7), ph: R.float(0, TAU), z: R.float(0.5, 1.3) });
  }

  /** Ekran oranına göre dünya genişliği. */
  setAspect(aspect) {
    const W = Math.round(clamp(700 * aspect, 440, 1700));
    if (Math.abs(W - this.W) < 2 && this.bg) return;
    const old = this.W; this.W = W;
    for (const c of this.creatures) { c.sw.x *= W / old; c.sw.tx *= W / old; }
    this.layout(); this.buildBG();
  }

  layout() {
    const r = new RNG(20240612), W = this.W, H = this.H, gy = H - 74;
    this.rocks = [
      { x: W * 0.30, y: gy + 6, w: 150, h: 92, ph: 0 }, { x: W * 0.37, y: gy + 10, w: 92, h: 58, ph: 1 },
      { x: W * 0.74, y: gy + 8, w: 130, h: 70, ph: 2 },
    ];
    const P = [];
    const frac = [0.05, 0.1, 0.16, 0.54, 0.6, 0.9, 0.95];
    frac.forEach((f, i) => P.push({ type: 'vallis', x: W * f + r.float(-10, 10), y: gy + r.float(2, 10), h: r.float(190, 300) * (i % 2 ? 0.9 : 1), n: 8, layer: 'mid', ph: r.float(0, TAU) }));
    P.push({ type: 'stem', x: W * 0.83, y: gy + 4, h: 230, n: 3, layer: 'mid', ph: 1.2 }, { type: 'stem', x: W * 0.47, y: gy + 6, h: 170, n: 3, layer: 'mid', ph: 2.4 });
    P.push({ type: 'anubias', x: this.rocks[0].x + 20, y: this.rocks[0].y - this.rocks[0].h * 0.55, h: 70, n: 6, layer: 'mid', ph: 0.5 });
    P.push({ type: 'anubias', x: this.rocks[2].x - 10, y: this.rocks[2].y - this.rocks[2].h * 0.5, h: 56, n: 5, layer: 'mid', ph: 3 });
    // uzak (arka plan) bitkiler — soluk, yavaş paralaks
    [0.22, 0.42, 0.66, 0.8].forEach((f) => P.push({ type: 'vallis', x: W * f, y: gy - 6, h: r.float(150, 210), n: 6, layer: 'far', ph: r.float(0, TAU) }));
    // ön plan
    [0.2, 0.68, 0.98].forEach((f) => P.push({ type: 'vallis', x: W * f, y: gy + 40, h: r.float(110, 150), n: 5, layer: 'front', ph: r.float(0, TAU) }));
    this.plants = P;
  }

  buildBG() {
    const W = this.W, H = this.H, sc = Math.min(1.6, 2200 / W);
    const cv = this.bg || (this.bg = document.createElement('canvas'));
    cv.width = Math.round(W * sc); cv.height = Math.round(H * sc);
    const c = cv.getContext('2d'); c.setTransform(sc, 0, 0, sc, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2fb9c8'); g.addColorStop(0.35, '#17869f'); g.addColorStop(0.75, '#0b4a68'); g.addColorStop(1, '#062c43');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // yumuşak ışık havuzları
    for (const [fx, fy, r, a] of [[0.25, 0.1, 0.55, 0.22], [0.7, 0.05, 0.6, 0.18], [0.5, 0.5, 0.8, 0.07]]) {
      const rg = c.createRadialGradient(W * fx, H * fy, 0, W * fx, H * fy, Math.max(W, H) * r);
      rg.addColorStop(0, `rgba(190,255,250,${a})`); rg.addColorStop(1, 'rgba(190,255,250,0)'); c.fillStyle = rg; c.fillRect(0, 0, W, H);
    }
    // zemin (kum) — dalgalı profil
    const r = new RNG(77), gy = H - 78;
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) c.lineTo(x, gy + 8 + Math.sin(x * 0.011) * 7 + Math.sin(x * 0.027 + 1) * 4);
    c.lineTo(W, H); c.closePath();
    const gs = c.createLinearGradient(0, gy, 0, H); gs.addColorStop(0, '#cdb88c'); gs.addColorStop(0.5, '#a58f66'); gs.addColorStop(1, '#6a5a3e');
    c.fillStyle = gs; c.fill();
    c.save(); c.clip();
    for (let i = 0; i < W / 3.2; i++) { const x = r.float(0, W), y = r.float(gy, H), rr = r.float(0.8, 3.2); c.fillStyle = r.pick(['rgba(255,240,200,.28)', 'rgba(60,45,25,.3)', 'rgba(255,255,255,.12)', 'rgba(110,90,60,.35)']); c.beginPath(); c.ellipse(x, y, rr * 1.4, rr, 0, 0, TAU); c.fill(); }
    c.restore();
    // taşlar
    for (const k of this.rocks) {
      const pts = []; const n = 11;
      for (let i = 0; i < n; i++) { const a = Math.PI + (i / (n - 1)) * Math.PI; pts.push([k.x + Math.cos(a) * k.w * 0.5 * (0.88 + r.next() * 0.2), k.y + Math.sin(a) * k.h * (0.8 + r.next() * 0.25)]); }
      pts.push([k.x + k.w * 0.5, k.y + 14], [k.x - k.w * 0.5, k.y + 14]);
      c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath();
      const rg = c.createLinearGradient(k.x - k.w * 0.4, k.y - k.h, k.x + k.w * 0.4, k.y + 10);
      rg.addColorStop(0, '#7e8f9c'); rg.addColorStop(0.5, '#4e5e6c'); rg.addColorStop(1, '#2a3541');
      c.fillStyle = rg; c.fill(); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1.5; c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 1; for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(k.x - k.w * 0.3 + i * 18, k.y - k.h * 0.6 + i * 6); c.lineTo(k.x - k.w * 0.1 + i * 16, k.y - k.h * 0.2); c.stroke(); }
    }
    // arka cam gölgesi
    const gv = c.createLinearGradient(0, 0, 0, H); gv.addColorStop(0, 'rgba(0,20,30,0)'); gv.addColorStop(1, 'rgba(0,15,25,.35)'); c.fillStyle = gv; c.fillRect(0, 0, W, H);
    // kostik deseni
    if (!this.caus) {
      const cs = 192, cc = document.createElement('canvas'); cc.width = cc.height = cs; const cx = cc.getContext('2d'), id = cx.createImageData(cs, cs);
      for (let y = 0; y < cs; y++) for (let x = 0; x < cs; x++) {
        const u = (x / cs) * TAU, v = (y / cs) * TAU;
        const a = Math.sin(u * 2 + Math.sin(v * 3) * 1.1) + Math.sin(v * 2 + Math.sin(u * 3 + 1) * 1.1) + Math.sin((u + v) * 3 + 0.5);
        const b = Math.max(0, 1 - Math.abs(a) * 1.5), i = (y * cs + x) * 4;
        id.data[i] = 220; id.data[i + 1] = 255; id.data[i + 2] = 255; id.data[i + 3] = Math.pow(b, 2) * 255;
      }
      cx.putImageData(id, 0, 0); this.caus = cc;
    }
  }

  /* ---------------- Işık / gün döngüsü ---------------- */
  lampTarget(min) {
    if (this.lampMode === 'on') return 1; if (this.lampMode === 'off') return 0;
    const m = min % 1440; return m >= 420 && m < 1260 ? 1 : 0;           // 07:00–21:00
  }

  addCreature(c) { this.creatures.push(c); return c; }
  removeCreature(c) { const i = this.creatures.indexOf(c); if (i >= 0) this.creatures.splice(i, 1); }

  feed() {
    if (this.food.filter((f) => !f.eaten).length > 6) return false;
    const n = 14, cx = R.float(this.W * 0.3, this.W * 0.7);
    for (let i = 0; i < n; i++) this.food.push({ x: cx + R.float(-70, 70), y: 30 + R.float(-6, 8), vy: R.float(20, 30), ph: R.float(0, TAU), life: 40, eaten: false, r: R.float(1.6, 2.8) });

  startleAt(x, y, radius, strength = 1) {
    this.ripples.push({ x, y, r: 3, life: 1.2, max: 50 });
    for (const c of this.creatures) { const d = Math.hypot(c.sw.x - x, c.sw.y - y); if (d < radius && R.next() < 0.9 - c.pers.bold * 0.5) c.sw.startle(x, y, strength * (1 - d / radius * 0.6)); }

  update(dt, minute) {

    this.light = damp(this.light, this.lightTarget, 0.55, dt);
    const env = { W: this.W, H: this.H, top: 56, bottom: this.H - 76, food: this.food, foodAge: this.foodAge, others: this.creatures, night: 1 - this.light, time: this.t, onEat: this.onEat };
    for (const c of this.creatures) { c.now = minute; c.sw.update(dt, env); }

    for (const b of this.bubbles) { b.y -= b.vy * dt; b.x += Math.sin(this.t * 3 + b.ph) * 9 * dt; b.r += dt * 0.5; }

    for (const r of this.ripples) { r.life -= dt; r.r += (r.max / 1.2) * dt; }

  /** Dokunma/tıklama: dünya koordinatında en yakın balık. */
  hit(wx, wy, minR = 24) {

  /* ---------------- Çizim ---------------- */
  drawPlant(ctx, p, t, off) {
    const x = p.x + off, y = p.y, cur = 0.5 + 0.5 * Math.max(0, 1 - p.x / (this.W * 0.5));   // filtre çıkışı solda: daha çok sallanır

    }
  }

  /**
   * v: {cw, ch, dpr, cx, cy, zoom, par, rays}

   */
  render(ctx, v) {

    ctx.setTransform(base[0], base[1], base[2], base[3], base[4], base[5]);
    const px = v.cx - W / 2 + (v.par || 0);

    }

    for (const p of this.plants) if (p.layer === 'mid') this.drawPlant(ctx, p, t, px * -0.05);
    // balıklar (derinliğe göre)
    const list = this.creatures.slice().sort((a, b) => a.sw.z - b.sw.z);
    const vx0 = (-tx) / S - 160, vx1 = (v.cw - tx) / S + 160, vy0 = (-ty) / S - 160, vy1 = (v.ch - ty) / S + 160;
    for (const c of list) {
      const s = c.sw; if (s.x < vx0 || s.x > vx1 || s.y < vy0 || s.y > vy1) continue;
      FishArt.draw(ctx, c, t, 0.9 + 0.2 * s.z, 0.82 + 0.18 * s.z, base);
      if (c.fav && v.showFav) { ctx.fillStyle = '#ffd36b'; ctx.font = '14px sans-serif'; ctx.fillText('★', s.x - 5, s.y - c.bodyLen() * 0.55); }
    }
    // ön plan bitkileri
    for (const p of this.plants) if (p.layer === 'front') this.drawPlant(ctx, p, t, px * 0.18);
    // yem
    for (const f of this.food) { ctx.fillStyle = `rgba(230,190,110,${clamp(f.life / 6, 0.2, 1)})`; ctx.beginPath(); ctx.ellipse(f.x, f.y, f.r * 1.5, f.r, f.ph, 0, TAU); ctx.fill(); }
    // kabarcıklar
    for (const b of this.bubbles) {
      ctx.strokeStyle = 'rgba(220,255,255,.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.22, 0, TAU); ctx.fill();
    }
    // asılı parçacıklar
    ctx.fillStyle = 'rgba(220,255,250,.35)';
    for (const m of (v.low ? [] : this.motes)) { ctx.globalAlpha = (0.25 + 0.5 * L) * m.z * 0.6; ctx.beginPath(); ctx.arc(m.x * W + px * 0.3 * m.z, m.y * H, m.r, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
    // su yüzeyi
    ctx.save(); ctx.fillStyle = '#081a24'; ctx.beginPath(); ctx.moveTo(-50, -60);
    ctx.lineTo(W + 50, -60); for (let x = W + 50; x >= -50; x -= 12) ctx.lineTo(x, 24 + Math.sin(x * 0.02 + t * 1.1) * 1.8 + Math.sin(x * 0.047 - t * 1.7) * 1.1);
    ctx.closePath(); ctx.fill();
    const sg = ctx.createLinearGradient(0, 22, 0, 70); sg.addColorStop(0, `rgba(210,255,255,${0.35 * L + 0.1})`); sg.addColorStop(1, 'rgba(210,255,255,0)'); ctx.fillStyle = sg; ctx.fillRect(-50, 22, W + 100, 50);
    ctx.strokeStyle = 'rgba(230,255,255,.5)'; ctx.lineWidth = 1.4; ctx.beginPath(); for (let x = -50; x <= W + 50; x += 12) { const y = 24 + Math.sin(x * 0.02 + t * 1.1) * 1.8 + Math.sin(x * 0.047 - t * 1.7) * 1.1; x === -50 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke();
    ctx.restore();
    for (const r of this.ripples) { ctx.strokeStyle = `rgba(230,255,255,${clamp(r.life, 0, 1) * 0.5})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r * 1.6, r.r * 0.5, 0, 0, TAU); ctx.stroke(); }
    // gece / gün-doğumu rengi
    const night = 1 - L;
    if (night > 0.01) { ctx.fillStyle = `rgba(8,18,60,${0.58 * night})`; ctx.fillRect(0, 0, W, H); }
    const warm = Math.sin(Math.PI * L); if (warm > 0.02 && L > 0.02 && L < 0.98) { ctx.fillStyle = `rgba(255,140,70,${0.16 * warm})`; ctx.fillRect(0, 0, W, H); }
    // cam: ekran uzayında vinyet + yansıma
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const vg = ctx.createRadialGradient(v.cw / 2, v.ch / 2, Math.min(v.cw, v.ch) * 0.35, v.cw / 2, v.ch / 2, Math.max(v.cw, v.ch) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,10,18,.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, v.cw, v.ch);
    const rg = ctx.createLinearGradient(0, 0, v.cw, v.ch * 0.6); rg.addColorStop(0, 'rgba(255,255,255,.07)'); rg.addColorStop(0.18, 'rgba(255,255,255,0)'); ctx.fillStyle = rg; ctx.fillRect(0, 0, v.cw, v.ch);
  }
}

/** Başlangıç popülasyonu: karışık erkek/dişi; dişiler gizli gen taşır. */
function createStarterFish(tank, now) {
  const mk = (spec, sex, age) => tank.addCreature(new Creature({ genome: Genetics.make(spec, sex), bornT: now - age * 1440, x: R.float(160, tank.W - 160), y: R.float(160, tank.H - 220) }));
  const A = 90;
  mk({ tc: 'red', tail: 'delta' }, 'M', A); mk({ tc: 'blue', tail: 'fan', body: ['W', 'blu'] }, 'M', A + 5);
  mk({ body: ['gld', 'gld'], tail: 'round', tc: 'none' }, 'M', A + 12);
  mk({ tail: 'veil', X: { tc: 'blue' }, X2: {}, body: ['W', 'alb'] }, 'F', A + 20);
  mk({ tail: 'delta', X: { tc: 'red', tux: 1 }, X2: { tc: 'green' } }, 'F', A + 8);
  mk({ tail: 'fan', body: ['W', 'bld'], X: { sb: 1 } }, 'F', A + 3);
  for (const c of tank.creatures) { Pedigree.add(c.id, 0, 0); }
  return tank.creatures;
}

    day:    { root: 60, bpm: 66, p: 0.34, bass: 0.6, chords: [[0, 4, 7, 11, 14], [5, 9, 12, 16, 19], [9, 12, 16, 19, 23], [7, 11, 14, 16, 21]], scale: [0, 2, 4, 7, 9, 12, 14, 16] },

    studio: { root: 60, bpm: 58, p: 0.12, bass: 0.2, chords: [[0, 7, 11, 14], [5, 9, 12, 16], [9, 12, 16, 19]], scale: [0, 2, 4, 7, 9, 12] },
    lab:    { root: 62, bpm: 70, p: 0.3, bass: 0.4, chords: [[0, 4, 7, 11, 14], [2, 6, 9, 12], [9, 12, 16, 19]], scale: [0, 2, 4, 6, 7, 9, 11, 14] },
  };

    feed() { if (!ctx) return; const t = ctx.currentTime; for (let i = 0; i < 5; i++) { const s = ctx.createBufferSource(); s.buffer = N.ambSrc.buffer; const f = ctx.createBiquadFilter(), a = g(0); f.type = 'highpass'; f.frequency.value = 3200; const tt = t + i * 0.045 + Math.random() * 0.02; a.gain.setValueAtTime(0, tt); a.gain.linearRampToValueAtTime(0.35, tt + 0.003); a.gain.exponentialRampToValueAtTime(0.001, tt + 0.05); s.connect(f).connect(a).connect(N.sfx); s.start(tt, Math.random() * 3, 0.06); } blop(t + 0.3, 0.09); },
    eat() { if (!ctx) return; blop(ctx.currentTime, 0.07); },
    coin() { if (!ctx) return; const t = ctx.currentTime; sfxNote(mtof(scaleNote(4, 24)), t, 0.1); sfxNote(mtof(scaleNote(6, 24)), t + 0.09, 0.09); },
    born() { if (!ctx) return; const t = ctx.currentTime; [0, 2, 4].forEach((i, k) => sfxNote(mtof(scaleNote(i + 2, 24)), t + k * 0.14, 0.09)); },
    warn() { if (!ctx) return; const t = ctx.currentTime; sfxNote(mtof(mood().root + 7), t, 0.1); sfxNote(mtof(mood().root + 2), t + 0.22, 0.09); },
    /** Keşif arpejı: nadirlik arttıkça daha zengin. */
    discover(rarity = 0) {
      if (!ctx) return; const t = ctx.currentTime, n = 4 + rarity * 2;
      for (let i = 0; i < n; i++) sfxNote(mtof(scaleNote(i * 1 + 1, 12 + (i > 4 ? 12 : 0)) + (rarity > 2 && i % 2 ? 0 : 0)), t + i * (0.13 - rarity * 0.008), 0.08 + rarity * 0.01);

    sell() { SFX.coin(); },
  };

  /* ---------- genel API ---------- */
  function applyVolumes() {
    if (!ctx) return; const t = ctx.currentTime;

    S, SFX,

    start() {
      if (started) { ctx.resume(); return; }

    /** Yakınlaşınca sesler daha "sualtı" (boğuk) duyulur. */
    setZoom(z) { if (ctx) N.ambF.frequency.setTargetAtTime(lerp(2800, 900, clamp((z - 1) / 1.5, 0, 1)), ctx.currentTime, 0.3); },
    suspend() { if (ctx && S.bgMute) ctx.suspend(); }, resume() { if (ctx) ctx.resume(); },

    },
  };

})();

'use strict';
/* =====================================================================
   07 · KAYIT — 3 yuva, sürüm/göç, yedek, JSON dışa/içe aktarma
   ===================================================================== */
const SAVE_VERSION = 1;
const SLOTS = 3;

const Save = {
  key: (i) => `akv.slot.${i}`,
  metaKey: 'akv.meta',
  meta() { try { return JSON.parse(localStorage.getItem(this.metaKey)) || { slot: 0 }; } catch (e) { return { slot: 0 }; } },
  setSlot(i) { try { localStorage.setItem(this.metaKey, JSON.stringify({ slot: i })); } catch (e) { /* kota / gizli mod */ } },

  newState() {
    return {
      v: SAVE_VERSION, name: 'Misafir', avatar: 0, coins: 500, rep: 0, xp: 0, clockMin: 8 * 60 + 30,
      creatures: [], pedigree: {}, discovered: {}, notifs: [], tasks: {}, claimed: {},
      daily: { last: '', idx: 0 }, stats: { born: 0, sold: 0, fed: 0, playSec: 0, maxSale: 0, tests: 0, taps: 0 },
      settings: {
        theme: 'ocean', font: 1, reduce: false, cb: false, speed: 1, lamp: 'auto', bgMute: true, sessionReminder: false,
        audio: { master: 0.8, music: 0.5, amb: 0.5, sfx: 0.7, style: 'ambient' },
      },
      onboarded: false, nextId: 1, lastSeen: Date.now(), savedAt: 0, createdAt: Date.now(),
    };
  },

  /** Eski kayıtları şimdiki sürüme taşır. Yeni sürüm = yeni `case`. */
  migrate(d) {
    if (!d || typeof d !== 'object') throw new Error('Geçersiz kayıt');
    d.v = d.v || 1;
    while (d.v < SAVE_VERSION) {
      switch (d.v) { /* case 1: …1→2 dönüşümü buraya */ default: break; }
      d.v++;
    }
    // eksik alanları varsayılanla tamamla (ileriye dönük güvenlik)
    const base = this.newState();
    for (const k in base) if (d[k] === undefined) d[k] = base[k];
    d.settings = Object.assign({}, base.settings, d.settings); d.settings.audio = Object.assign({}, base.settings.audio, d.settings.audio);
    d.stats = Object.assign({}, base.stats, d.stats);
    if (!Array.isArray(d.creatures)) throw new Error('Kayıt bozuk: canlılar yok');
    return d;
  },

  write(i, obj) {
    try {
      const k = this.key(i), prev = localStorage.getItem(k);
      obj.savedAt = Date.now();
      localStorage.setItem(k, JSON.stringify(obj));
      if (prev && Date.now() - (this._bakT || 0) > 300000) { // yedek: en fazla 5 dakikada bir tazelenir
        try { JSON.parse(prev); localStorage.setItem(k + '.bak', prev); this._bakT = Date.now(); } catch (e) { /* bozuk önceki kaydı yedeğe yazma */ }
      }
      return true;
    } catch (e) { console.warn('Kayıt yazılamadı', e); return false; }
  },

  /** Yuvayı okur; bozuksa yedekten dener. {data, fromBackup} ya da null. */
  read(i) {
    for (const [suffix, bak] of [['', false], ['.bak', true]]) {
      try { const raw = localStorage.getItem(this.key(i) + suffix); if (!raw) continue; return { data: this.migrate(JSON.parse(raw)), fromBackup: bak }; } catch (e) { console.warn('Kayıt okunamadı', suffix, e); }
    }
    return null;
  },
  clear(i) { try { localStorage.removeItem(this.key(i)); localStorage.removeItem(this.key(i) + '.bak'); } catch (e) { /* yoksay */ } },

  slotInfo(i) {
    const r = this.read(i); if (!r) return null; const d = r.data;
    return { name: d.name, day: dayOf(d.clockMin), fish: d.creatures.length, savedAt: d.savedAt, level: Progress.level(d.xp), backup: r.fromBackup };
  },

  exportString(obj) { return JSON.stringify(obj, null, 1); },
  importString(str) { return this.migrate(JSON.parse(str)); },
};

/* ---------------- İlerleme: XP → seviye (1–100) ---------------- */
const Progress = {
  level: (xp) => clamp(1 + Math.floor(Math.sqrt(Math.max(0, xp) / 25)), 1, 100),
  xpFor: (lvl) => 25 * (lvl - 1) * (lvl - 1),
  title(lvl) { let t = TITLES[0][1]; for (const [l, n] of TITLES) if (lvl >= l) t = n; return t; },
};

'use strict';
/* =====================================================================

/* ---------------- Portre: tek canlıyı küçük sahnede canlı gösterir ---------------- */
class Portrait {
  constructor(cr, canvas, o = {}) {
    this.cr = cr; this.cv = canvas; this.zoom = o.zoom || 1; this.t = 0; this.bub = []; this.run = false; this.big = !!o.big;
    this.p = Object.create(cr); this.p.sprite = null; this.p.sw = new Swimmer(this.p); this.p.stress = 0;
    this.p.sw.heading = 0; this.p.sw.flipTarget = 1; this.p.sw.flip = 1;
    for (let i = 0; i < 14; i++) this.bub.push({ x: R.next(), y: R.next(), r: R.float(1, 3.2), v: R.float(0.04, 0.1) });
    this.resize(); this._f = this._f.bind(this);
  }
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);   // clientWidth: dönüşümlerden (FLIP) etkilenmez
    this.dpr = dpr; this.cw = Math.max(40, this.cv.clientWidth); this.ch = Math.max(40, this.cv.clientHeight);
    this.cv.width = Math.round(this.cw * dpr); this.cv.height = Math.round(this.ch * dpr);
  }
  setZoom(z) { this.zoom = z; }
  start() { if (this.run) return; this.run = true; this.last = performance.now(); requestAnimationFrame(this._f); }
  stop() { this.run = false; }
  _f(now) {
    if (!this.run) return; const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now; this.t += dt; this.draw(dt); requestAnimationFrame(this._f);
  }
  draw(dt) {
    const ctx = this.cv.getContext('2d'), cw = this.cw, ch = this.ch, dpr = this.dpr, p = this.p, sp = FishArt.sprite(p);
    const adultLen = p.bodyLen() / p.growth() / sp.bf;
    const scale = (cw * (this.big ? 0.46 : 0.5) / adultLen) * this.zoom, W = cw / scale, H = ch / scale;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, ch); g.addColorStop(0, '#3fc4cf'); g.addColorStop(0.55, '#14708f'); g.addColorStop(1, '#073a55'); ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
    for (let i = 0; i < 4; i++) { const x = cw * (0.15 + i * 0.25) + Math.sin(this.t * 0.3 + i) * 14; const rg = ctx.createLinearGradient(0, 0, 0, ch); rg.addColorStop(0, 'rgba(220,255,250,.16)'); rg.addColorStop(1, 'rgba(220,255,250,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(x - 14, 0); ctx.lineTo(x + 14, 0); ctx.lineTo(x + 70, ch); ctx.lineTo(x - 40, ch); ctx.fill(); }
    // zemin
    ctx.fillStyle = 'rgba(210,190,140,.5)'; ctx.beginPath(); ctx.moveTo(0, ch); for (let x = 0; x <= cw; x += 12) ctx.lineTo(x, ch * 0.9 + Math.sin(x * 0.03) * 4); ctx.lineTo(cw, ch); ctx.fill();
    for (const b of this.bub) { b.y -= b.v * dt; if (b.y < -0.05) { b.y = 1.05; b.x = R.next(); } ctx.strokeStyle = 'rgba(230,255,255,.5)'; ctx.beginPath(); ctx.arc(b.x * cw + Math.sin(this.t * 2 + b.x * 9) * 4, b.y * ch, b.r, 0, TAU); ctx.stroke(); }
    // balık
    p.now = this.cr.now;
    p.sw.update(dt, { calm: true });
    const len = p.bodyLen() / sp.bf;   // yüzen balık, kuyruğu soldaysa merkez sağa kaydırılır
    p.sw.x = W / 2 + 0.22 * len + noise1(this.t * 0.3) * W * 0.025; p.sw.y = H * 0.47 + noise1(this.t * 0.37 + 9) * H * 0.04;
    const base = [dpr * scale, 0, 0, dpr * scale, 0, 0];
    ctx.setTransform(base[0], base[1], base[2], base[3], base[4], base[5]);
    FishArt.draw(ctx, p, this.t, 1, 1, base);
  }
}

      for (const b of bs) { b.y -= b.v * dt; if (b.y < -0.05) { b.y = 1.05; b.x = Math.random(); } c.strokeStyle = 'rgba(200,255,255,.35)'; c.beginPath(); c.arc(b.x * innerWidth + Math.sin(t / 1000 + b.p) * 12, b.y * innerHeight, b.r, 0, TAU); c.stroke(); }

      h('p', null, 'Torunum, dükkânı sana bırakıyorum. Tozlu raflar, bakımsız tanklar ve birkaç lepistes… Ama bil ki her balığın içinde yüzlerce nesillik bir hikâye saklı.'),

  /* ---------------- Durum yükleme / yeni oyun ---------------- */

  save(force) {

  switchSlot(i) {

  newGame(i) { Save.clear(i); this.slot = i; Save.setSlot(i); this.freshState(); this.applySettings(); this.applyAudio(); UI.refreshTop(); UI.toast('Yeni oyun başladı', 'fish'); this.cur_refresh(); },
  importSave(str) { const d = Save.importString(str); this.S = d; Save.write(this.slot, d); this.loadState(d); this.applySettings(); this.applyAudio(); UI.refreshTop(); this.cur_refresh(); },
  exportSave() {

  notify(type, text) { const S = this.S; S.notifs.push({ t: S.clockMin, type, text, read: false }); if (S.notifs.length > 80) S.notifs.shift(); UI.refreshTop(); },
  task(id, n = 1) { const S = this.S; if (S.claimed[id]) return; const t = this.TASKS.find((x) => x.id === id); if (!t) return; const was = S.tasks[id] || 0; S.tasks[id] = Math.min(t.goal, was + n); if (was < t.goal && S.tasks[id] >= t.goal) UI.toast(`Hedef tamam: ${t.name} — Merkez'den ödülünü topla`, 'gift', 3800); },

  dailyState() { const d = this.S.daily; return { can: d.last !== todayKey(), idx: d.idx % 7, reward: this.DAILY[d.idx % 7] }; },

  cycleLamp() { const o = ['auto', 'on', 'off'], t = this.tank; t.lampMode = o[(o.indexOf(t.lampMode) + 1) % 3]; this.S.settings.lamp = t.lampMode; UI.toast({ auto: 'Işık: otomatik (07:00–21:00)', on: 'Işık: sürekli açık', off: 'Işık: kapalı' }[t.lampMode], t.lampMode === 'off' ? 'moon' : 'sun', 1800); },
