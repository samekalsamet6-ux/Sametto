'use strict';
/* =====================================================================
   07 · KAYIT — 3 yuva, sürüm/göç, yedek, JSON dışa/içe aktarma
   ===================================================================== */
const SAVE_VERSION = 3;
const SLOTS = 3;

const Save = {
  key: (i) => `akv.slot.${i}`,
  metaKey: 'akv.meta',
  meta() { try { return JSON.parse(localStorage.getItem(this.metaKey)) || { slot: 0 }; } catch (e) { return { slot: 0 }; } },
  setSlot(i) { try { localStorage.setItem(this.metaKey, JSON.stringify({ slot: i })); } catch (e) { /* kota / gizli mod */ } },

  newState() {
    return {
      v: SAVE_VERSION, name: 'Misafir', avatar: 0, coins: 500, rep: 0, xp: 0, clockMin: 8 * 60 + 30,
      creatures: [], pedigree: {}, discovered: {}, notifs: [], tasks: {}, claimed: {},
      daily: { last: '', idx: 0 }, stats: { born: 0, sold: 0, fed: 0, playSec: 0, maxSale: 0, tests: 0, taps: 0 },
      settings: {
        theme: 'ocean', font: 1, reduce: false, cb: false, speed: 1, lamp: 'auto', bgMute: true, sessionReminder: false,
        audio: { master: 0.8, music: 0.5, amb: 0.5, sfx: 0.7, style: 'ambient' },
      },
      onboarded: false, litters: [], templates: [], gallery: [], nextId: 1, lastSeen: Date.now(), savedAt: 0, createdAt: Date.now(),
    };
  },

  /** Eski kayıtları şimdiki sürüme taşır. Yeni sürüm = yeni `case`. */
  migrate(d) {
    if (!d || typeof d !== 'object') throw new Error('Geçersiz kayıt');
    d.v = d.v || 1;
    while (d.v < SAVE_VERSION) {
      switch (d.v) {
        case 1: // v1 → v2: soyağacına genom/cinsiyet kaydı, üreme alanları
          d.pedigree = d.pedigree || {};
          for (const c of d.creatures || []) { const r = d.pedigree[c.id] || (d.pedigree[c.id] = { s: c.sire || 0, d: c.dam || 0 }); Object.assign(r, { name: r.name || c.name, sex: c.genome.sex, g: c.genome, seed: c.seed, bornT: c.bornT }); }
          d.litters = d.litters || [];
          break;
        case 2: // v2 → v3: aquascape (eski sabit dekora benzeyen başlangıç şablonu), şablonlar, galeri
          d.scape = d.scape || Scape.fromTemplate('start'); d.templates = d.templates || []; d.gallery = d.gallery || [];
          break;
        default: break;
      }
      d.v++;
    }
    // eksik alanları varsayılanla tamamla (ileriye dönük güvenlik)
    const base = this.newState();
    for (const k in base) if (d[k] === undefined) d[k] = base[k];
    d.settings = Object.assign({}, base.settings, d.settings); d.settings.audio = Object.assign({}, base.settings.audio, d.settings.audio);
    d.stats = Object.assign({}, base.stats, d.stats);
    if (!Array.isArray(d.creatures)) throw new Error('Kayıt bozuk: canlılar yok');
    return d;
  },

  write(i, obj) {
    try {
      const k = this.key(i), prev = localStorage.getItem(k);
      obj.savedAt = Date.now();
      localStorage.setItem(k, JSON.stringify(obj));
      if (prev && Date.now() - (this._bakT || 0) > 300000) { // yedek: en fazla 5 dakikada bir tazelenir
        try { JSON.parse(prev); localStorage.setItem(k + '.bak', prev); this._bakT = Date.now(); } catch (e) { /* bozuk önceki kaydı yedeğe yazma */ }
      }
      return true;
    } catch (e) { console.warn('Kayıt yazılamadı', e); return false; }
  },

  /** Yuvayı okur; bozuksa yedekten dener. {data, fromBackup} ya da null. */
  read(i) {
    for (const [suffix, bak] of [['', false], ['.bak', true]]) {
      try { const raw = localStorage.getItem(this.key(i) + suffix); if (!raw) continue; return { data: this.migrate(JSON.parse(raw)), fromBackup: bak }; } catch (e) { console.warn('Kayıt okunamadı', suffix, e); }
    }
    return null;
  },
  clear(i) { try { localStorage.removeItem(this.key(i)); localStorage.removeItem(this.key(i) + '.bak'); } catch (e) { /* yoksay */ } },

  slotInfo(i) {
    const r = this.read(i); if (!r) return null; const d = r.data;
    return { name: d.name, day: dayOf(d.clockMin), fish: d.creatures.length, savedAt: d.savedAt, level: Progress.level(d.xp), backup: r.fromBackup };
  },

  exportString(obj) { return JSON.stringify(obj, null, 1); },
  importString(str) { return this.migrate(JSON.parse(str)); },
};

/* ---------------- İlerleme: XP → seviye (1–100) ---------------- */
const Progress = {
  level: (xp) => clamp(1 + Math.floor(Math.sqrt(Math.max(0, xp) / 25)), 1, 100),
  xpFor: (lvl) => 25 * (lvl - 1) * (lvl - 1),
  title(lvl) { let t = TITLES[0][1]; for (const [l, n] of TITLES) if (lvl >= l) t = n; return t; },
};

'use strict';
/* =====================================================================

/* ---------------- Portre: tek canlıyı küçük sahnede canlı gösterir ---------------- */
class Portrait {
  constructor(cr, canvas, o = {}) {
    this.cr = cr; this.cv = canvas; this.zoom = o.zoom || 1; this.t = 0; this.bub = []; this.run = false; this.big = !!o.big;
    this.p = Object.create(cr); this.p.sprite = null; this.p.sw = new Swimmer(this.p); this.p.stress = 0;
    this.p.sw.heading = 0; this.p.sw.flipTarget = 1; this.p.sw.flip = 1;
    for (let i = 0; i < 14; i++) this.bub.push({ x: R.next(), y: R.next(), r: R.float(1, 3.2), v: R.float(0.04, 0.1) });
    this.resize(); this._f = this._f.bind(this);
  }
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);   // clientWidth: dönüşümlerden (FLIP) etkilenmez
    this.dpr = dpr; this.cw = Math.max(40, this.cv.clientWidth); this.ch = Math.max(40, this.cv.clientHeight);
    this.cv.width = Math.round(this.cw * dpr); this.cv.height = Math.round(this.ch * dpr);
  }
  setZoom(z) { this.zoom = z; }
  start() { if (this.run) return; this.run = true; this.last = performance.now(); requestAnimationFrame(this._f); }
  stop() { this.run = false; }
  _f(now) {
    if (!this.run) return; const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now; this.t += dt; this.draw(dt); requestAnimationFrame(this._f);
  }
  draw(dt) {
    const ctx = this.cv.getContext('2d'), cw = this.cw, ch = this.ch, dpr = this.dpr, p = this.p, sp = FishArt.sprite(p);
    const adultLen = p.bodyLen() / p.growth() / sp.bf;
    const scale = (cw * (this.big ? 0.46 : 0.5) / adultLen) * this.zoom, W = cw / scale, H = ch / scale;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, ch); g.addColorStop(0, '#3fc4cf'); g.addColorStop(0.55, '#14708f'); g.addColorStop(1, '#073a55'); ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
    for (let i = 0; i < 4; i++) { const x = cw * (0.15 + i * 0.25) + Math.sin(this.t * 0.3 + i) * 14; const rg = ctx.createLinearGradient(0, 0, 0, ch); rg.addColorStop(0, 'rgba(220,255,250,.16)'); rg.addColorStop(1, 'rgba(220,255,250,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(x - 14, 0); ctx.lineTo(x + 14, 0); ctx.lineTo(x + 70, ch); ctx.lineTo(x - 40, ch); ctx.fill(); }
    // zemin
    ctx.fillStyle = 'rgba(210,190,140,.5)'; ctx.beginPath(); ctx.moveTo(0, ch); for (let x = 0; x <= cw; x += 12) ctx.lineTo(x, ch * 0.9 + Math.sin(x * 0.03) * 4); ctx.lineTo(cw, ch); ctx.fill();
    for (const b of this.bub) { b.y -= b.v * dt; if (b.y < -0.05) { b.y = 1.05; b.x = R.next(); } ctx.strokeStyle = 'rgba(230,255,255,.5)'; ctx.beginPath(); ctx.arc(b.x * cw + Math.sin(this.t * 2 + b.x * 9) * 4, b.y * ch, b.r, 0, TAU); ctx.stroke(); }
    // balık
    p.now = this.cr.now;
    p.sw.update(dt, { calm: true });
    const len = p.bodyLen() / sp.bf;   // yüzen balık, kuyruğu soldaysa merkez sağa kaydırılır
    p.sw.x = W / 2 + 0.22 * len + noise1(this.t * 0.3) * W * 0.025; p.sw.y = H * 0.47 + noise1(this.t * 0.37 + 9) * H * 0.04;
    const base = [dpr * scale, 0, 0, dpr * scale, 0, 0];
    ctx.setTransform(base[0], base[1], base[2], base[3], base[4], base[5]);
    FishArt.draw(ctx, p, this.t, 1, 1, base);
  }
}

  worldToScreen(x, y) { return this.vp.toScreen(x, y); }, screenToWorld(x, y) { return this.vp.toWorld(x, y); },
  setZoom(z, sx, sy) { this.vp.setZoom(z, sx, sy); },
  resizeCanvas() { this.vp.resize(); if (this.dvp) this.dvp.resize(); },
  renderMain() { this.vp.render({ reduce: this.S.settings.reduce, showFav: true, low: this.low, dry: !!this.tank.scape.dry }); },
  renderThumb(cv) {

      long: (p) => { const w = this.vp.toWorld(p.x, p.y), c = this.tank.hit(w.x, w.y, 30 / w.S); if (c) showTip(c); },

    });
    document.addEventListener('keydown', (e) => {
      if (/input|textarea/i.test((e.target.tagName || '')) || e.ctrlKey || e.metaKey) return;

      const k = e.key.toLowerCase();
      if (UI.cur === 'aq') { if (k === 'f') this.feed(); else if (k === 'l') { this.cycleLamp(); UI.refreshAq(); } else if (k === 's') { this.cycleSpeed(); UI.refreshAq(); } else if (k === '+' || k === '=') this.setZoom(this.cam.zoom * 1.25, this.cw / 2, this.ch / 2); else if (k === '-') this.setZoom(this.cam.zoom / 1.25, this.cw / 2, this.ch / 2); }

    else this.tank.startleAt(w.x, w.y, 150);   // cama dokunuşu: halka + bazı balıklar ürker
  },
  onScreen(name) { this.tank.frozen = name === 'design'; if (name === 'aq' || name === 'design') requestAnimationFrame(() => { this.resizeCanvas(); name === 'aq' && UI.refreshAq(); }); },

  /* ---------------- Yaşam döngüsü ---------------- */
  watchLifecycle() {},
  onVisibility() {

    else {

  },
};

'use strict';
/* =====================================================================
   09a · GÖRÜNÜM (Viewport) — bir tuvale kamera, yakınlaştırma, sürükleme, iki parmak
   Akvaryum ve Tasarım Stüdyosu aynı sınıfı farklı işleyicilerle kullanır.
   h: { down(p,e)->bool (true: hareketi sen yönet), move(p,e), up(p,e), tap(p), long(p) , wheel? }
   ===================================================================== */
class Viewport {
  constructor(canvas, tank, h = {}) {
    this.cv = canvas; this.tank = tank; this.h = h; this.cam = { cx: 500, cy: 350, zoom: 1 };
    this.cw = 0; this.ch = 0; this.dpr = 1; this.inset = 0; this.parX = 0; this.captured = false;
    new ResizeObserver(() => this.resize()).observe(canvas); this.bind();
  }
  /** inset: alttan kapanan piksel (ör. editör çekmecesi); tank kalan alana sığdırılır. */
  cy0() { return (this.ch - this.inset) / 2; }
  scale() { const t = this.tank; return Math.min(this.cw / t.W, (this.ch - this.inset) / t.H) * this.cam.zoom; }
  clamp() { const c = this.cam, t = this.tank, S = this.scale(), hw = this.cw / (2 * S), hh = this.cy0() / S; c.cx = hw >= t.W / 2 ? t.W / 2 : clamp(c.cx, hw, t.W - hw); c.cy = hh >= t.H / 2 ? t.H / 2 : clamp(c.cy, hh, t.H - hh); }
  toWorld(sx, sy) { const S = this.scale(); return { x: (sx - this.cw / 2) / S + this.cam.cx, y: (sy - this.cy0()) / S + this.cam.cy, S }; }
  toScreen(wx, wy) { const S = this.scale(); return { x: (wx - this.cam.cx) * S + this.cw / 2, y: (wy - this.cam.cy) * S + this.cy0(), S }; }
  resize() {
    const r = this.cv.getBoundingClientRect(); if (r.width < 10 || r.height < 10) return;
    this.dpr = Math.min(2, devicePixelRatio || 1); this.cw = r.width; this.ch = r.height; this.cv.width = Math.round(r.width * this.dpr); this.cv.height = Math.round(r.height * this.dpr);
    const oldW = this.tank.W; this.tank.setAspect(r.width / r.height); if (this.tank.W !== oldW) this.cam.cx *= this.tank.W / oldW;
    this.cam.zoom = Math.max(1, this.cam.zoom); this.clamp();
  }
  setZoom(z, sx, sy) {
    const cam = this.cam, w = this.toWorld(sx, sy); cam.zoom = clamp(z, 1, 3.2);
    const S = this.scale(); cam.cx = w.x - (sx - this.cw / 2) / S; cam.cy = w.y - (sy - this.cy0()) / S; this.clamp();
    this.h.zoomed && this.h.zoomed(cam.zoom);
  }
  render(extra) {
    if (!this.cw) return; this.clamp(); const cam = this.cam;
    this.tank.render(this.cv.getContext('2d'), Object.assign({ cw: this.cw, ch: this.ch, dpr: this.dpr, cx: cam.cx, cy: cam.cy, zoom: cam.zoom, par: this.parX, S: this.scale(), cy0: this.cy0() }, extra));
  }
  bind() {
    const cv = this.cv, ptrs = new Map(); let moved = false, pinch = null, lp = 0, start = null, t0 = 0, owned = false;
    const rel = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    cv.addEventListener('pointerdown', (e) => {
      cv.setPointerCapture(e.pointerId); const p = rel(e); ptrs.set(e.pointerId, p);
      if (ptrs.size === 1) {
        moved = false; owned = !!(this.h.down && this.h.down(p, e)); start = { ...p }; t0 = performance.now(); clearTimeout(lp);
        if (this.h.long) lp = setTimeout(() => { if (!moved && ptrs.size === 1) { moved = true; this.h.long(start); } }, 520);
      } else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: this.cam.zoom }; moved = true; clearTimeout(lp); if (owned && this.h.cancel) this.h.cancel(); owned = false; }
    });
    cv.addEventListener('pointermove', (e) => {
      const p = rel(e), prev = ptrs.get(e.pointerId); this.parX = ((p.x / this.cw) - 0.5) * -14; this.h.hover && this.h.hover(p, e);
      if (!prev) return; ptrs.set(e.pointerId, p);
      if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()]; this.setZoom(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2); return; }
      if (ptrs.size === 1) {
        if (!moved && Math.hypot(p.x - start.x, p.y - start.y) > 8) { moved = true; clearTimeout(lp); if (!owned) cv.classList.add('drag'); }
        if (owned) { this.h.move && this.h.move(p, e); return; }
        if (moved && this.cam.zoom > 1.001) { const S = this.scale(); this.cam.cx -= (p.x - prev.x) / S; this.cam.cy -= (p.y - prev.y) / S; this.clamp(); }
      }
    });
    const up = (e) => {
      const had = ptrs.has(e.pointerId), p = rel(e); ptrs.delete(e.pointerId); clearTimeout(lp); cv.classList.remove('drag'); if (ptrs.size < 2) pinch = null;
      if (had && ptrs.size === 0) { if (owned) { this.h.up && this.h.up(p, e, moved); owned = false; } else if (!moved && performance.now() - t0 < 600) this.h.tap && this.h.tap(start); }
    };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('wheel', (e) => { e.preventDefault(); const p = rel(e); this.setZoom(this.cam.zoom * Math.exp(-e.deltaY * 0.0014), p.x, p.y); }, { passive: false });
  }
}

'use strict';
/* =====================================================================
   10 · KONSOL TESTLERİ — Tests.mendel(), Tests.sexLinked(), Tests.all() …
   ===================================================================== */
const Tests = {
  _log(name, ok, info) { console.log(`${ok ? '✅' : '❌'} ${name}`, info || ''); return ok; },

  /** Aa × Aa → ~3:1 (1000 yavru); mutasyon kapalı. */
  mendel(n = 1000) {
    const rng = new RNG(1234);
    const het = Genetics.make({ body: ['W', 'alb'] }, 'M', rng), hetF = Genetics.make({ body: ['W', 'alb'] }, 'F', rng);
    let wild = 0, alb = 0, wwCount = 0;
    for (let i = 0; i < n; i++) {
      const c = Genetics.breed(het, hetF, rng, { noMut: true });
      const p = Genetics.phenotype(c); if (p.body === 'W') wild++; else alb++;
      if (c.auto.body[0] === 'W' && c.auto.body[1] === 'W') wwCount++;
    }
    const ratio = wild / Math.max(1, alb);
    return this._log('Mendel 3:1 (gövde rengi)', Math.abs(wild / n - 0.75) < 0.05, { wild, albino: alb, oran: ratio.toFixed(2), homozigotBaskin: wwCount });
  },

  /** Y'ye bağlı gen: tüm oğullar taşır, kızlar taşımaz (çaprazlama kapalı). */
  sexLinked(n = 400) {
    const rng = new RNG(99);
    const sire = Genetics.make({ tux: 1, tc: 'red' }, 'M', rng), dam = Genetics.make({}, 'F', rng);
    let sons = 0, sonsTux = 0, dau = 0, dauCarry = 0;
    for (let i = 0; i < n; i++) {
      const c = Genetics.breed(sire, dam, rng, { noMut: true, noCross: true });
      const p = Genetics.phenotype(c);
      if (c.sex === 'M') { sons++; if (p.tux && p.tailColor === 'red') sonsTux++; }
      else { dau++; if (Genetics.carried(c).length) dauCarry++; }
    }
    return this._log('Y\'ye bağlı kalıtım', sons > 0 && sonsTux === sons && dauCarry === 0, { oğul: sons, tuxedoOğul: sonsTux, kız: dau, taşıyıcıKız: dauCarry });
  },

  /** X–Y çaprazlama oranı ≈ %3: Y'deki gen oğullarda X'e / kızlara sızar. */
  crossover(n = 6000) {
    const rng = new RNG(7);
    const sire = Genetics.make({ tux: 1 }, 'M', rng), dam = Genetics.make({}, 'F', rng);
    let leak = 0, dau = 0;
    for (let i = 0; i < n; i++) {
      const c = Genetics.breed(sire, dam, rng, { noMut: true });
      if (c.sex === 'F') { dau++; if (c.sc[1].tux) leak++; }
    }
    const r = leak / dau;
    return this._log('X–Y çaprazlama ≈ %3 (kızlara sızan Tuxedo)', r > 0.01 && r < 0.05, { kız: dau, sızan: leak, oran: (r * 100).toFixed(1) + '%' });
  },

  /** Cinsiyet oranı ≈ 1:1 */
  sexRatio(n = 2000) {
    const rng = new RNG(5); const f = Genetics.make({}, 'M', rng), m = Genetics.make({}, 'F', rng);
    let males = 0; for (let i = 0; i < n; i++) if (Genetics.breed(f, m, rng).sex === 'M') males++;
    return this._log('Cinsiyet oranı 1:1', Math.abs(males / n - 0.5) < 0.05, { erkek: males, dişi: n - males });
  },

  /** Akrabalı yetiştirme: kardeş çiftleşmesi F≈0.25. */
  inbreeding() {
    const saved = Pedigree.rec; Pedigree.rec = {}; Pedigree._memo.clear();
    Pedigree.add(1, 0, 0); Pedigree.add(2, 0, 0); Pedigree.add(3, 1, 2); Pedigree.add(4, 1, 2); Pedigree.add(5, 3, 4);
    const f = Pedigree.F(5);
    Pedigree.rec = saved; Pedigree._memo.clear();
    return this._log('Akrabalık katsayısı (kardeş × kardeş = 0.25)', Math.abs(f - 0.25) < 1e-9, { F: f });
  },

  /** Mutasyon sıklığı ~ gen başına %0.5 */
  mutation(n = 20000) {
    const rng = new RNG(31); const a = Genetics.make({}, 'M', rng), b = Genetics.make({}, 'F', rng);
    let mut = 0; for (let i = 0; i < n; i++) { const c = Genetics.breed(a, b, rng, { noCross: true }); const p = Genetics.phenotype(c); if (p.body !== 'W' || p.metal || p.purple) mut++; }
    return this._log('Mutasyon oranı makul', mut / n < 0.05, { yavru: n, görünenMutasyon: mut });
  },

  breeds() {
    const bad = BREEDS.filter((b) => { const p = Genetics.phenotype(Genetics.make(b.spec, 'M')); return Genetics.breedOf(p).id !== b.id; });
    return this._log('Her ırk kendi örnek genomunu tanır', bad.length === 0, bad.map((b) => b.id));
  },

  /** Gebelik/doğum döngüsü: sperm depolama, batın, akrabalık, tank sınırı. */
  breeding() {
    const rs = R.s; R.s = 4242;
    const fake = { creatures: [], addCreature(c) { this.creatures.push(c); return c; } }, saved = Pedigree.rec; Pedigree.rec = {}; Pedigree._memo.clear();
    const m = new Creature({ id: 9001, genome: Genetics.make({ tc: 'red' }, 'M'), bornT: -100 * 1440 }), f = new Creature({ id: 9002, genome: Genetics.make({}, 'F'), bornT: -100 * 1440 });
    Breeding.reg(m); Breeding.reg(f); fake.creatures.push(m, f); m.now = f.now = 0;
    const r = Breeding.mate(m, f, 0); const gd = (f.preg.due - f.preg.start) / 1440;
    const early = Breeding.tick(1000, fake).length;                                   // erken doğum olmamalı
    const out = Breeding.tick(f.preg.due + 1, fake); const b = out[0];
    const kids = fake.creatures.filter((c) => c.dam === 9002);
    const okSperm = f.sperm.length === 1 && f.sperm[0].left === SPERM_BATCHES - 1 && f.preg && true;   // 2. gebelik otomatik
    const sibs = kids.length >= 2 ? Pedigree.kin(kids[0].id, kids[1].id) : 0.25;
    const okKin = kids.every((k) => k.F === 0) && Math.abs(sibs - 0.25) < 0.3;
    const okSex = kids.every((k) => k.sire === 9001 && (k.sex === 'M' ? k.pheno.tailColor === 'red' : true));
    Pedigree.rec = saved; Pedigree._memo.clear(); R.s = rs;
    return this._log('Üreme döngüsü', r.started && gd >= 21 && gd <= 31 && early === 0 && b && b.kept.length > 0 && okSperm && okKin && okSex, { gebelikGün: gd.toFixed(1), yavru: kids.length, yenen: b && b.lost, spermKalan: f.sperm[0] && f.sperm[0].left });
  },

  /** Kimya: taş/zemin etkisi, aşırı yük, CO₂–pH, HC Cuba davranışı. */
  chemistry() {
    const S = Game.S, bk = { w: S.water, sc: S.scape, noDeath: Chem.noDeath, acc: Chem.acc }, crs = Game.tank.creatures.slice();
    const run = (setup, days, extraFish = 0) => {
      S.water = Chem.fresh(S); const sc = Scape.fromTemplate('start', 1); setup && setup(sc); S.scape = sc; Game.tank.setScape(sc); Chem.noDeath = true; Chem.acc = 0;
      const extra = []; for (let i = 0; i < extraFish; i++) { const c = new Creature({ id: -9000 - i, genome: Genetics.randomFounder('F'), bornT: -90 * 1440 }); c.now = 0; extra.push(c); Game.tank.creatures.push(c); }
      for (let d = 0; d < days; d++) Chem.advance(1440, true); const w = S.water, it = sc.items.find((i) => i.d === 'hccuba'); Game.tank.creatures.length = 0; Game.tank.creatures.push(...crs); return { w, it };
    };
    const base = run(null, 60).w, rocks = run((sc) => { for (let i = 0; i < 3; i++) sc.items.push(Scape.newItem(sc, 'rock', 'seiryu', 0.5 + i * 0.05, { s: 1.3 })); }, 60).w;
    const soil = run((sc) => (sc.sub.type = 'aquasoil'), 60).w, over = run(null, 3, 30).w;
    const co2 = run((sc) => (sc.equip.co2 = 'tank'), 3).w, cub = run((sc) => { sc.items.push(Scape.newItem(sc, 'plant', 'hccuba', 0.5, { g: 1 })); }, 25).it;
    S.water = bk.w; S.scape = bk.sc; Game.tank.setScape(bk.sc); Chem.noDeath = bk.noDeath; Chem.acc = bk.acc; Game.tank.creatures.length = 0; Game.tank.creatures.push(...crs);
    const ok1 = rocks.kh > base.kh + 0.6, ok2 = soil.kh < base.kh - 1 && soil.ph < base.ph, ok3 = over.nh3 > 0.25 || over.no2 > 0.25, ok4 = co2.ph < base.ph - 0.4, ok5 = cub && (cub.vert || 1) > 1.15 && (cub.sp || 1) < 1.2;
    return this._log('Kimya (seiryu KH↑, aquasoil KH/pH↓, aşırı yük NH₃/NO₂↑, CO₂→pH↓, HC Cuba dikine uzar)', ok1 && ok2 && ok3 && ok4 && ok5, { kh: [base.kh, rocks.kh, soil.kh].map((x) => +x.toFixed(2)), ph: [base.ph, soil.ph, co2.ph].map((x) => +x.toFixed(2)), asırı: [+over.nh3.toFixed(2), +over.no2.toFixed(2)], cuba: cub && [+(cub.vert || 1).toFixed(2), +(cub.sp || 1).toFixed(2)] });
  },

  /** Bilgi içeriği tutarlılığı: her tür/bitki/taş için kart verisi tam mı? */
  content() {
    const bad = []; for (const s of SPECIES) { const i = SPECIES_INFO[s.id]; if (!i || !SP_ENV[s.id] || !i.mates || !i.breed || !i.food) bad.push('tür:' + s.id); else { for (const p of i.plants) if (!PLANTS[p]) bad.push('bitki:' + p); for (const m of [...i.mates.ok, ...i.mates.bad]) if (!SPECIES_INFO[m]) bad.push('arkadaş:' + m); if (!TEMPLATES[i.tpl]) bad.push('şablon:' + i.tpl); } }
    for (const [k, p] of Object.entries(PLANTS)) if (!p.info || !p.sci) bad.push('bitki bilgi:' + k);
    const terms = new Set(); const scan = (s) => (String(s).match(/\[\[(.+?)\]\]/g) || []).forEach((m) => terms.add(m.slice(2, -2)));
    Object.values(SPECIES_INFO).forEach((i) => i.genetics.forEach(scan)); LESSONS.forEach((l) => l.pages.forEach((p) => scan(p.join(' ')))); GUIDES.forEach((g) => g.pages.forEach((p) => scan(p.join(' ')))); Object.values(GLOSSARY).forEach(scan);
    for (const t of terms) if (!UI.findTerm(t)) bad.push('sözlük:' + t);
    return this._log('Bilgi içeriği tutarlı (tür, bitki, şablon, [[terim]] bağlantıları)', bad.length === 0, bad);
  },

  all() { const r = [this.mendel(), this.sexLinked(), this.crossover(), this.sexRatio(), this.inbreeding(), this.mutation(), this.breeds(), this.breeding(), this.chemistry(), this.content()]; console.log(r.every(Boolean) ? '🎉 Tüm testler geçti' : '⚠️ Başarısız test var'); return r.every(Boolean); },
};

  rock(c, d, rng) {

const Chem = {
  active: true, noDeath: false, acc: 0, cleaners: 0,

  /* ---------- durum ---------- */
  fresh(S) {

  tap() { return TAP_PROFILES[Game.S.settings.tap || 'mid']; },

  /** Tankta bulunan türlerin ortak ideal/tolerans aralığı. */

  },

  step(dd, quiet) {
    const S = Game.S, w = this.w, t = Game.tank, sc = t.scape, V = Math.max(10, sc.liters), vk = 60 / V, e = sc.equip, now = S.clockMin;
    if (sc.dry) { this.dryStep(dd); return; }
    const lampOn = (t.lampMode === 'on') || (t.lampMode === 'auto' && ((now % 1440) / 60 >= e.light.from && (now % 1440) / 60 < e.light.to));
    const P = e.light.p / 100, flow = t.flowPow, items = sc.items, plants = this.plants();
    // --- hardscape / zemin etkileri ---
    let dKH = 0, dGH = 0, dTan = 0, hardBio = 0;
    for (const it of items) { if (!Scape.isHard(it)) continue; const d = HARDSCAPE[it.d] || {}, f = d.eff; if (!f) continue; const k = (it.s || 1) * (it.k === 'leaf' ? 0.25 : 1); dKH += (f.kh || 0) * k; dGH += (f.gh || 0) * k; dTan += (f.tannin || 0) * k; hardBio += (f.bio || 0) * k; }

    w.kh = clamp(w.kh, 0.5, 20); w.gh = clamp(w.gh, 0.5, 30);
    t.tint = clamp(w.tannin / 6, 0, 1); t.greenWater = clamp(w.algae.gw, 0, 1); t.algae = w.algae;
    // ilaç süresi
    if (w.med) { w.med.days -= dd; if (w.med.days <= 0) { w.med = null; if (!quiet) UI.toast('İlaç etkisi bitti', 'bell'); } }

  /** Kuru başlangıç: su yok, nemli ortamda bitkiler (halılar) kökleşir; yosun/azot yok. */

/* Kuru başlangıç (Dry Start Method) */
Chem.dryStart = function (on) {
  const S = Game.S, sc = Game.tank.scape, t = Game.tank;
  if (on) {
    if (sc.dry) return;
    UI.confirm('Kuru başlangıç başlasın mı?', 'Su boşaltılır; balıklar geçici olarak depoya alınır. Halı bitkileri nemli ortamda kökleşir (yavaş ama yosunsuz). Su doldurunca azot döngüsü baştan başlar.', () => {
      for (const c of t.creatures.slice()) { c.quarantined = true; t.removeCreature(c); (S.qFish = S.qFish || []).push(c); }
      sc.dry = true; sc.dryDays = 0; Game.markScapeChanged(); Editor.refresh(); UI.toast('Kuru başlangıç: bitkiler kökleşiyor', 'leaf', 3500);
    });
  } else {
    UI.confirm('Su doldurulsun mu?', 'Balıklar tanka geri döner. Tank yeni sayılır: amonyak yükselebilir, yavaş ilerle.', () => {
      sc.dry = false; const w = Chem.fresh(S); w.b1 = 0.03; w.b2 = 0.02; w.soilAge = 0; S.water = w;
      for (const it of sc.items) if (it.k === 'plant') { const d = PLANTS[it.d]; if (d.type === 'carpet') it.sp = Math.max(it.sp || 1, 1.3); it.melt = 0; it.hp = 1; }
      for (const c of (S.qFish || []).slice()) if (!c.dis || true) { c.quarantined = false; t.addCreature(c); } S.qFish = [];
      Game.markScapeChanged(); Editor.refresh(); UI.toast('Su dolduruldu! Azot döngüsü başlıyor — ilk günlerde su değişimi yap.', 'water', 5500); Game.notify('info', 'Tank dolduruldu. Yeni tank: amonyak/nitrit izle.');
    });
  }
};

'use strict';
/* =====================================================================
   15b · ANSİKLOPEDİ & BİLGİ MERKEZİ
   Tür Kartı (canlı portre + 7 sekme), Bitki Kartı, Taş/Zemin Kartı,
   Balıkdex/Bitkidex/Taşdex, Genetik Okulu, rehberler, sözlük, SSS
   ===================================================================== */
Object.assign(UI, {
  /* ---------- sözlük bağlantılı metin: [[terim]] ---------- */
  rich(str) {
    const el = h('span'); const re = /\[\[(.+?)\]\]/g; let last = 0, m;
    while ((m = re.exec(str))) { if (m.index > last) el.append(str.slice(last, m.index)); const term = m[1]; el.append(h('button.term', { onclick: (e) => { e.stopPropagation(); UI.openTerm(term); } }, term)); last = m.index + m[0].length; }
    if (last < str.length) el.append(str.slice(last)); return el;
  },
  findTerm(t) { const k = Object.keys(GLOSSARY).find((x) => x.toLowerCase() === t.toLowerCase()); return k || null; },
  openTerm(t) { const k = this.findTerm(t); const rec = UI.sheet(h('div.stack', null, UI.sheetHead(k || t, { close: () => rec.close() }), h('p', null, k ? UI.rich(GLOSSARY[k].replace(/\b(GH|KH|TDS)\b/g, '$1')) : 'Bu terim sözlükte yok.'))); },

  /* ---------- yardımcılar ---------- */
  stars(n) { return '⭐'.repeat(n) + '☆'.repeat(5 - n); },
  paramBar(ideal, tol, ax, val) {
    const [lo, hi] = ax, pc = (x) => clamp((x - lo) / (hi - lo), 0, 1) * 100, tl = pc(tol[0]), th = pc(tol[1]), il = pc(ideal[0]), ih = pc(ideal[1]);
    return h('div.rbar', null, h('i.tol', { style: { left: tl + '%', width: Math.max(0, th - tl) + '%' } }), h('i.ide', { style: { left: il + '%', width: Math.max(0, ih - il) + '%' } }), val != null ? h('b.mk', { style: { left: pc(val) + '%' } }) : null);
  },
  speciesCreature(sp, variant, sex, ageDays) {
    const key = [sp, variant, sex, ageDays].join('|'); this._spc = this._spc || new Map(); let c = this._spc.get(key);
    if (!c) { const b = sp === 'guppy' ? BREEDS[variant % BREEDS.length] : null; if (!b) return null; c = new Creature({ id: -3000000 - this._spc.size, genome: Genetics.make(b.spec, sex, new RNG(9)), bornT: -ageDays * 1440, seed: 777 + variant }); c.now = 0; this._spc.set(key, c); }
    return c;
  },
  tabs(names, cur, fn) { return h('div.chips', null, names.map(([k, l]) => h('button.sp-chip' + (cur === k ? '.on' : ''), { onclick: () => fn(k) }, l))); },

  /* ---------- Ansiklopedi ana ekranı ---------- */
  dexTab: 'fish',
  render_dex(el) {
    const S = Game.S, seen = S.seen || {};
    const fishFound = BREEDS.filter((b) => S.discovered[b.id]).length, plantFound = Object.keys(PLANTS).filter((k) => (seen.plant || {})[k]).length;

    let i = 0, answered = false; const box = h('div.stack'), rec = UI.sheet(h('div', null, UI.sheetHead(l.title, { close: () => rec.close() }), box));
    const finish = () => { const S = Game.S; S.lessons = S.lessons || {}; const first = !S.lessons[l.id]; S.lessons[l.id] = 1; if (first) { Game.addCoins(l.reward.coins); Game.addXp(l.reward.xp); AudioSys.SFX.discover(2); UI.toast(`Ders tamam! +${l.reward.coins} 💰 +${l.reward.xp} XP`, 'star', 4000); Game.task('lesson'); } rec.close(); if (UI.cur === 'help') UI.render_help($('#s-help')); };
    const draw = () => {
      const p = l.pages[i]; answered = false; const nav = (ok) => h('div.row', null, h('button.btn.sp', { disabled: i === 0 ? true : null, onclick: () => { i--; draw(); } }, 'Geri'), h('button.btn.primary.sp', { id: 'lnext', disabled: ok ? null : true, onclick: () => { if (i < l.pages.length - 1) { i++; draw(); } else finish(); } }, i < l.pages.length - 1 ? 'İleri' : 'Tamamla'));
      const head = h('div.small.muted', null, `Adım ${i + 1} / ${l.pages.length}`);
      if (p[0] === 't') box.replaceChildren(head, h('h3', null, p[1]), h('p', { style: { fontSize: '16px' } }, UI.rich(p[2])), nav(true));
      else if (p[0] === 'p') {
        const A = p[2].slice(), B = p[3].slice(), alleles = [...new Set([...p[2], ...p[3]])], name = (a) => (a === 'W' ? 'Yabani' : a === 'a' ? 'albino' : a);
        const grid = h('div'), sum = h('div.small'), mk = (arr, idx) => h('button.sp-chip.on', { onclick: () => { arr[idx] = alleles[(alleles.indexOf(arr[idx]) + 1) % alleles.length]; upd(); } }, name(arr[idx]));
        const upd = () => { const cells = [[A[0], B[0]], [A[0], B[1]], [A[1], B[0]], [A[1], B[1]]], ph = (c) => (c.includes('W') ? 'Yabani' : 'Albino'), nW = cells.filter((c) => c.includes('W')).length;
          grid.replaceChildren(h('div.row.wrap-r', null, h('span.small', null, 'Baba:'), mk(A, 0), mk(A, 1), h('span.small', { style: { marginLeft: '12px' } }, 'Anne:'), mk(B, 0), mk(B, 1)), h('div.pgrid', { style: { margin: '10px 0' } }, h('span'), h('b', null, name(B[0])), h('b', null, name(B[1])), h('b', null, name(A[0])), h('span.pc', { style: { color: ph(cells[0]) === 'Albino' ? '#ffd36b' : '' } }, name(cells[0][0]) + '·' + name(cells[0][1])), h('span.pc', { style: { color: ph(cells[1]) === 'Albino' ? '#ffd36b' : '' } }, name(cells[1][0]) + '·' + name(cells[1][1])), h('b', null, name(A[1])), h('span.pc', { style: { color: ph(cells[2]) === 'Albino' ? '#ffd36b' : '' } }, name(cells[2][0]) + '·' + name(cells[2][1])), h('span.pc', { style: { color: ph(cells[3]) === 'Albino' ? '#ffd36b' : '' } }, name(cells[3][0]) + '·' + name(cells[3][1]))));
          sum.textContent = `Yabani görünümlü: %${nW * 25} · Albino: %${(4 - nW) * 25}`; };
        upd(); box.replaceChildren(head, h('h3', null, p[1]), h('div.small.muted', null, 'Alel düğmelerine dokunarak ebeveyn genotiplerini değiştir.'), grid, sum, h('div.small.muted', null, UI.rich(p[4])), nav(true));
      } else {
        const opts = h('div.stack'), fb = h('div.small', { style: { minHeight: '40px' } });
        p[2].forEach((o, k) => opts.append(h('button.btn', { style: { justifyContent: 'flex-start' }, onclick: (e) => { if (answered) return; if (k === p[3]) { answered = true; e.currentTarget.style.background = 'var(--ok)'; e.currentTarget.style.color = '#03281a'; fb.textContent = '✅ ' + p[4]; $('#lnext').disabled = false; AudioSys.SFX.coin(); } else { e.currentTarget.style.background = 'rgba(255,107,107,.35)'; fb.textContent = '❌ Tekrar dene.'; } } }, o)));
        box.replaceChildren(head, h('h3', null, 'Soru'), h('p', { style: { fontSize: '16px' } }, p[1]), opts, fb, nav(false));
      }
    }; draw();
  },
});
