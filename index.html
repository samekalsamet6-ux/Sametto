<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akvaryum Ustası</title>
<style>
:root{--bg:#07131f;--panel:#0e2236;--panel2:#143250;--line:#24527a;--txt:#e6f4ff;--mut:#8fb3d1;--acc:#3ddcc0;--warn:#ffb347;--bad:#ff6b6b;--good:#6bff9c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#0f2f4d,#050d16);color:var(--txt);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh;user-select:none}
button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){background:#1d4a73;border-color:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:linear-gradient(#2fc9ae,#17917f);border-color:#5ff0d6;color:#032;font-weight:700}
button.dan{background:#6a2430;border-color:#b24b5c}
button.on{background:#1d6f63;border-color:var(--acc)}
#app{max-width:1500px;margin:0 auto;padding:8px;display:grid;gap:8px;grid-template-columns:1fr 330px;grid-template-areas:"top top" "tabs tabs" "tank side" "bar side"}
#top{grid-area:top;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
#top .stat{background:#0a1a2a;border:1px solid var(--line);border-radius:8px;padding:4px 10px;white-space:nowrap}
#top .grow{flex:1}
#xpbar{width:110px;height:8px;background:#0a1a2a;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
#xpbar i{display:block;height:100%;background:var(--acc)}
#tabs{grid-area:tabs;display:flex;gap:6px;flex-wrap:wrap}
#tankwrap{grid-area:tank;position:relative;border:3px solid #2b4d6b;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 40px #0006,inset 0 0 30px #0008}
canvas#c{display:block;width:100%;aspect-ratio:1000/600;cursor:pointer}
#bar{grid-area:bar;display:flex;flex-wrap:wrap;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
#bar .sep{width:1px;background:var(--line);margin:0 4px}
#side{grid-area:side;display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.card h3{margin:0 0 6px;font-size:13px;color:var(--acc);letter-spacing:.5px;text-transform:uppercase}
.gauge{display:grid;grid-template-columns:62px 1fr 48px;align-items:center;gap:6px;margin:3px 0;font-size:12px}
.gauge .bar{height:9px;background:#07131f;border-radius:5px;overflow:hidden;position:relative}
.gauge .bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
#flist{max-height:330px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.frow{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:7px;background:#0a1a2a;cursor:pointer;border:1px solid transparent;font-size:12px}
.frow:hover,.frow.sel{border-color:var(--acc);background:#10304a}
.frow canvas{width:42px;height:26px;flex:none}
.frow .n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip{font-size:11px;padding:1px 6px;border-radius:10px;background:#1a3a58;color:var(--mut);white-space:nowrap}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.filters button{padding:2px 7px;font-size:12px}
#toasts{position:fixed;right:12px;top:70px;display:flex;flex-direction:column;gap:6px;z-index:50;pointer-events:none;max-width:340px}
.toast{background:#0e2236ee;border:1px solid var(--acc);border-left:5px solid var(--acc);padding:8px 12px;border-radius:8px;animation:in .3s;box-shadow:0 4px 18px #0008}
.toast.bad{border-color:var(--bad)}.toast.gold{border-color:gold;background:#3a2f0aee}
@keyframes in{from{transform:translateX(40px);opacity:0}}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:40;padding:10px}
#modal.show{display:flex}
#mbox{background:var(--panel);border:1px solid var(--acc);border-radius:14px;max-width:960px;width:100%;max-height:92vh;overflow:auto;padding:16px;user-select:text}
#mbox h2{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.item{background:#0a1a2a;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px}
.item b{color:var(--acc)}
.item small{color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid #1d3d5c;padding:4px 6px;text-align:left}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;background:#1a3a58;margin:1px;font-size:12px}
.tag.rare{background:#5a3b00;color:gold}
.pbar{display:flex;height:16px;border-radius:5px;overflow:hidden;margin:2px 0;background:#07131f}
.pbar i{display:block;font-style:normal;font-size:10px;overflow:hidden;white-space:nowrap;padding-left:3px;color:#021}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1000px){#app{grid-template-columns:1fr;grid-template-areas:"top" "tabs" "tank" "bar" "side"}.two{grid-template-columns:1fr}}
.dim{color:var(--mut)}
select,input{background:#0a1a2a;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px}
</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <div id="tabs"></div>
  <div id="tankwrap"><canvas id="c"></canvas></div>
  <div id="bar"></div>
  <div id="side">
    <div class="card" id="water"></div>
    <div class="card"><h3>Balıklar</h3><div class="filters" id="filters"></div><div id="flist"></div></div>
    <div class="card" id="log"><h3>Günlük</h3><div id="logbody" style="max-height:110px;overflow:auto;font-size:12px" class="dim"></div></div>
  </div>
</div>
<div id="toasts"></div>
<div id="modal"><div id="mbox"></div></div>

<script>
'use strict';
/* =====================================================================
   AKVARYUM USTASI — canlı doğuran balık (Poeciliidae) yetiştirme oyunu
   Bölümler: 1 Yardımcılar · 2 Tür/Gen verileri · 3 Genetik · 4 Dünya
             5 Su/Hastalık/Ekonomi · 6 Çizim · 7 Arayüz · 8 Ana döngü
   ===================================================================== */

/* ---------- 1. Yardımcılar ---------- */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hsl=(c,l=0,s=0,a=1)=>`hsla(${c[0]},${clamp(c[1]+s,0,100)}%,${clamp(c[2]+l,0,100)}%,${a})`;
const fmt=n=>Math.round(n).toLocaleString('tr-TR');
let UID=1;const uid=()=>UID++;

/* ---------- 2. Tür ve gen verileri ---------- */
// allel satırı: [id, ad, baskınlık(d), değer(v), renk/ekstra, nadir?]
function mk(rows){return rows.map(r=>({id:r[0],name:r[1],d:r[2],v:r[3],x:r[4],rare:!!r[5]}))}
const TAILS={ // len, h, fork, pt(sivrilik), sw(kılıç), flow
  round:{len:.55,h:.7,fork:0,pt:0,sw:0,flow:0},spade:{len:.7,h:.55,fork:0,pt:.55,sw:0,flow:0},

  veil:{len:1.5,h:1.7,fork:.1,pt:0,sw:0,flow:.9},dsword:{len:.9,h:.8,fork:.35,pt:.3,sw:1.1,flow:.1},
  comet:{len:1.0,h:.6,fork:0,pt:.6,sw:0,flow:.2},sword:{len:.7,h:.65,fork:0,pt:.2,sw:1.0,flow:0}};
const FINS=mk([ // kuyruk/yüzgeç rengi
 ['clear','Saydam',5,1,null],['match','Uyumlu',4,1,'m'],['red','Kırmızı',3,2,[355,85,52]],['blue','Mavi',3,2,[212,85,55]],
 ['yellow','Sarı',3,2,[50,92,58]],['orange','Turuncu',3,2,[26,95,55]],['black','Siyah Kenarlı',2,3,[240,10,12]],['purple','Mor',2,3,[282,60,48]],
 ['neon','Neon Turkuaz',1,7,[172,100,52],1]]);
const SHINE=mk([['mat','Mat',5,1],['metal','Metalik',3,2],['gold','Altın Parıltı',2,3],['glow','Floresan (karanlıkta parlar)',1,7,0,1]]);
const SIZE=[{id:'s',name:'Küçük',v:.86,d:0,x:0},{id:'m',name:'Normal',v:1,d:0,x:1},{id:'l',name:'Büyük',v:1.14,d:0,x:2},{id:'x',name:'Dev',v:1.3,d:0,x:3,rare:true}].map(s=>({id:s.id,name:s.name,d:0,v:s.x===3?4:s.x===2?2:1,x:s.v,rare:!!s.rare}));
const SPECIES={
 guppy:{name:'Lepistes',latin:'Poecilia reticulata',icon:'🐟',price:18,body:{len:34,hr:.27},mscale:.78,fscale:1.12,
  gest:5,litter:[5,18],mature:6,life:[80,105],temp:[23,28],shopCost:0,
  color:mk([['wild','Gri',5,1,[30,8,52]],['blue','Mavi',3,2,[215,80,50]],['red','Kırmızı',3,2,[356,80,50]],['green','Yeşil',3,2,[140,60,42]],
   ['orange','Turuncu',3,2,[24,92,54]],['yellow','Sarı (Blond)',2,2,[48,90,57]],['purple','Mor',2,3,[280,55,45]],['white','Beyaz',1,3,[200,12,92]],
   ['black','Siyah',2,4,[240,10,14]],['albino','Albino',0,4,[48,55,90]],['galaxy','Galaksi',3,8,[262,85,34],1],['flamingo','Flamingo Pembe',3,7,[330,70,66],1]]),
  pattern:mk([['none','Düz',5,1],['spots','Benekli',4,2],['stripes','Çizgili',3,2],['mosaic','Mozaik',2,3],['snake','Yılan Derisi',2,4],['leopard','Leopar',1,4],['cobra','Kobra',3,7,0,1],['glitter','Yıldız Tozu',3,8,0,1]]),
  tail:mk([['spade','Kürek',5,1,'spade'],['round','Yuvarlak',4,1,'round'],['fan','Yelpaze',3,2,'fan'],['delta','Delta',2,3,'delta'],['lyre','Lir',2,4,'lyre'],['needle','İğne',2,3,'needle'],['veil','Peçe',1,5,'veil'],['dsword','Çift Kılıç',3,7,'dsword',1]]),
  fin:FINS,
  dorsal:mk([['short','Kısa',5,1,.6],['long','Uzun',3,2,1.1],['sail','Yelken',1,4,1.8]]),
  shine:SHINE,size:SIZE},
 molly:{name:'Moli',latin:'Poecilia sphenops / latipinna',icon:'🐠',price:35,body:{len:46,hr:.31},mscale:.85,fscale:1.12,
  gest:8,litter:[10,28],mature:9,life:[110,150],temp:[24,29],shopCost:350,
  color:mk([['black','Siyah',4,1,[250,10,12]],['silver','Gümüş',3,1,[200,10,70]],['gold','Altın',2,2,[45,85,56]],['white','Beyaz',1,3,[200,10,94]],
   ['sun','Gün Batımı',2,3,[22,95,56]],['choco','Çikolata',3,3,[25,50,30]],['lime','Limon Sarısı',2,3,[62,85,58]],['platin','Platin Mavi',2,7,[205,55,64],1],['rose','Gül Kurusu',2,7,[345,55,62],1]]),
  pattern:mk([['none','Düz',5,1],['dalm','Dalmaçyalı',4,3],['marble','Mermer',2,3],['tiger','Kaplan',3,4],['panda','Panda',1,5],['calico','Kaliko',2,4],['kaleido','Kaleydoskop',3,8,0,1]]),
  tail:mk([['round','Yuvarlak',5,1,'round'],['fan','Yelpaze',3,2,'fan'],['lyre','Lir Kuyruk',2,4,'lyre'],['veil','Peçe',1,5,'veil'],['dsword','Elmas Kılıç',3,7,'dsword',1]]),
  fin:FINS,
  dorsal:mk([['normal','Normal',5,1,.9],['high','Yüksek',2,3,1.4],['sail','Yelken (Sailfin)',1,5,2.1]]),
  shine:SHINE,size:SIZE},
 platy:{name:'Plati',latin:'Xiphophorus maculatus',icon:'🐡',price:26,body:{len:38,hr:.34},mscale:.85,fscale:1.1,
  gest:6,litter:[6,20],mature:7,life:[90,125],temp:[22,26],shopCost:220,
  color:mk([['red','Kırmızı',4,1,[4,85,50]],['orange','Turuncu',3,2,[26,92,55]],['yellow','Güneş Sarısı',2,2,[50,90,58]],['blue','Mavi',2,3,[208,75,52]],
   ['green','Yeşil',2,3,[150,55,42]],['black','Siyah',2,3,[240,10,14]],['white','Beyaz',1,3,[200,10,94]],['neonred','Neon Kızıl',3,7,[348,100,55],1]]),
  pattern:mk([['none','Düz',5,1],['tux','Smokin',3,3],['mickey','Mickey Mouse',3,3],['calico','Kaliko',2,4],['wag','Yelpaze Lekeli',2,3],['panda','Panda',1,5],['harlequin','Harlequin',3,8,0,1]]),
  tail:mk([['round','Yuvarlak',5,1,'round'],['fan','Yelpaze',3,2,'fan'],['comet','Kuyruklu Yıldız',2,3,'comet'],['lyre','Lir',2,4,'lyre'],['sword','Kılıç Kuyruk',2,6,'sword',1]]),
  fin:FINS,
  dorsal:mk([['short','Kısa',5,1,.7],['long','Uzun',3,2,1.15],['sail','Yelken',1,4,1.7]]),
  shine:SHINE,size:SIZE}
};
const GENES=['color','pattern','tail','fin','dorsal','shine','size'];
const GNAME={color:'Gövde Rengi',pattern:'Desen',tail:'Kuyruk',fin:'Kuyruk Rengi',dorsal:'Sırt Yüzgeci',shine:'Parlaklık',size:'Boy'};
const allele=(sp,g,id)=>SPECIES[sp][g].find(a=>a.id===id);
const NAMES_F=['Pırıl','Elmas','Deniz','Gümüş','Lale','Zeytin','Nehir','Boncuk','Yıldız','Mercan','Sedef','Şeker','Fındık','Misket','Ceylin','Damla','Papatya','Mavi','Bulut','Defne'];
const NAMES_M=['Korsan','Poyraz','Tufan','Kaptan','Oltan','Fırtına','Çınar','Atlas','Zeybek','Pamuk','Şimşek','Toprak','Gölge','Barış','Efe','Sülo','Ateş','Yavuz','Rüzgar','Duman'];

const FOODS={
 flake:{name:'Pul Yem',icon:'🍂',price:2,pack:20,hunger:35,waste:1,col:'#e8b04a',desc:'Temel yem.'},
 live:{name:'Canlı Yem (Artemia)',icon:'🦐',price:8,pack:10,hunger:38,waste:.5,col:'#ff8a65',desc:'Doğurganlık ve renk artırır.',boost:1},
 algae:{name:'Yosun Tableti',icon:'🥬',price:4,pack:12,hunger:30,waste:.8,col:'#5fbf6a',desc:'Alg yer, moliler bayılır; suyu temizler.',algae:1},
 fry:{name:'Yavru Tozu',icon:'✨',price:3,pack:20,hunger:35,waste:.4,col:'#f3e9a4',desc:'Yavruları hızla büyütür.',fry:1}};
const EQUIP={
 filter1:{name:'Sünger Filtre',icon:'🧽',price:60,desc:'Temel biyolojik filtre.',lvl:1,type:'filter'},
 filter2:{name:'Dış Kutu Filtre',icon:'🛢️',price:220,desc:'Güçlü filtre (amonyağı hızla dönüştürür).',lvl:2,type:'filter'},
 filter3:{name:'Pro Filtre + UV',icon:'⚙️',price:600,desc:'Profesyonel filtrasyon, berrak su.',lvl:3,type:'filter'},
 heater:{name:'Isıtıcı',icon:'🔥',price:80,desc:'Sıcaklık hedefini ayarlayabilirsin.',type:'heater'},
 air:{name:'Hava Taşı',icon:'🫧',price:40,desc:'Oksijen + baloncuk.',type:'air'},
 led:{name:'LED Aydınlatma',icon:'💡',price:90,desc:'Bitkiler büyür, renkler canlı görünür.',type:'led'},
 nursery:{name:'Doğum/Yavru Kutusu',icon:'📦',price:120,desc:'Balıkları ayrı kutuya al; yavrular yenmez.',type:'nursery'}};
const PLANTS={moss:{name:'Java Moss',price:15,col:[110,50,32]},val:{name:'Vallisneria',price:20,col:[130,60,38]},sword:{name:'Amazon Kılıcı',price:30,col:[100,55,36]},cabomba:{name:'Kabomba',price:25,col:[95,60,42]},ludwig:{name:'Kırmızı Ludwigia',price:35,col:[8,60,42]}};
const DECOR={rock:{name:'Dağ Taşı',price:25},wood:{name:'Kök/Kütük',price:35},cave:{name:'Mağara',price:45},castle:{name:'Kale',price:70},chest:{name:'Hazine Sandığı',price:60},shell:{name:'Deniz Kabuğu',price:20}};
const BACKS={blue:{name:'Okyanus Mavisi',price:0,c:['#1c6fa8','#0a3558','#06182c']},green:{name:'Orman Yeşili',price:150,c:['#2a8a6a','#0f4a3c','#06241e']},purple:{name:'Gün Batımı',price:250,c:['#6a4aa8','#32225e','#140c2e']},teal:{name:'Mercan Resifi',price:350,c:['#1fb0b8','#0b5560','#042a30']}};
const MEDS={med:{name:'İlaç (Hastalık Tedavisi)',price:40}};
const TANKS=[{cap:10,price:0,name:'30 Litre'},{cap:16,price:250,name:'60 Litre'},{cap:24,price:700,name:'120 Litre'},{cap:36,price:1800,name:'250 Litre'}];

/* ---------- 3. Genetik ---------- */
const MUT_BASE=.03;
function phenotype(f){
  const S=SPECIES[f.sp],p={};
  for(const g of GENES){
    const [a,b]=f.g[g].map(id=>allele(f.sp,g,id));
    if(g==='size'){p.size=(a.x+b.x)/2;p.sizeName=(a.x+b.x)/2<.93?'Küçük':(a.x+b.x)/2>1.2?'Dev':(a.x+b.x)/2>1.07?'Büyük':'Normal';p.sizeV=(a.v+b.v)/2;continue}
    p[g]=(a.d>=b.d?a:b);
  }
  return p;
}
function traitKey(f){const p=phenotype(f);return f.sp+'|'+['color','pattern','tail','fin','dorsal','shine'].map(g=>p[g].id).join('|')}
function gamete(f,g,mutMul){
  let id=pick(f.g[g]);
  if(chance(MUT_BASE*(mutMul||1)*(f.vigor===-1?1.3:1))){
    const pool=SPECIES[f.sp][g];
    const w=pool.map(a=>a.rare?1.6:1);let t=rnd(w.reduce((x,y)=>x+y,0)),i=0;
    while(t>w[i]){t-=w[i];i++}
    const n=pool[i].id;if(n!==id){id=n;f._mut=(f._mut||[]).concat([[g,n]])}
  }
  return id;
}
function breed(mom,dad,mutMul){
  const child={sp:mom.sp,g:{}};
  const mutH=[];
  for(const g of GENES){
    const m=gamete(mom,g,mutMul),d=gamete(dad,g,mutMul);
    child.g[g]=[m,d];
  }
  for(const g of GENES){ // mutasyon bildirimi
    for(const x of ['0','1']){}
  }
  child.mutated=[...(mom._mut||[]),...(dad._mut||[])];mom._mut=[];dad._mut=[];
  return child;
}
function related(a,b){ // akraba üremesi: ortak ebeveyn/büyük ebeveyn
  if(!a||!b)return false;
  const la=new Set([a.id,...(a.lin||[])]),lb=new Set([b.id,...(b.lin||[])]);
  for(const x of la)if(lb.has(x))return true;return false;
}
function fishValue(f){
  const S=SPECIES[f.sp],p=phenotype(f);
  let v=S.price;
  for(const g of ['color','pattern','tail','fin','dorsal','shine'])v*=1+(p[g].v-1)*.32;
  v*=p.size;v*=.5+f.health/200;
  if(f.stage==='fry')v*=.2;else if(f.stage==='juv')v*=.6;else if(f.stage==='old')v*=.7;
  if(f.inbred)v*=.8;
  return Math.max(2,Math.round(v));
}
function rarityScore(f){const p=phenotype(f);return GENES.slice(0,6).reduce((s,g)=>s+p[g].v,0)+p.sizeV}
function newFish(sp,over={}){
  const f={id:uid(),sp,sex:chance(.5)?'F':'M',g:{},age:0,hunger:30,health:100,stress:0,x:rnd(100,900),y:rnd(120,450),vx:0,vy:0,
    dir:1,ph:rnd(6.28),tx:0,ty:0,tt:0,seed:rint(1,1e9),preg:null,sperm:null,cool:0,sick:null,lin:[],gen:1,iso:false,fav:false,vigor:0,dead:false,mood:0,eaten:0,fresh:.5};
  Object.assign(f,over);
  f.name=f.name||pick(f.sex==='F'?NAMES_F:NAMES_M);
  f.life=rint(...SPECIES[sp].life)*(f.inbred?.85:1);
  return f;
}
function wildGenome(sp,rarePlus){ // mağaza kalitesi: baskın alleller ağırlıklı, taşıyıcılar var
  const g={};
  for(const k of GENES){
    const pool=SPECIES[sp][k].filter(a=>!a.rare||rarePlus);
    const w=pool.map(a=>(a.d>=4?4:a.d>=2?1.8:1)*(a.rare?.6:1)/(1+Math.max(0,a.v-3)*.5));
    const roll=()=>{let t=rnd(w.reduce((x,y)=>x+y,0)),i=0;while(t>w[i]){t-=w[i];i++}return pool[i].id};
    g[k]=[roll(),roll()];
  }
  return g;
}
function stageOf(f){const m=SPECIES[f.sp].mature;return f.age<m*.45?'fry':f.age<m?'juv':f.age>f.life*.8?'old':'adult'}
const STAGE={fry:'Yavru',juv:'Genç',adult:'Yetişkin',old:'Yaşlı'};

/* ---------- 4. Dünya / Durum ---------- */
const W=1000,H=600,SURF=34,FLOOR=520;
const DAY=42;           // gerçek saniye = 1 oyun günü (hız 1x)
let G=null;             // oyun durumu
function newTank(i){return{name:'Akvaryum '+(i+1),lvl:0,fish:[],plants:[],decor:[],food:[],bubbles:[],parts:[],eq:{filter:0,heater:false,air:false,led:false,nursery:false},

function discover(f){

function log(msg,kind){

function toast(msg,kind=''){const d=document.createElement('div');d.className='toast '+kind;d.innerHTML=msg;const tb=$('#toasts');tb.appendChild(d);while(tb.children.length>5)tb.firstChild.remove();setTimeout(()=>d.remove(),4800);log(msg.replace(/<[^>]+>/g,''))}
function addXP(n){G.xp+=n;const need=G.lvl*120;if(G.xp>=need){G.xp-=need;G.lvl++;toast(`⭐ İtibar seviyesi <b>${G.lvl}</b>! Yeni siparişler açıldı.`,'gold');sfx('win')}}

/* ---------- 5. Simülasyon: su, balık, üreme, ekonomi ---------- */
function tankCap(t){return TANKS[t.lvl].cap}
function bioload(t){return t.fish.reduce((s,f)=>s+(f.stage==='fry'?.2:f.stage==='juv'?.55:1)*phenotype(f).size*(f.dead?1.6:1),0)}
function stepWater(t,dt){
  const w=t.w,load=bioload(t),cap=tankCap(t),hrDay=G.time>=7&&G.time<21,lightOn=t.light&&(t.eq.led||hrDay);
  const plantMass=t.plants.reduce((s,p)=>s+p.size*p.h,0);
  w.nh3+=load*.0055*dt/ (1+t.lvl*.5);
  const flt=t.eq.filter*.04+(t.eq.filter?.01:0);
  const conv=Math.min(w.nh3,flt*dt*(1+ (w.o2>5?0:-.4)));
  w.nh3-=conv;w.no3+=conv*1.1;
  w.nh3-=Math.min(w.nh3,plantMass*.0009*dt*(lightOn?1:.3));
  w.no3-=Math.min(w.no3,plantMass*.0022*dt*(lightOn?1:.2));
  // yosun
  const algG=(lightOn?1:.2)*(w.no3/30)*.05*(t.eq.led?1.4:1);
  w.alg=clamp(w.alg+algG*dt-(t.fish.filter(f=>!f.dead&&f.eatsAlgae).length*.01)*dt,0,100);
  // sıcaklık
  const room=21+Math.sin((G.time-14)/24*6.283)*1.2;
  const tgt=t.eq.heater?t.target:room;
  w.temp+=(tgt-w.temp)*.12*dt/ (1+t.lvl*.3);
  // oksijen
  const o2t=8.6-(w.temp-22)*.18-load*.18/(1+t.lvl*.35)+t.eq.filter*.6+(t.eq.air?1.8:0)+plantMass*(lightOn?.28:-.05)-w.alg*.01;
  w.o2+=(clamp(o2t,1,10)-w.o2)*.2*dt;
  w.ph+=((7.4-Math.min(w.no3,80)*.012)-w.ph)*.03*dt;
  const clt=100-w.nh3*30-w.alg*.5-Math.max(0,w.no3-20)*.3-t.food.filter(f=>f.rot).length*1.2+t.eq.filter*5;
  w.clar+=(clamp(clt,5,100)-w.clar)*.1*dt;
  w.nh3=clamp(w.nh3,0,8);w.no3=clamp(w.no3,0,200);
}
function waterStress(t,f){
  const w=t.w,S=SPECIES[f.sp];let s=0;
  s+=clamp((w.nh3-.3)*55,0,50);s+=clamp((w.no3-40)*.5,0,25);s+=clamp((4.5-w.o2)*14,0,45);
  s+=clamp((S.temp[0]-w.temp)*12,0,45)+clamp((w.temp-S.temp[1])*12,0,45);
  s+=clamp(((bioload(t)/tankCap(t))-1)*40,0,35);
  s+=f.sick?20:0;
  return clamp(s,0,100);
}
function eatFood(t,f,fd){
  const F=FOODS[fd.type];
  f.hunger=clamp(f.hunger-F.hunger,0,100);
  if(F.boost)f.fresh=clamp(f.fresh+.25,0,1);
  if(F.fry&&f.stage==='fry')f.growBoost=3*DAY;
  t.w.nh3+=.01*F.waste*0;fd.eaten=true;f.eaten++;
  for(let i=0;i<3;i++)t.parts.push({x:f.x+f.dir*12,y:f.y,vx:rnd(-8,8),vy:rnd(-12,0),life:.6,c:'#fff8'});
  sfx('pop');
}
function dayTick(t){
  // yaş, büyüme, hastalık, doğum, ölüm — günde bir
  const w=t.w;
  if(t.mutT>0)t.mutT--;
  for(const f of t.fish.slice()){
    if(f.dead)continue;
    f.age++;f.stage=stageOf(f);
    f.cool=Math.max(0,f.cool-1);
    if(f.age>f.life&&chance(.35)){kill(t,f,'yaşlılıktan');continue}
    // hastalık
    if(!f.sick){
      let pr=.002;if(w.temp<SPECIES[f.sp].temp[0]-2)pr+=.05;if(w.clar<50)pr+=.04;if(f.stress>55)pr+=.05;
      if(t.fish.some(o=>o.sick))pr+=.03;
      if(chance(pr)){f.sick={type:w.temp<24?'Beyaz Benek (Ich)':'Yüzgeç Çürümesi',days:0};toast(`🤒 ${f.name} hastalandı: ${f.sick.type}. İlaç ver ya da suyu düzelt.`,'bad')}
    }else{f.sick.days++;f.health-=6;if(f.sick.days>9&&chance(.2)){f.sick=null;toast(`💪 ${f.name} kendiliğinden iyileşti.`)}}
    // gebelik
    if(f.preg){f.preg.left-=(w.temp>26?1.15:1);
      if(f.preg.left<=0)giveBirth(t,f)}
  }
  // ölü yem çürümesi
  t.food=t.food.filter(x=>!x.rot||(x.rotT++<2));
  // orta gece vb. günlük
}
function kill(t,f,why){
  f.dead=true;f.vy=0;f.vx=0;sfx('low');
  toast(`💀 ${f.name} (${SPECIES[f.sp].name}) öldü${why?' — '+why:''}. Ölü balığı al, yoksa suyu kirletir.`,'bad');
}
function giveBirth(t,mom){
  const S=SPECIES[mom.sp],dad=mom.sperm;
  if(!dad){mom.preg=null;return}
  const size=phenotype(mom).size;
  let n=Math.round(rint(...S.litter)*size*(.6+mom.fresh*.6)*(mom.health/100)*(mom.inbredMate?.75:1));
  n=clamp(n,1,45);
  const room=tankCap(t)*3-t.fish.length;n=Math.min(n,Math.max(2,room));
  const mut=t.mutT>0?2.2:1;
  let nm=[],newVar=0;
  for(let i=0;i<n;i++){
    const c=breed(mom,dad.genes,mut);
    const f=newFish(mom.sp,{x:mom.x+rnd(-14,14),y:mom.y+rnd(-8,8),age:0,gen:Math.max(mom.gen,dad.gen)+1,lin:[mom.id,dad.id,...(mom.lin||[]).slice(0,2),...(dad.lin||[]).slice(0,2)],iso:mom.iso});
    f.g=c.g;f.stage='fry';f.inbred=related(mom,dad.ref);f.mother=mom.name;f.father=dad.name;
    if(f.inbred){f.life*=.85}
    f.iso=mom.iso;
    t.fish.push(f);
    if(discover(f)){newVar++}
    for(const m of c.mutated)nm.push(m);
    G.born++;
  }
  mom.preg=null;mom.cool=1;dad.uses--;if(dad.uses<=0)mom.sperm=null;
  mom.health-=8;
  for(let i=0;i<12;i++)t.bubbles.push({x:mom.x,y:mom.y,r:rnd(2,5),vy:-rnd(30,60),life:2});
  sfx('birth');
  toast(`🍼 <b>${mom.name}</b> ${n} yavru doğurdu!`+(mom.iso?'':' (Yetişkinler yavruları yiyebilir!)'),'');
  if(nm.length){const [g,id]=nm[0];toast(`🧬 <b>MUTASYON!</b> ${GNAME[g]}: ${allele(mom.sp,g,id).name}`,'gold');sfx('win');addXP(10)}
  if(newVar){toast(`📖 ${newVar} yeni varyasyon keşfettin! (Ansiklopedi)`,'gold');addXP(8*newVar)}
  addXP(n);
}
function tryMate(t,m,f){
  if(f.preg||f.cool>0||f.sex!=='F'||m.sex!=='M')return false;
  if(f.stage!=='adult'&&f.stage!=='old')return false;if(m.stage==='fry'||m.stage==='juv')return false;
  if(f.iso!==m.iso)return false;
  // dişi tercihi: renkli, büyük erkek
  const attract=.25+rarityScore(m)/60+m.fresh*.2;
  if(!chance(attract*.5))return false;
  f.sperm={genes:{sp:m.sp,g:JSON.parse(JSON.stringify(m.g)),id:m.id,lin:m.lin,vigor:m.vigor,_mut:[]},uses:3,gen:m.gen,name:m.name,ref:m};
  f.sperm.genes.id=m.id;f.sperm.gen=m.gen;
  f.inbredMate=related(f,m);
  f.preg={left:SPECIES[f.sp].gest*(1+(f.health<50?.2:0))};
  if(f.sperm){f.sperm.genes._mut=[];}
  for(let i=0;i<5;i++)t.parts.push({heart:1,x:(f.x+m.x)/2+rnd(-10,10),y:f.y-14,vx:rnd(-10,10),vy:-rnd(14,30),life:1.4});
  sfx('heart');
  return true;
}
// sperm.genes breed için {sp,g,_mut} yeterli
function fishAI(t,f,dt){
  const S=SPECIES[f.sp],p=phenotype(f);
  const sc=bodyScale(f);
  if(f.dead){ // yüzeye çıkar
    f.vy+=(-18-f.vy)*dt*.4;f.vx*=.97;f.y=Math.max(SURF+8,f.y+f.vy*dt);f.x+=f.vx*dt;return;
  }
  // hareket sınırı
  let bx0=24,bx1=W-24,by0=SURF+14,by1=FLOOR-6;
  if(f.iso&&t.eq.nursery){const b=t.box;bx0=b.x+10;bx1=b.x+b.w-10;by0=b.y+14;by1=b.y+b.h-8}
  f.tt-=dt;
  const night=!(G.time>=7&&G.time<21);
  const food=t.food.filter(x=>!x.eaten&&!x.rot&&!(f.iso&&t.eq.nursery)&&FOODS[x.type]);
  let target=null,speed=(f.stage==='fry'?44:62)*(night?.5:1)*(1.05-f.stress/220);
  if(f.sick)speed*=.55;
  const hungry=f.hunger>35;
  if(hungry&&food.length){
    let best=null,bd=1e9;
    for(const x of food){if(f.eatsAlgae!==undefined&&0)continue;const d=(x.x-f.x)**2+(x.y-f.y)**2;if(d<bd){bd=d;best=x}}
    if(best){target=best;speed*=1.7}
  }
  // yosun yeme (moli) ve algde yemek
  if(!target&&f.hunger>50&&t.w.alg>12&&f.sp==='molly'&&!(f.iso&&t.eq.nursery)){target={x:f.x,y:FLOOR-30,alg:1};f.eatsAlgae=1}else f.eatsAlgae=undefined;
  // kur yapma
  if(!target&&f.sex==='M'&&(f.stage==='adult')&&!f.dead){
    let best=null,bd=1e9;
    for(const o of t.fish){if(o.sex==='F'&&!o.dead&&!o.preg&&o.cool<=0&&o.sp===f.sp&&o.iso===f.iso&&(o.stage==='adult'||o.stage==='old')){const d=(o.x-f.x)**2+(o.y-f.y)**2;if(d<bd){bd=d;best=o}}}
    if(best&&bd<420*420){target=best;speed*=1.25;if(bd<38*38&&chance(dt*.8)){tryMate(t,f,best)}}
  }
  // yavru: bitkiye saklan
  if(!target&&f.stage==='fry'&&t.plants.length&&!f.iso){
    if(f.tt<=0){const pl=pick(t.plants);f.tx=pl.x+rnd(-30,30);f.ty=FLOOR-rnd(20,100);f.tt=rnd(3,8)}
    target={x:f.tx,y:f.ty};
  }
  if(!target){
    if(f.tt<=0){f.tx=rnd(bx0,bx1);f.ty=f.sick?by1-rnd(0,40):night?rnd(by1-160,by1):rnd(by0+20,by1-50);f.tt=rnd(2,6)}
    target={x:f.tx,y:f.ty};speed*=.75;
  }
  const dx=target.x-f.x,dy=target.y-f.y,d=Math.hypot(dx,dy)||1;
  const want=Math.min(speed,d*2.5);
  f.vx+=((dx/d)*want-f.vx)*dt*2.2;f.vy+=((dy/d)*want-f.vy)*dt*2.2;
  // ayrılma
  for(const o of t.fish){if(o===f||o.dead||o.iso!==f.iso)continue;const ox=f.x-o.x,oy=f.y-o.y,od=Math.hypot(ox,oy);if(od<22*sc&&od>0){f.vx+=ox/od*18*dt;f.vy+=oy/od*18*dt}}
  f.x=clamp(f.x+f.vx*dt,bx0,bx1);f.y=clamp(f.y+f.vy*dt,by0,by1);
  if(Math.abs(f.vx)>6)f.dir=f.vx>0?1:-1;
  f.ph+=dt*(3+Math.hypot(f.vx,f.vy)*.08);
  // yem yeme
  if(target&&target.type&&d<12*sc+6&&!target.eaten){eatFood(t,f,target)}
  if(target&&target.alg&&f.y>FLOOR-60&&chance(dt*1.2)){t.w.alg=Math.max(0,t.w.alg-1.2);f.hunger=Math.max(0,f.hunger-4)}
  // yavru yeme
  if(f.hunger>65&&f.stage==='adult'&&!f.iso&&chance(dt*.5)){
    for(const o of t.fish){if(o.stage==='fry'&&!o.dead&&!o.iso&&(o.x-f.x)**2+(o.y-f.y)**2<26*26){
      const cover=t.plants.some(pl=>Math.abs(pl.x-o.x)<60&&o.y>FLOOR-170*pl.h)?.7:0;
      if(!chance(cover)){o.dead=true;o.gone=true;f.hunger-=18;for(let i=0;i<4;i++)t.parts.push({x:o.x,y:o.y,vx:rnd(-14,14),vy:rnd(-14,4),life:.5,c:'#ff8a8a99'});break}}}
  }
}
function bodyScale(f){
  const S=SPECIES[f.sp],p=phenotype(f);
  const mat=S.mature;
  const grow=f.stage==='fry'?.25+f.age/(mat*.45)*.3:f.stage==='juv'?.55+(f.age-mat*.45)/(mat*.55)*.4:1;
  const sx=f.sex==='M'?S.mscale:S.fscale;
  return grow*sx*p.size*1.45;
}
function fishNeeds(t,f,dt){
  if(f.dead){ // ölü balık suyu kirletir
    t.w.nh3+=dt*.002;return}
  f.hunger=clamp(f.hunger+dt*(f.stage==='fry'?1.1:.6)*(1/ (DAY/42)),0,100);
  f.fresh=clamp(f.fresh-dt*.003,0,1);
  f.stress+=(waterStress(t,f)-f.stress)*dt*.4;
  let dh=0;
  if(f.hunger>92)dh-=1.0;if(f.stress>60)dh-=(f.stress-60)*.025;
  if(f.hunger<60&&f.stress<30&&!f.sick)dh+=.35;
  f.health=clamp(f.health+dh*dt,0,100);
  if(f.health<=0)kill(t,f,f.hunger>88?'açlıktan':f.sick?'hastalıktan':'kötü su koşullarından');
  // büyüme: gün başına yaş artıyor (dayTick). Yavru tozu hız verir
  if(f.growBoost>0){f.growBoost-=dt;f.ageAcc=(f.ageAcc||0)+dt;if(f.ageAcc>DAY/3){f.ageAcc=0;if(f.stage==='fry'||f.stage==='juv'){f.age+=1;f.stage=stageOf(f)}}}
}

/* ---- Ekonomi, siparişler, sergi ---- */
function matches(f,o){
  if(f.sp!==o.sp||f.dead)return false;
  const p=phenotype(f);
  for(const [g,id] of Object.entries(o.req))if(p[g].id!==id)return false;
  if(o.sex&&f.sex!==o.sex)return false;
  if(f.stage!=='adult'&&f.stage!=='old')return false;
  if(o.minSize&&p.size<o.minSize)return false;
  return f.health>=50;
}
function genOrders(){
  while(G.orders.length<Math.min(5,2+Math.floor(G.lvl/2))){
    const sps=Object.keys(G.unlocked).filter(s=>G.unlocked[s]);const sp=pick(sps);
    const n=Math.min(1+Math.floor(G.lvl/2),3),genes=['color','pattern','tail','fin','dorsal','shine'].sort(()=>Math.random()-.5).slice(0,n);
    const req={};let val=SPECIES[sp].price;
    for(const g of genes){const pool=SPECIES[sp][g].filter(a=>!a.rare||G.lvl>=5);const a=pick(pool);req[g]=a.id;val*=1+(a.v-1)*.45}
    const sex=chance(.4)?pick(['F','M']):null;
    const o={id:G.orderN++,sp,req,sex,reward:Math.round(val*1.8+25),expires:G.day+rint(14,28),cust:pick(['Ahmet Bey','Ayşe Hanım','Akvaryum Kulübü','Zehra','Mert','Balıkçı Cemal','Dr. Elif','Pet Dünyası'])};
    G.orders.push(o);
  }
}
function judgeShow(fish){
  const sc=f=>rarityScore(f)*3+phenotype(f).size*8+f.health/8+(f.stage==='adult'?6:0)+f.fresh*5;
  const mine=sc(fish)+rnd(-3,3);
  const rivals=Array.from({length:6},()=>20+rnd(0,22)+G.lvl*3+G.day*.12);
  const rank=1+rivals.filter(r=>r>mine).length;
  const prize=[0,400,220,120][rank]||30;
  return{rank,prize,mine:Math.round(mine),best:Math.round(Math.max(...rivals))};
}
function hourly(){
  G.time+=1;
  if(G.time>=24){G.time=0;G.day++;onNewDay()}
}
function onNewDay(){
  for(const t of G.tanks)dayTick(t);
  G.orders=G.orders.filter(o=>{if(o.expires<G.day){toast(`⌛ Sipariş süresi doldu: ${o.cust}`,'bad');return false}return true});
  genOrders();
  G.stats.money.push(G.money);G.stats.pop.push(G.tanks.reduce((s,t)=>s+t.fish.filter(f=>!f.dead).length,0));
  if(G.stats.money.length>80){G.stats.money.shift();G.stats.pop.shift()}
  if(G.day>=G.show.next&&!G.show.active){G.show.active=true;toast('🏆 <b>Akvaryum Sergisi</b> başladı! En iyi balığını yarıştır (üst menü).','gold')}
  checkAch();save();
}

   case 'mosaic':{for(let i=0;i<22;i++){const x=-bl*.45+rs()*bl*.7,y=(rs()-.5)*bh*1.1;c.fillStyle=rs()>.5?dk:lt;c.fillRect(x,y,bl*.06,bl*.05)}break}

   case 'leopard':{c.strokeStyle='rgba(20,10,0,.7)';c.lineWidth=1.3;for(let i=0;i<10;i++){c.beginPath();c.arc((rs()-.55)*bl*.85,(rs()-.5)*bh*.8,bl*.035,0,6.28);c.stroke()}break}

   case 'panda':{c.fillStyle='rgba(8,8,12,.85)';c.beginPath();c.ellipse(bl*.28,-bh*.05,bl*.12,bh*.45,0,0,6.28);c.fill();c.beginPath();c.ellipse(-bl*.32,0,bl*.16,bh*.5,0,0,6.28);c.fill();c.fillStyle='rgba(255,255,255,.35)';c.fillRect(-bl*.15,-bh,bl*.3,bh*2);break}
   case 'tux':{c.fillStyle='rgba(8,8,16,.78)';c.fillRect(-bl*.5,0,bl,bh);c.fillRect(-bl*.5,-bh,bl*.35,bh*2);break}

function plantDraw(c,pl,t,time){
  const P=PLANTS[pl.type],rs=mulberry(pl.seed),g=pl.size,hh=(pl.type==='moss'?60:pl.type==='val'?190:pl.type==='sword'?130:pl.type==='cabomba'?160:150)*pl.h*Math.min(1,.25+g*.75);
  const n=pl.type==='moss'?9:pl.type==='val'?7:pl.type==='sword'?5:6;
  for(let i=0;i<n;i++){
    const ox=(i-n/2)*(pl.type==='moss'?7:9)+rs()*5,len=hh*(.65+rs()*.4);
    const sway=Math.sin(time*1.1+i*.8+pl.seed)*12*(len/150);
    c.beginPath();c.moveTo(pl.x+ox,FLOOR+4);
    if(pl.type==='cabomba'||pl.type==='ludwig'){
      c.strokeStyle=hsl(P.col,rs()*10-5,0,.9);c.lineWidth=3;c.quadraticCurveTo(pl.x+ox+sway*.4,FLOOR-len*.5,pl.x+ox+sway,FLOOR-len);c.stroke();
      for(let j=1;j<7;j++){const f=j/7,bx=pl.x+ox+sway*f*f,by=FLOOR-len*f;c.beginPath();c.moveTo(bx,by);c.lineTo(bx-12,by-6);c.moveTo(bx,by);c.lineTo(bx+12,by-6);c.lineWidth=1.8;c.stroke()}
    }else if(pl.type==='moss'){
      c.fillStyle=hsl(P.col,rs()*12,0,.95);c.arc(pl.x+ox,FLOOR-len*.4,8+rs()*7,0,6.28);c.fill();
    }else{
      const wd=pl.type==='sword'?14:5;
      c.fillStyle=hsl(P.col,rs()*14-6,i*2,.92);
      c.quadraticCurveTo(pl.x+ox+sway*.5-wd,FLOOR-len*.5,pl.x+ox+sway,FLOOR-len);c.quadraticCurveTo(pl.x+ox+sway*.5+wd,FLOOR-len*.5,pl.x+ox+wd*.3,FLOOR+4);c.fill();
    }
  }
}

}

  let body='<p class="dim">Akvaryumda yetişkin dişi ve erkek gerekli.</p>';
  if(F&&M){
    const rel=related(F,M);
    body=`<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px">♀ ${sel(fs,F,'pf')} ♂ ${sel(ms.filter(m=>m.sp===F.sp),M,'pm')}</div>
     ${rel?'<p style="color:var(--warn)">⚠ Bu ikisi akraba! Yavrularda ömür/verim düşer, değeri %20 azalır.</p>':''}
     <p>Beklenen: ~${SPECIES[F.sp].gest} gün gebelik · ${SPECIES[F.sp].litter.join('–')} yavru. <span class="dim">Mutasyon şansı ~%${(MUT_BASE*100).toFixed(0)}/gen.</span></p>`;
    for(const g of GENES.slice(0,6)){
      const dist={};
      for(const a of F.g[g])for(const b of M.g[g]){const A=allele(F.sp,g,a),B=allele(F.sp,g,b),ph=(A.d>=B.d?A:B);dist[ph.id]=(dist[ph.id]||0)+.25}
      const parts=Object.entries(dist).sort((x,y)=>y[1]-x[1]);
      const cols=['#3ddcc0','#fbbf24','#c084fc','#f87171','#60a5fa'];
      body+=`<div><b>${GNAME[g]}</b><div class="pbar">${parts.map(([id,p],i)=>`<i style="width:${p*100}%;background:${cols[i%5]}">${Math.round(p*100)}% ${allele(F.sp,g,id).name}</i>`).join('')}</div></div>`;
    }
    const comb=GENES.slice(0,6).reduce((n,g)=>{const s=new Set();for(const a of F.g[g])for(const b of M.g[g]){const A=allele(F.sp,g,a),B=allele(F.sp,g,b);s.add((A.d>=B.d?A:B).id)}return n*s.size},1);
    body+=`<p class="dim">Bu çiftten çıkabilecek farklı görünüm sayısı: <b>${comb}</b></p>`;
  }
  openModal('🧬 Üreme Planlayıcı',body);
}

function line(cn,d,col){const c=cn.getContext('2d'),w=cn.width,h=cn.height;c.fillStyle='#0a1a2a';c.fillRect(0,0,w,h);if(d.length<2){c.fillStyle='#8fb3d1';c.fillText('Veri için birkaç gün bekle…',10,20);return}
  const mx=Math.max(...d)*1.1||1,mn=Math.min(...d,0);c.strokeStyle='#1d3d5c';for(let i=0;i<4;i++){c.beginPath();c.moveTo(0,h*i/4);c.lineTo(w,h*i/4);c.stroke()}
  c.strokeStyle=col;c.lineWidth=2.5;c.beginPath();d.forEach((v,i)=>{const x=i/(d.length-1)*(w-20)+10,y=h-10-(v-mn)/(mx-mn||1)*(h-24);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();
  c.fillStyle='#8fb3d1';c.font='11px sans-serif';c.fillText(Math.round(mx),4,12);c.fillText(Math.round(d[d.length-1]),w-40,14)}
function bars(cn,o){const c=cn.getContext('2d'),w=cn.width,h=cn.height;c.fillStyle='#0a1a2a';c.fillRect(0,0,w,h);const k=Object.keys(o);if(!k.length)return;const mx=Math.max(...Object.values(o));
  k.forEach((n,i)=>{const bw=w/k.length,x=i*bw+12,bh=o[n]/mx*(h-50);c.fillStyle=['#3ddcc0','#fbbf24','#c084fc','#f87171'][i%4];c.fillRect(x,h-28-bh,bw-24,bh);c.fillStyle='#e6f4ff';c.font='12px sans-serif';c.fillText(n,x,h-12);c.fillText(o[n],x+4,h-32-bh)})}

let last=performance.now(),hourAcc=0,uiAcc=0,wAcc=0;
function tickWorld(dt){
  hourAcc+=dt;const hl=DAY/24;
  while(hourAcc>=hl){hourAcc-=hl;hourly()}
  for(const t of G.tanks){
    stepWater(t,dt);
    for(const f of t.fish){fishNeeds(t,f,dt);fishAI(t,f,dt)}
    t.fish=t.fish.filter(f=>!f.gone);
    // bitki büyümesi
    for(const p of t.plants)p.size=Math.min(1,p.size+dt*(t.w.no3>3?.004:.0008)*(t.light?1.3:.5));
    // yemler
    for(const f of t.food){f.y+=f.vy*dt;f.vy*=.995;if(f.y>FLOOR-4){f.y=FLOOR-4;f.vy=0;f.age+=dt;if(f.age>8){if(!f.rot){f.rot=true;t.w.nh3+=.04}}}f.x+=Math.sin(f.y*.1)*.2}
    t.food=t.food.filter(f=>!f.eaten&&!(f.rot&&f.age>16));
    // baloncuk
    if(t.eq.air&&chance(dt*8))t.bubbles.push({x:969+rnd(-3,3),y:FLOOR-4,r:rnd(1.5,4),vy:-rnd(60,110),life:3});
    if(t.eq.filter&&chance(dt*3))t.bubbles.push({x:W-18,y:SURF+110,r:rnd(1,3),vy:-rnd(30,60),life:1.5});
    for(const b of t.bubbles){b.y+=b.vy*dt;b.x+=Math.sin(b.y*.05)*.3;b.life-=dt*.3;if(b.y<SURF)b.life=0}
    t.bubbles=t.bubbles.filter(b=>b.life>0);
    for(const p of t.parts){p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;p.life-=dt}
    t.parts=t.parts.filter(p=>p.life>0);
  }
}
let samp=0;
function frame(now){
  let dt=Math.min(.1,(now-last)/1000);last=now;
  const sp=G.speed;
  if(sp>0){
    const steps=sp;for(let i=0;i<steps;i++)tickWorld(dt);
    samp+=dt*sp;if(samp>2){samp=0;for(const t of G.tanks){t.hist.push({nh3:t.w.nh3,no3:t.w.no3,o2:t.w.o2});if(t.hist.length>60)t.hist.shift()}}
  }
  render(dt*(sp?1:0));
  uiAcc+=dt;if(uiAcc>.5){uiAcc=0;uiLight()}
  requestAnimationFrame(frame);
}
