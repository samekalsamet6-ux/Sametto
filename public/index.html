<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>TCL Kumanda</title>
<style>
:root{--bg:#0b0d12;--card:#161a23;--btn:#222838;--btn2:#2c3448;--fg:#eef1f7;--mut:#8b93a7;--acc:#e4002b}
@media (prefers-color-scheme:light){:root{--bg:#f2f4f8;--card:#fff;--btn:#e6e9f0;--btn2:#d7dbe6;--fg:#161a23;--mut:#5b6478}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding:12px 16px calc(24px + env(safe-area-inset-bottom));max-width:440px;margin:auto}
header{display:flex;gap:8px;align-items:center;margin-bottom:12px}
select,input{flex:1;background:var(--card);color:var(--fg);border:1px solid var(--btn2);border-radius:12px;padding:12px;font-size:16px;min-width:0;user-select:text}
button{background:var(--btn);color:var(--fg);border:0;border-radius:14px;min-height:52px;font-size:17px;cursor:pointer;touch-action:manipulation}
button:active{background:var(--btn2);transform:scale(.96)}
.grid{display:grid;gap:10px;margin:12px 0}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.pwr{background:var(--acc);color:#fff}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);padding:12px;border-radius:28px}
.dpad button{min-height:64px;font-size:22px}.dpad .ok{background:var(--acc);color:#fff;border-radius:50%}
.vol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rocker{display:grid;grid-template-rows:1fr 1fr;gap:6px;background:var(--card);border-radius:20px;padding:6px}
.rocker small{text-align:center;color:var(--mut);align-self:center;font-size:12px}
.sm{font-size:13px;min-height:44px}
details{background:var(--card);border-radius:14px;padding:4px 12px;margin:10px 0}summary{padding:10px 0;color:var(--mut);cursor:pointer}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
dialog{background:var(--card);color:var(--fg);border:0;border-radius:18px;width:min(92vw,400px);padding:18px}dialog::backdrop{background:#0009}
dialog h3{margin:0 0 10px}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}.found{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.hint{color:var(--mut);font-size:13px;line-height:1.4}
</style>
</head>
<body>
<header>
  <select id="dev" aria-label="TV"></select>
  <button id="add" style="width:52px" aria-label="TV ekle">＋</button>
</header>
<div id="remote" hidden>
  <div class="grid g3">
    <button data-k="power" class="pwr">⏻</button><button data-k="input" class="sm">Giriş</button><button data-k="mute">🔇</button>
  </div>
  <div class="dpad">
    <span></span><button data-k="up">▲</button><span></span>
    <button data-k="left">◀</button><button data-k="ok" class="ok">OK</button><button data-k="right">▶</button>
    <span></span><button data-k="down">▼</button><span></span>
  </div>
  <div class="grid g3"><button data-k="back">↩</button><button data-k="home">⌂</button><button data-k="menu">☰</button></div>
  <div class="vol">
    <div class="rocker"><button data-k="volup" data-hold>＋</button><small>SES</small><button data-k="voldown" data-hold>－</button></div>
    <div class="rocker"><button data-k="chup" data-hold>⌃</button><small>KANAL</small><button data-k="chdown" data-hold>⌄</button></div>
  </div>
  <div class="grid g4"><button data-k="rewind">⏪</button><button data-k="playpause">⏯</button><button data-k="forward">⏩</button><button data-k="stop">⏹</button></div>
  <div class="grid g3" id="apps"></div>
  <details><summary>Rakamlar &amp; daha fazla</summary>
    <div class="grid g3">
      <button data-k="n1">1</button><button data-k="n2">2</button><button data-k="n3">3</button>
      <button data-k="n4">4</button><button data-k="n5">5</button><button data-k="n6">6</button>
      <button data-k="n7">7</button><button data-k="n8">8</button><button data-k="n9">9</button>
      <button data-k="info" class="sm">Bilgi</button><button data-k="n0">0</button><button data-k="settings" class="sm">Ayarlar</button>
    </div>
    <div class="grid g4"><button data-k="hdmi1" class="sm">HDMI1</button><button data-k="hdmi2" class="sm">HDMI2</button><button data-k="hdmi3" class="sm">HDMI3</button><button data-k="hdmi4" class="sm">HDMI4</button></div>
    <div class="grid g4"><button data-k="red" class="sm" style="background:#c62828">K</button><button data-k="green" class="sm" style="background:#2e7d32">Y</button><button data-k="yellow" class="sm" style="background:#f9a825;color:#000">S</button><button data-k="blue" class="sm" style="background:#1565c0">M</button></div>
    <div class="row"><input id="txt" placeholder="TV'ye yazı gönder" enterkeyhint="send"><button id="sendTxt" style="flex:0 0 70px">Gönder</button></div>
    <div class="row"><button id="unpair" class="sm">Bu TV'yi sil</button></div>
  </details>
</div>
<p id="empty" class="hint" hidden>Henüz TV eklenmedi. Sağ üstteki ＋ ile TCL TV'nizi ekleyin.</p>
<div id="toast"></div>

<dialog id="dlgAdd">
  <h3>TV ekle</h3>
  <p class="hint">TV ve telefon aynı Wi-Fi ağında olmalı.</p>
  <div class="found" id="found"></div>
  <button id="scan" class="sm" style="width:100%">Ağda ara</button>
  <div class="row"><input id="ip" inputmode="decimal" placeholder="TV IP (ör. 192.168.1.20)"></div>
  <div class="row"><input id="nm" placeholder="Ad (isteğe bağlı)"></div>
  <div class="row"><button id="addCancel">İptal</button><button id="addOk" class="pwr">Ekle</button></div>
</dialog>
<dialog id="dlgPair">
  <h3>Eşleştirme</h3>
  <p class="hint">TV ekranında görünen 6 haneli kodu girin.</p>
  <input id="pin" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="______" style="text-align:center;letter-spacing:6px;font-size:24px;width:100%">
  <div class="row"><button id="pairCancel">İptal</button><button id="pairOk" class="pwr">Onayla</button></div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
let devices = [], cur = localStorage.getItem('dev') || '';
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2500); };
async function api(path, method = 'GET', body) {
  const r = await fetch('/api/' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
const guard = (fn) => async (...a) => { try { return await fn(...a); } catch (e) { toast(e.message); } };
const dev = () => devices.find((d) => d.id === cur);

async function load() {
  devices = await api('devices');
  if (!dev()) cur = devices[0] ? devices[0].id : '';
  $('#dev').innerHTML = devices.map((d) => `<option value="${d.id}">${d.name.replace(/[<&]/g, '')} (${d.host})</option>`).join('');
  $('#dev').value = cur;
  $('#remote').hidden = !devices.length; $('#empty').hidden = !!devices.length;
  if (dev() && !dev().paired) startPair();
}
$('#dev').onchange = (e) => { cur = e.target.value; localStorage.setItem('dev', cur); if (!dev().paired) startPair(); };

const send = guard(async (key) => { navigator.vibrate && navigator.vibrate(10); await api('key', 'POST', { id: cur, key }); });
document.querySelectorAll('[data-k]').forEach((b) => {
  let timer;
  const stop = () => clearInterval(timer);
  b.addEventListener('pointerdown', () => { send(b.dataset.k); if (b.hasAttribute('data-hold')) timer = setInterval(() => send(b.dataset.k), 350); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((e) => b.addEventListener(e, stop));
});

api('meta').then((m) => {
  $('#apps').innerHTML = Object.entries(m.apps).map(([k, l]) => `<button class="sm" data-app="${k}">${l}</button>`).join('');
  document.querySelectorAll('[data-app]').forEach((b) => b.onclick = guard(() => api('launch', 'POST', { id: cur, app: b.dataset.app })));
});
$('#sendTxt').onclick = guard(async () => { await api('text', 'POST', { id: cur, text: $('#txt').value }); $('#txt').value = ''; });
$('#unpair').onclick = guard(async () => { if (confirm('Bu TV silinsin mi?')) { await api('devices?id=' + cur, 'DELETE'); await load(); } });

// Add TV
$('#add').onclick = () => { $('#found').innerHTML = ''; $('#dlgAdd').showModal(); scan(); };
$('#addCancel').onclick = () => $('#dlgAdd').close();
const scan = guard(async () => {
  $('#scan').textContent = 'Aranıyor…';
  const list = await api('discover').finally(() => $('#scan').textContent = 'Ağda ara');
  $('#found').innerHTML = list.length ? '' : '<span class="hint">Otomatik bulunamadı; IP adresini elle girin (TV: Ayarlar > Ağ).</span>';
  list.forEach((f) => { const b = document.createElement('button'); b.className = 'sm'; b.textContent = `${f.name} — ${f.host}`; b.onclick = () => { $('#ip').value = f.host; $('#nm').value = f.name; }; $('#found').append(b); });
});
$('#scan').onclick = scan;
$('#addOk').onclick = guard(async () => {
  const d = await api('devices', 'POST', { host: $('#ip').value, name: $('#nm').value });
  $('#dlgAdd').close(); cur = d.id; localStorage.setItem('dev', cur); await load();
});

// Pairing (Android/Google TV)
const startPair = guard(async () => { await api('pair/start', 'POST', { id: cur }); $('#pin').value = ''; if (!$('#dlgPair').open) $('#dlgPair').showModal(); });
$('#pairCancel').onclick = () => $('#dlgPair').close();
$('#pairOk').onclick = guard(async () => { await api('pair/code', 'POST', { id: cur, code: $('#pin').value }); $('#dlgPair').close(); toast('Eşleşti ✓'); await load(); });
load().catch((e) => toast(e.message));
</script>
</body>
</html>
